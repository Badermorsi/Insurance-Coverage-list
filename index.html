<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Insurance Coverage List</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f3f6fa;
    color: #1f2937;

    overflow: hidden;
}


/* =========================================================
   TOP HEADER
========================================================= */

.header {

    height: 62px;

    background: #ffffff;

    border-bottom: 1px solid #d7e0ea;

    display: flex;

    align-items: center;

    padding: 0 20px;

    position: relative;

    z-index: 1000;
}

.header-title {

    font-size: 22px;

    font-weight: 700;

    color: #123c69;
}


/* =========================================================
   TABS
========================================================= */

.tabs {

    height: 50px;

    display: flex;

    justify-content: center;

    align-items: flex-end;

    gap: 5px;

    background: #f3f6fa;

    padding: 0 10px;
}

.tab-button {

    height: 43px;

    padding: 0 30px;

    border: none;

    border-radius: 8px 8px 0 0;

    background: #dfe7f1;

    color: #29445e;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;
}

.tab-button:hover {

    background: #cfdbe8;
}

.tab-button.active {

    background: #123c69;

    color: white;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    height:
        calc(100vh - 112px);

    margin:
        0 8px 8px;

    background: white;

    border:
        1px solid #d6e0ea;

    border-radius:
        0 0 8px 8px;

    overflow: hidden;

    box-shadow:
        0 2px 10px
        rgba(0,0,0,.05);
}

.tab-content {

    display: none;

    width: 100%;

    height: 100%;

    flex-direction: column;
}

.tab-content.active {

    display: flex;
}


/* =========================================================
   SEARCH AREA
========================================================= */

.search-area {

    height: 55px;

    min-height: 55px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px 10px;

    background: white;

    border-bottom:
        1px solid #dce4ec;
}

.search-box {

    flex: 1;

    position: relative;
}

.search-box input {

    width: 100%;

    height: 38px;

    border:
        1px solid #c6d1dc;

    border-radius: 6px;

    outline: none;

    padding:
        0 38px 0 12px;

    font-size: 13px;
}

.search-box input:focus {

    border-color: #123c69;

    box-shadow:
        0 0 0 2px
        rgba(18,60,105,.10);
}

.search-icon {

    position: absolute;

    right: 12px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #64748b;
}

.clear-main {

    height: 38px;

    padding:
        0 16px;

    border: none;

    border-radius: 6px;

    background: #e8edf3;

    color: #334155;

    font-weight: 600;

    cursor: pointer;
}

.clear-main:hover {

    background: #d8e1eb;
}

.record-count {

    min-width: 125px;

    text-align: right;

    white-space: nowrap;

    color: #64748b;

    font-size: 12px;
}


/* =========================================================
   TABLE SCROLL AREA
========================================================= */

.excel-area {

    flex: 1;

    min-height: 0;

    overflow: auto;

    position: relative;

    background: white;
}


/* =========================================================
   TABLE
========================================================= */

.excel-table {

    border-collapse: separate;

    border-spacing: 0;

    table-layout: fixed;

    width: max-content;

    min-width: 100%;
}


/* =========================================================
   HEADER
========================================================= */

.excel-table thead {

    position: sticky;

    top: 0;

    z-index: 100;
}

.excel-table th {

    position: relative;

    height: 48px;

    min-width: 150px;

    padding: 0;

    background: #123c69;

    color: white;

    border-right:
        1px solid #496987;

    border-bottom:
        1px solid #092b4d;

    text-align: left;

    vertical-align: middle;
}

.header-title-cell {

    height: 48px;

    display: flex;

    align-items: center;

    padding:
        0 34px 0 8px;

    font-size: 11px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   FILTER BUTTON
========================================================= */

.filter-button {

    position: absolute;

    right: 4px;

    top: 12px;

    width: 25px;

    height: 24px;

    border: none;

    border-radius: 4px;

    background:
        rgba(255,255,255,.13);

    color: white;

    cursor: pointer;

    font-size: 11px;

    display: flex;

    align-items: center;

    justify-content: center;
}

.filter-button:hover {

    background:
        rgba(255,255,255,.30);
}

.filter-button.filtered {

    background: #f59e0b;

    color: #111827;
}


/* =========================================================
   TABLE BODY
========================================================= */

.excel-table td {

    height: 32px;

    max-width: 400px;

    padding:
        5px 8px;

    border-right:
        1px solid #e1e7ee;

    border-bottom:
        1px solid #e1e7ee;

    background: white;

    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.excel-table tbody tr:nth-child(even) td {

    background: #fafbfd;
}

.excel-table tbody tr:hover td {

    background: #edf5ff;
}


/* =========================================================
   YES / NO
========================================================= */

.yes-cell {

    background: #dcfce7 !important;

    color: #166534 !important;

    font-weight: 700;

    text-align: center;
}

.no-cell {

    background: #fee2e2 !important;

    color: #991b1b !important;

    font-weight: 700;

    text-align: center;
}


/* =========================================================
   FILTER POPUP
========================================================= */

.filter-popup {

    position: fixed;

    z-index: 999999;

    width: 290px;

    background: white;

    border:
        1px solid #bcc9d6;

    border-radius: 7px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.22);

    display: none;

    overflow: hidden;
}

.filter-popup.open {

    display: block;
}


/* =========================================================
   FILTER SEARCH
========================================================= */

.filter-popup-header {

    padding: 9px;

    background: #f8fafc;

    border-bottom:
        1px solid #e1e7ee;
}

.filter-search {

    width: 100%;

    height: 34px;

    border:
        1px solid #cbd5e1;

    border-radius: 5px;

    outline: none;

    padding:
        0 9px;

    font-size: 12px;
}

.filter-search:focus {

    border-color: #123c69;
}


/* =========================================================
   FILTER ACTIONS
========================================================= */

.filter-actions {

    display: flex;

    gap: 6px;

    padding: 8px;

    border-bottom:
        1px solid #e1e7ee;
}

.filter-action {

    flex: 1;

    height: 30px;

    background: white;

    border:
        1px solid #cbd5e1;

    border-radius: 4px;

    cursor: pointer;

    font-size: 11px;

    font-weight: 600;
}

.filter-action:hover {

    background: #f1f5f9;
}


/* =========================================================
   FILTER VALUES
========================================================= */

.filter-values {

    height: 270px;

    overflow-y: auto;

    padding: 4px 0;
}

.filter-value {

    display: flex;

    align-items: center;

    gap: 7px;

    height: 29px;

    padding:
        0 9px;

    cursor: pointer;

    font-size: 11px;
}

.filter-value:hover {

    background: #edf5ff;
}

.filter-value input {

    width: 14px;

    height: 14px;

    margin: 0;

    cursor: pointer;
}

.filter-value span {

    flex: 1;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.filter-too-many {

    padding: 8px;

    color: #64748b;

    font-size: 10px;

    text-align: center;

    border-top:
        1px solid #e2e8f0;
}


/* =========================================================
   FILTER FOOTER
========================================================= */

.filter-footer {

    display: flex;

    gap: 7px;

    padding: 8px;

    background: #f8fafc;

    border-top:
        1px solid #e1e7ee;
}

.cancel-filter {

    width: 80px;

    height: 34px;

    border:
        1px solid #cbd5e1;

    border-radius: 5px;

    background: white;

    cursor: pointer;
}

.apply-filter {

    flex: 1;

    height: 34px;

    border: none;

    border-radius: 5px;

    background: #123c69;

    color: white;

    font-weight: 700;

    cursor: pointer;
}

.apply-filter:hover {

    background: #0e3156;
}


/* =========================================================
   LOADING
========================================================= */

.loading-screen {

    position: absolute;

    inset: 0;

    z-index: 200;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 10px;

    background:
        rgba(255,255,255,.94);

    color: #475569;

    font-size: 14px;
}

.spinner {

    width: 28px;

    height: 28px;

    border:
        3px solid #dbe5ef;

    border-top-color:
        #123c69;

    border-radius: 50%;

    animation:
        spin .7s linear infinite;
}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}


/* =========================================================
   ERROR
========================================================= */

.load-error {

    max-width: 600px;

    padding: 20px;

    text-align: center;

    color: #b91c1c;

    line-height: 1.6;
}

.load-error strong {

    display: block;

    margin-bottom: 8px;

    font-size: 15px;
}


/* =========================================================
   NO RESULTS
========================================================= */

.no-results {

    padding: 40px;

    text-align: center;

    color: #64748b;

    font-size: 14px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {

    .header {

        height: 55px;

        padding:
            0 12px;
    }

    .header-title {

        font-size: 18px;
    }

    .tabs {

        height: 46px;
    }

    .tab-button {

        height: 40px;

        padding:
            0 15px;

        font-size: 12px;
    }

    .container {

        height:
            calc(100vh - 101px);

        margin:
            0 3px 3px;
    }

    .search-area {

        height: 53px;

        min-height: 53px;

        padding: 7px;
    }

    .record-count {

        display: none;
    }

    .filter-popup {

        width: 270px;
    }
}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<div class="header">

    <div class="header-title">
        Insurance Coverage List
    </div>

</div>


<!-- =========================================================
     TABS
========================================================= -->

<div class="tabs">

    <button
        id="thiqaTabButton"
        class="tab-button active"
        onclick="switchTab('thiqa')">

        Thiqa Coverage List

    </button>

    <button
        id="haadTabButton"
        class="tab-button"
        onclick="switchTab('haad')">

        HAAD List

    </button>

</div>


<!-- =========================================================
     MAIN
========================================================= -->

<div class="container">


    <!-- =====================================================
         THIQA
    ====================================================== -->

    <div
        id="thiqa"
        class="tab-content active">

        <div class="search-area">

            <div class="search-box">

                <input
                    id="thiqaSearch"
                    type="text"
                    autocomplete="off"
                    placeholder="Search all Thiqa columns...">

                <span class="search-icon">
                    🔎
                </span>

            </div>

            <button
                class="clear-main"
                onclick="clearMainSearch('thiqa')">

                Clear

            </button>

            <div
                id="thiqaCount"
                class="record-count">

                Loading...

            </div>

        </div>


        <div
            id="thiqaArea"
            class="excel-area">

            <div
                id="thiqaLoading"
                class="loading-screen">

                <div class="spinner"></div>

                Loading Thiqa data...

            </div>

            <table
                id="thiqaTable"
                class="excel-table">

                <thead
                    id="thiqaHead">
                </thead>

                <tbody
                    id="thiqaBody">
                </tbody>

            </table>

        </div>

    </div>


    <!-- =====================================================
         HAAD
    ====================================================== -->

    <div
        id="haad"
        class="tab-content">

        <div class="search-area">

            <div class="search-box">

                <input
                    id="haadSearch"
                    type="text"
                    autocomplete="off"
                    placeholder="Search all HAAD columns...">

                <span class="search-icon">
                    🔎
                </span>

            </div>

            <button
                class="clear-main"
                onclick="clearMainSearch('haad')">

                Clear

            </button>

            <div
                id="haadCount"
                class="record-count">

                Loading...

            </div>

        </div>


        <div
            id="haadArea"
            class="excel-area">

            <div
                id="haadLoading"
                class="loading-screen">

                <div class="spinner"></div>

                Loading HAAD data...

            </div>

            <table
                id="haadTable"
                class="excel-table">

                <thead
                    id="haadHead">
                </thead>

                <tbody
                    id="haadBody">
                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- =========================================================
     FILTER POPUP
========================================================= -->

<div
    id="filterPopup"
    class="filter-popup">

    <div class="filter-popup-header">

        <input
            id="filterSearch"
            class="filter-search"
            type="text"
            autocomplete="off"
            placeholder="Search values...">

    </div>


    <div class="filter-actions">

        <button
            class="filter-action"
            onclick="selectAllFilterValues()">

            Select All

        </button>

        <button
            class="filter-action"
            onclick="clearAllFilterValues()">

            Clear All

        </button>

    </div>


    <div
        id="filterValues"
        class="filter-values">
    </div>


    <div class="filter-footer">

        <button
            class="cancel-filter"
            onclick="closeFilter()">

            Cancel

        </button>

        <button
            class="apply-filter"
            onclick="applyFilter()">

            Apply

        </button>

    </div>

</div>


<script>

/* =========================================================
   FILE NAMES
========================================================= */

const THIQA_FILE = "data.json";

const HAAD_FILE = "HAAD_LIST.json";


/* =========================================================
   PERFORMANCE
========================================================= */

const ROW_HEIGHT = 32;

const BUFFER_ROWS = 12;


/*
   Maximum number of checkbox values rendered
   at one time inside the filter popup.

   Search can be used to find additional values.
*/

const MAX_FILTER_OPTIONS = 500;


/* =========================================================
   DATA
========================================================= */

let thiqaData = [];

let haadData = [];

let thiqaResults = [];

let haadResults = [];

let thiqaColumns = [];

let haadColumns = [];


/* =========================================================
   FILTERS
========================================================= */

let thiqaFilters = new Map();

let haadFilters = new Map();


/* =========================================================
   GLOBAL SEARCH
========================================================= */

let thiqaMainSearch = "";

let haadMainSearch = "";


/* =========================================================
   SEARCH CACHE
========================================================= */

let thiqaSearchCache = [];

let haadSearchCache = [];


/* =========================================================
   FILTER POPUP STATE
========================================================= */

let activeFilterType = null;

let activeFilterColumn = null;

let activeFilterColumnName = "";

let activeFilterValues = new Set();

let allFilterValues = [];


/* =========================================================
   HAAD COLUMNS
========================================================= */

const HAAD_COLUMNS = [

    "Drug Code",

    "Insurance Plan",

    "Package Name",

    "Generic Code",

    "Generic Name",

    "Strength",

    "Dosage Form",

    "Package Size",

    "Dispense Mode",

    "Package Price to Public",

    "Package Price to Pharmacy",

    "Unit Price to Public",

    "Unit Price to Pharmacy",

    "Status",

    "Delete Effective Date",

    "Last Change Date",

    "Agent Name",

    "Manufacturer Name",

    "Insurance Coverage For Government Funded Program",

    "UPP Scope",

    "Included in Thiqa/ABM - other than 1&7 - Drug Formulary",

    "Included In Basic Drug Formulary",

    "Included In ABM 1 Drug Formulary",

    "Included In ABM 7 Drug Formulary",

    "Unit Markup",

    "Package Markup",

    "Thiqa Max. Reimbursement Price (Package)",

    "Thiqa co-pay amount (package)",

    "Basic co-pay amount (package)",

    "UPP Effective Date",

    "UPP Updated Date",

    "UPP Expiry Date"

];


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        setupSearch();

        loadData();

    }
);


/* =========================================================
   SEARCH SETUP
========================================================= */

function setupSearch() {

    const thiqaSearch =
        document.getElementById(
            "thiqaSearch"
        );

    const haadSearch =
        document.getElementById(
            "haadSearch"
        );

    const filterSearch =
        document.getElementById(
            "filterSearch"
        );


    thiqaSearch.addEventListener(
        "input",
        debounce(
            () => {

                thiqaMainSearch =
                    thiqaSearch.value
                        .trim()
                        .toLowerCase();

                applyAllFilters(
                    "thiqa"
                );

            },
            120
        )
    );


    haadSearch.addEventListener(
        "input",
        debounce(
            () => {

                haadMainSearch =
                    haadSearch.value
                        .trim()
                        .toLowerCase();

                applyAllFilters(
                    "haad"
                );

            },
            120
        )
    );


    filterSearch.addEventListener(
        "input",
        renderFilterValues
    );


    document.addEventListener(
        "mousedown",
        event => {

            const popup =
                document.getElementById(
                    "filterPopup"
                );


            if (
                popup.classList.contains(
                    "open"
                ) &&
                !popup.contains(
                    event.target
                ) &&
                !event.target.closest(
                    ".filter-button"
                )
            ) {

                closeFilter();

            }

        }
    );

}


/* =========================================================
   LOAD BOTH FILES
========================================================= */

async function loadData() {

    /*
       Both files are downloaded at the same time.
    */

    const results =
        await Promise.allSettled([

            fetchJson(
                THIQA_FILE
            ),

            fetchJson(
                HAAD_FILE
            )

        ]);


    /* =====================================================
       THIQA
    ====================================================== */

    if (
        results[0].status ===
        "fulfilled"
    ) {

        thiqaData =
            normalizeData(
                results[0].value
            );


        thiqaColumns =
            getColumns(
                thiqaData
            );


        thiqaResults =
            thiqaData;


        buildSearchCache(
            "thiqa"
        );


        renderHeader(
            "thiqa"
        );


        renderVirtualTable(
            "thiqa"
        );


        hideLoading(
            "thiqa"
        );

    }
    else {

        showLoadingError(
            "thiqa",
            results[0].reason
        );

    }


    /* =====================================================
       HAAD
    ====================================================== */

    if (
        results[1].status ===
        "fulfilled"
    ) {

        haadData =
            normalizeData(
                results[1].value
            );


        haadColumns =
            HAAD_COLUMNS;


        haadResults =
            haadData;


        buildSearchCache(
            "haad"
        );


        renderHeader(
            "haad"
        );


        renderVirtualTable(
            "haad"
        );


        hideLoading(
            "haad"
        );

    }
    else {

        showLoadingError(
            "haad",
            results[1].reason
        );

    }

}


/* =========================================================
   FETCH JSON
========================================================= */

async function fetchJson(
    file
) {

    const response =
        await fetch(
            file + "?v=" +
            Date.now(),
            {
                cache: "no-store"
            }
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "HTTP " +
            response.status +
            " - " +
            file
        );

    }


    return response.json();

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeData(
    json
) {

    if (
        Array.isArray(
            json
        )
    ) {

        return json;

    }


    if (
        json &&
        Array.isArray(
            json.data
        )
    ) {

        return json.data;

    }


    if (
        json &&
        Array.isArray(
            json.rows
        )
    ) {

        return json.rows;

    }


    if (
        json &&
        Array.isArray(
            json.records
        )
    ) {

        return json.records;

    }


    return [];

}


/* =========================================================
   GET COLUMNS
========================================================= */

function getColumns(
    data
) {

    if (
        !data.length
    ) {

        return [];

    }


    return Object.keys(
        data[0]
    );

}


/* =========================================================
   GET VALUE
========================================================= */

function getValue(
    row,
    column
) {

    if (
        !row ||
        typeof row !==
        "object"
    ) {

        return "";

    }


    if (
        Object.prototype.hasOwnProperty.call(
            row,
            column
        )
    ) {

        return row[column];

    }


    /*
       Case-insensitive fallback.
    */

    const target =
        String(column)
            .trim()
            .toLowerCase();


    const keys =
        Object.keys(
            row
        );


    for (
        let i = 0;
        i < keys.length;
        i++
    ) {

        if (
            keys[i]
                .trim()
                .toLowerCase() ===
            target
        ) {

            return row[
                keys[i]
            ];

        }

    }


    return "";

}


/* =========================================================
   VALUE TO TEXT
========================================================= */

function valueToText(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    if (
        typeof value ===
        "object"
    ) {

        try {

            return JSON.stringify(
                value
            );

        }
        catch {

            return String(
                value
            );

        }

    }


    return String(
        value
    );

}


/* =========================================================
   SEARCH CACHE
========================================================= */

function buildSearchCache(
    type
) {

    const data =
        type === "thiqa"
            ? thiqaData
            : haadData;

    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    const cache =
        new Array(
            data.length
        );


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        const row =
            data[i];


        let text = "";


        for (
            let c = 0;
            c < columns.length;
            c++
        ) {

            text +=
                valueToText(
                    getValue(
                        row,
                        columns[c]
                    )
                ) +
                " ";

        }


        cache[i] =
            text.toLowerCase();

    }


    if (
        type === "thiqa"
    ) {

        thiqaSearchCache =
            cache;

    }
    else {

        haadSearchCache =
            cache;

    }

}


/* =========================================================
   RENDER HEADER
========================================================= */

function renderHeader(
    type
) {

    const head =
        document.getElementById(
            type + "Head"
        );


    head.innerHTML = "";


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    if (
        !columns.length
    ) {

        return;

    }


    const row =
        document.createElement(
            "tr"
        );


    columns.forEach(
        (
            column,
            index
        ) => {

            const th =
                document.createElement(
                    "th"
                );


            th.style.width =
                getColumnWidth(
                    column
                );


            th.style.minWidth =
                getColumnWidth(
                    column
                );


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "header-title-cell";


            title.textContent =
                column;


            th.appendChild(
                title
            );


            const filterButton =
                document.createElement(
                    "button"
                );


            filterButton.className =
                "filter-button";


            filterButton.textContent =
                "▼";


            const filters =
                type === "thiqa"
                    ? thiqaFilters
                    : haadFilters;


            if (
                filters.has(
                    index
                )
            ) {

                filterButton.classList.add(
                    "filtered"
                );

            }


            filterButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    openFilter(
                        type,
                        index,
                        th,
                        column
                    );

                }
            );


            th.appendChild(
                filterButton
            );


            row.appendChild(
                th
            );

        }
    );


    head.appendChild(
        row
    );

}


/* =========================================================
   COLUMN WIDTH
========================================================= */

function getColumnWidth(
    column
) {

    const length =
        String(
            column
        ).length;


    if (
        length >= 55
    ) {

        return "340px";

    }


    if (
        length >= 35
    ) {

        return "280px";

    }


    if (
        length >= 20
    ) {

        return "220px";

    }


    return "170px";

}


/* =========================================================
   VIRTUAL TABLE
========================================================= */

function renderVirtualTable(
    type
) {

    const area =
        document.getElementById(
            type + "Area"
        );


    const body =
        document.getElementById(
            type + "Body"
        );


    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    /*
       Remove everything.
    */

    body.innerHTML = "";


    /*
       No results.
    */

    if (
        !data.length
    ) {

        const tr =
            document.createElement(
                "tr"
            );


        const td =
            document.createElement(
                "td"
            );


        td.colSpan =
            Math.max(
                columns.length,
                1
            );


        td.className =
            "no-results";


        td.textContent =
            "No matching records";


        tr.appendChild(
            td
        );


        body.appendChild(
            tr
        );


        updateCount(
            type
        );


        return;

    }


    /*
       Virtual spacer.

       It creates the correct scroll
       height without creating every row.
    */

    const spacer =
        document.createElement(
            "tr"
        );


    spacer.className =
        "virtual-spacer-row";


    const spacerCell =
        document.createElement(
            "td"
        );


    spacerCell.colSpan =
        columns.length;


    spacerCell.style.height =
        (
            data.length *
            ROW_HEIGHT
        ) + "px";


    spacerCell.style.padding =
        "0";


    spacerCell.style.border =
        "none";


    spacerCell.style.background =
        "transparent";


    spacer.appendChild(
        spacerCell
    );


    body.appendChild(
        spacer
    );


    /*
       Render visible rows.
    */

    updateVisibleRows(
        type
    );


    /*
       Remove old scroll listener.
    */

    if (
        area._virtualHandler
    ) {

        area.removeEventListener(
            "scroll",
            area._virtualHandler
        );

    }


    let ticking = false;


    area._virtualHandler =
        () => {

            if (
                ticking
            ) {

                return;

            }


            ticking = true;


            requestAnimationFrame(
                () => {

                    updateVisibleRows(
                        type
                    );

                    ticking =
                        false;

                }
            );

        };


    area.addEventListener(
        "scroll",
        area._virtualHandler,
        {
            passive: true
        }
    );


    updateCount(
        type
    );

}


/* =========================================================
   UPDATE VISIBLE ROWS
========================================================= */

function updateVisibleRows(
    type
) {

    const area =
        document.getElementById(
            type + "Area"
        );


    const body =
        document.getElementById(
            type + "Body"
        );


    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    if (
        !data.length
    ) {

        return;

    }


    /*
       Remove previously rendered rows.

       Keep the first child,
       which is the virtual spacer.
    */

    while (
        body.children.length >
        1
    ) {

        body.removeChild(
            body.lastChild
        );

    }


    const scrollTop =
        area.scrollTop;


    const visibleHeight =
        area.clientHeight;


    let start =
        Math.floor(
            scrollTop /
            ROW_HEIGHT
        ) -
        BUFFER_ROWS;


    if (
        start < 0
    ) {

        start = 0;

    }


    let end =
        Math.ceil(
            (
                scrollTop +
                visibleHeight
            ) /
            ROW_HEIGHT
        ) +
        BUFFER_ROWS;


    if (
        end > data.length
    ) {

        end =
            data.length;

    }


    const fragment =
        document.createDocumentFragment();


    for (
        let i = start;
        i < end;
        i++
    ) {

        const row =
            data[i];


        const tr =
            document.createElement(
                "tr"
            );


        tr.style.height =
            ROW_HEIGHT + "px";


        /*
           The row is positioned visually
           according to its real dataset index.
        */

        tr.style.transform =
            "translateY(" +
            (
                i *
                ROW_HEIGHT
            ) +
            "px)";


        columns.forEach(
            column => {

                const td =
                    document.createElement(
                        "td"
                    );


                const value =
                    valueToText(
                        getValue(
                            row,
                            column
                        )
                    );


                td.textContent =
                    value;


                /*
                   THIQA / BASIC colors.
                */

                if (
                    type === "thiqa" &&
                    isYesNoColumn(
                        column
                    )
                ) {

                    const normalized =
                        value
                            .trim()
                            .toLowerCase();


                    if (
                        normalized ===
                        "yes"
                    ) {

                        td.classList.add(
                            "yes-cell"
                        );

                    }
                    else if (
                        normalized ===
                        "no"
                    ) {

                        td.classList.add(
                            "no-cell"
                        );

                    }

                }


                /*
                   Also color relevant
                   HAAD Yes/No columns.
                */

                if (
                    type === "haad" &&
                    isHaadYesNoColumn(
                        column
                    )
                ) {

                    const normalized =
                        value
                            .trim()
                            .toLowerCase();


                    if (
                        normalized ===
                        "yes"
                    ) {

                        td.classList.add(
                            "yes-cell"
                        );

                    }
                    else if (
                        normalized ===
                        "no"
                    ) {

                        td.classList.add(
                            "no-cell"
                        );

                    }

                }


                tr.appendChild(
                    td
                );

            }
        );


        fragment.appendChild(
            tr
        );

    }


    body.appendChild(
        fragment
    );

}


/* =========================================================
   YES / NO DETECTION
========================================================= */

function isYesNoColumn(
    column
) {

    const text =
        String(
            column
        )
        .toLowerCase();


    return (
        text === "thiqa" ||
        text === "basic"
    );

}


/* =========================================================
   HAAD YES / NO
========================================================= */

function isHaadYesNoColumn(
    column
) {

    const text =
        String(
            column
        )
        .toLowerCase();


    return (
        text.includes(
            "thiqa"
        ) ||
        text.includes(
            "basic"
        )
    );

}


/* =========================================================
   COUNT
========================================================= */

function updateCount(
    type
) {

    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    const element =
        document.getElementById(
            type + "Count"
        );


    element.textContent =
        data.length.toLocaleString() +
        " records";

}


/* =========================================================
   APPLY ALL FILTERS
========================================================= */

function applyAllFilters(
    type
) {

    const source =
        type === "thiqa"
            ? thiqaData
            : haadData;


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    const mainSearch =
        type === "thiqa"
            ? thiqaMainSearch
            : haadMainSearch;


    const searchCache =
        type === "thiqa"
            ? thiqaSearchCache
            : haadSearchCache;


    /*
       Search terms separated by %.

       Example:

       500%10

       means:

       contains 500
       AND
       contains 10
    */

    const searchTerms =
        mainSearch
            ? mainSearch
                .split("%")
                .map(
                    term =>
                        term.trim()
                )
                .filter(
                    Boolean
                )
            : [];


    /*
       If there are no filters and
       no search, avoid scanning the
       dataset unnecessarily.
    */

    if (
        filters.size === 0 &&
        searchTerms.length === 0
    ) {

        if (
            type === "thiqa"
        ) {

            thiqaResults =
                source;

        }
        else {

            haadResults =
                source;

        }


        renderHeader(
            type
        );


        renderVirtualTable(
            type
        );


        return;

    }


    const result = [];


    /*
       Loop once through dataset.
    */

    for (
        let i = 0;
        i < source.length;
        i++
    ) {

        const row =
            source[i];


        let valid =
            true;


        /*
           COLUMN FILTERS
        */

        for (
            const [
                columnIndex,
                selectedValues
            ]
            of filters
        ) {

            const column =
                columns[
                    columnIndex
                ];


            const value =
                valueToText(
                    getValue(
                        row,
                        column
                    )
                );


            if (
                !selectedValues.has(
                    value
                )
            ) {

                valid = false;

                break;

            }

        }


        if (
            !valid
        ) {

            continue;

        }


        /*
           GLOBAL SEARCH
        */

        if (
            searchTerms.length
        ) {

            const rowText =
                searchCache[i] ||
                "";


            for (
                let s = 0;
                s < searchTerms.length;
                s++
            ) {

                if (
                    !rowText.includes(
                        searchTerms[s]
                    )
                ) {

                    valid = false;

                    break;

                }

            }

        }


        if (
            valid
        ) {

            result.push(
                row
            );

        }

    }


    if (
        type === "thiqa"
    ) {

        thiqaResults =
            result;

    }
    else {

        haadResults =
            result;

    }


    renderHeader(
        type
    );


    renderVirtualTable(
        type
    );

}


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilter(
    type,
    columnIndex,
    headerElement,
    column
) {

    activeFilterType =
        type;

    activeFilterColumn =
        columnIndex;

    activeFilterColumnName =
        column;


    const source =
        type === "thiqa"
            ? thiqaData
            : haadData;


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    /*
       Build unique values.
    */

    const unique =
        new Set();


    for (
        let i = 0;
        i < source.length;
        i++
    ) {

        unique.add(
            valueToText(
                getValue(
                    source[i],
                    column
                )
            )
        );

    }


    allFilterValues =
        Array.from(
            unique
        );


    /*
       Sort values.

       Numeric values sort numerically.
    */

    allFilterValues.sort(
        (a, b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
    );


    /*
       Existing filter?
    */

    if (
        filters.has(
            columnIndex
        )
    ) {

        activeFilterValues =
            new Set(
                filters.get(
                    columnIndex
                )
            );

    }
    else {

        activeFilterValues =
            new Set(
                allFilterValues
            );

    }


    document
        .getElementById(
            "filterSearch"
        )
        .value = "";


    renderFilterValues();


    const popup =
        document.getElementById(
            "filterPopup"
        );


    popup.classList.add(
        "open"
    );


    /*
       Position popup below header.
    */

    const rect =
        headerElement.getBoundingClientRect();


    const popupWidth =
        290;


    let left =
        rect.left;


    let top =
        rect.bottom + 4;


    if (
        left +
        popupWidth >
        window.innerWidth -
        8
    ) {

        left =
            window.innerWidth -
            popupWidth -
            8;

    }


    if (
        left < 8
    ) {

        left = 8;

    }


    /*
       If popup would go below
       the screen, put it above.
    */

    const estimatedHeight =
        430;


    if (
        top +
        estimatedHeight >
        window.innerHeight -
        8
    ) {

        top =
            rect.top -
            estimatedHeight -
            4;

    }


    if (
        top < 8
    ) {

        top = 8;

    }


    popup.style.left =
        left + "px";


    popup.style.top =
        top + "px";


    /*
       Focus search.
    */

    setTimeout(
        () => {

            document
                .getElementById(
                    "filterSearch"
                )
                .focus();

        },
        20
    );

}


/* =========================================================
   RENDER FILTER VALUES
========================================================= */

function renderFilterValues() {

    const container =
        document.getElementById(
            "filterValues"
        );


    container.innerHTML = "";


    const search =
        document
            .getElementById(
                "filterSearch"
            )
            .value
            .trim()
            .toLowerCase();


    let values =
        allFilterValues;


    if (
        search
    ) {

        values =
            allFilterValues.filter(
                value =>
                    value
                        .toLowerCase()
                        .includes(
                            search
                        )
            );

    }


    /*
       Avoid creating thousands
       of checkbox DOM elements.
    */

    const shown =
        values.slice(
            0,
            MAX_FILTER_OPTIONS
        );


    const fragment =
        document.createDocumentFragment();


    shown.forEach(
        value => {

            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "filter-value";


            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.checked =
                activeFilterValues.has(
                    value
                );


            checkbox.dataset.value =
                value;


            checkbox.addEventListener(
                "change",
                () => {

                    if (
                        checkbox.checked
                    ) {

                        activeFilterValues.add(
                            value
                        );

                    }
                    else {

                        activeFilterValues.delete(
                            value
                        );

                    }

                }
            );


            const span =
                document.createElement(
                    "span"
                );


            span.textContent =
                value === ""
                    ? "(Blank)"
                    : value;


            label.appendChild(
                checkbox
            );


            label.appendChild(
                span
            );


            fragment.appendChild(
                label
            );

        }
    );


    container.appendChild(
        fragment
    );


    /*
       Inform user if more values
       exist than currently displayed.
    */

    if (
        values.length >
        MAX_FILTER_OPTIONS
    ) {

        const message =
            document.createElement(
                "div"
            );


        message.className =
            "filter-too-many";


        message.textContent =
            (
                values.length -
                MAX_FILTER_OPTIONS
            ).toLocaleString() +
            " more values. Use search above.";

        
        container.appendChild(
            message
        );

    }

}


/* =========================================================
   SELECT ALL
========================================================= */

function selectAllFilterValues() {

    activeFilterValues =
        new Set(
            allFilterValues
        );


    renderFilterValues();

}


/* =========================================================
   CLEAR ALL
========================================================= */

function clearAllFilterValues() {

    activeFilterValues =
        new Set();


    renderFilterValues();

}


/* =========================================================
   APPLY FILTER
========================================================= */

function applyFilter() {

    if (
        activeFilterType === null
    ) {

        return;

    }


    const filters =
        activeFilterType === "thiqa"
            ? thiqaFilters
            : haadFilters;


    /*
       If every value is selected,
       there is no active filter.
    */

    if (
        activeFilterValues.size ===
        allFilterValues.length
    ) {

        filters.delete(
            activeFilterColumn
        );

    }
    else {

        filters.set(
            activeFilterColumn,
            new Set(
                activeFilterValues
            )
        );

    }


    const type =
        activeFilterType;


    closeFilter();


    applyAllFilters(
        type
    );

}


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilter() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    popup.classList.remove(
        "open"
    );


    activeFilterType =
        null;

    activeFilterColumn =
        null;

}


/* =========================================================
   CLEAR MAIN SEARCH
========================================================= */

function clearMainSearch(
    type
) {

    document
        .getElementById(
            type + "Search"
        )
        .value = "";


    if (
        type === "thiqa"
    ) {

        thiqaMainSearch =
            "";

    }
    else {

        haadMainSearch =
            "";

    }


    applyAllFilters(
        type
    );

}


/* =========================================================
   TAB SWITCH
========================================================= */

function switchTab(
    type
) {

    document
        .querySelectorAll(
            ".tab-content"
        )
        .forEach(
            tab => {

                tab.classList.remove(
                    "active"
                );

            }
        );


    document
        .querySelectorAll(
            ".tab-button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );


    document
        .getElementById(
            type
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            type +
            "TabButton"
        )
        .classList.add(
            "active"
        );


    closeFilter();

}


/* =========================================================
   HIDE LOADING
========================================================= */

function hideLoading(
    type
) {

    const loading =
        document.getElementById(
            type +
            "Loading"
        );


    if (
        loading
    ) {

        loading.style.display =
            "none";

    }

}


/* =========================================================
   LOADING ERROR
========================================================= */

function showLoadingError(
    type,
    error
) {

    const loading =
        document.getElementById(
            type +
            "Loading"
        );


    if (
        !loading
    ) {

        return;

    }


    const file =
        type === "thiqa"
            ? THIQA_FILE
            : HAAD_FILE;


    loading.innerHTML =
        `
        <div class="load-error">

            <strong>
                Unable to load ${type.toUpperCase()} data
            </strong>

            File:

            <b>
                ${escapeHtml(file)}
            </b>

            <br><br>

            Make sure the file is in the
            <b>same GitHub folder</b>
            as index.html.

            <br><br>

            Error:

            ${escapeHtml(
                error &&
                error.message
                    ? error.message
                    : "Unknown error"
            )}

        </div>
        `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   DEBOUNCE
========================================================= */

function debounce(
    fn,
    delay
) {

    let timer;


    return function () {

        clearTimeout(
            timer
        );


        timer =
            setTimeout(
                fn,
                delay
            );

    };

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        closeFilter();

    }
);

</script>

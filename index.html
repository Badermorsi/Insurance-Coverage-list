<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance Coverage List</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        background: white;
        padding: 15px 25px;
        border-bottom: 1px solid #dce3ec;
        display: flex;
        align-items: center;
        gap: 18px;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        height: 58px;
        width: auto;
        object-fit: contain;
    }

    .header-title {
        font-size: 25px;
        font-weight: 700;
        color: #123c69;
    }

    /* =========================
       TABS
    ========================= */

    .tabs {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 18px 20px 0;
    }

    .tab-button {
        border: none;
        background: #dfe7f1;
        color: #24415d;
        padding: 13px 30px;
        font-size: 16px;
        font-weight: 700;
        border-radius: 10px 10px 0 0;
        cursor: pointer;
        transition: 0.2s;
    }

    .tab-button:hover {
        background: #cbd8e7;
    }

    .tab-button.active {
        background: #123c69;
        color: white;
    }

    /* =========================
       CONTENT
    ========================= */

    .container {
        width: 96%;
        max-width: 1900px;
        margin: 0 auto 40px;
        background: white;
        border-radius: 0 12px 12px 12px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        padding: 20px;
    }

    .tab-content {
        display: none;
    }

    .tab-content.active {
        display: block;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-area {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
        flex-wrap: wrap;
    }

    .search-box {
        flex: 1;
        min-width: 280px;
        position: relative;
    }

    .search-box input {
        width: 100%;
        padding: 14px 45px 14px 16px;
        border: 1px solid #c8d2df;
        border-radius: 9px;
        font-size: 16px;
        outline: none;
    }

    .search-box input:focus {
        border-color: #123c69;
        box-shadow: 0 0 0 3px rgba(18,60,105,0.1);
    }

    .search-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 20px;
        color: #718096;
    }

    .clear-btn {
        border: none;
        background: #e8edf3;
        padding: 0 20px;
        border-radius: 9px;
        cursor: pointer;
        font-weight: 600;
        color: #334155;
    }

    .clear-btn:hover {
        background: #d9e1ea;
    }

    /* =========================
       INFO
    ========================= */

    .info-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }

    .record-count {
        font-size: 14px;
        color: #64748b;
    }

    .loading {
        padding: 30px;
        text-align: center;
        color: #64748b;
    }

    .error {
        background: #fff1f2;
        color: #be123c;
        border: 1px solid #fecdd3;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 15px;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrapper {
        width: 100%;
        overflow-x: auto;
        border: 1px solid #dbe3ec;
        border-radius: 8px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
    }

    th {
        background: #123c69;
        color: white;
        padding: 11px 10px;
        text-align: left;
        font-size: 13px;
        white-space: nowrap;
        position: sticky;
        top: 0;
        z-index: 2;
    }

    td {
        padding: 10px;
        border-bottom: 1px solid #e5eaf0;
        font-size: 13px;
        vertical-align: top;
        white-space: nowrap;
    }

    tbody tr:nth-child(even) {
        background: #f8fafc;
    }

    tbody tr:hover {
        background: #edf5ff;
    }

    /* =========================
       HIGHLIGHT
    ========================= */

    .highlight {
        background: #fff2a8;
        font-weight: 700;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {

        .header {
            padding: 12px;
        }

        .logo {
            height: 45px;
        }

        .header-title {
            font-size: 19px;
        }

        .tabs {
            padding: 10px 10px 0;
        }

        .tab-button {
            padding: 11px 15px;
            font-size: 14px;
        }

        .container {
            width: 100%;
            border-radius: 0;
            padding: 12px;
        }

        .search-box {
            min-width: 100%;
        }

        .clear-btn {
            height: 45px;
            width: 100%;
        }
    }
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div class="header">

    <!-- If your logo filename is different, change logo.png -->
    <img src="logo.png" class="logo" alt="Al Ain Pharmacy">

    <div class="header-title">
        Insurance Coverage List
    </div>

</div>


<!-- =========================
     TABS
========================= -->

<div class="tabs">

    <button
        class="tab-button active"
        onclick="switchTab('thiqa')">
        Thiqa Coverage List
    </button>

    <button
        class="tab-button"
        onclick="switchTab('haad')">
        HAAD List
    </button>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="container">


    <!-- =====================================================
         THIQA TAB
    ====================================================== -->

    <div id="thiqa" class="tab-content active">

        <div class="search-area">

            <div class="search-box">

                <input
                    type="text"
                    id="thiqaSearch"
                    placeholder="Search Thiqa Coverage List..."
                    oninput="searchThiqa()">

                <span class="search-icon">🔎</span>

            </div>

            <button
                class="clear-btn"
                onclick="clearThiqaSearch()">
                Clear
            </button>

        </div>

        <div class="info-bar">

            <div id="thiqaCount" class="record-count">
                Loading...
            </div>

        </div>

        <div id="thiqaError"></div>

        <div class="table-wrapper">

            <table id="thiqaTable">

                <thead id="thiqaHead"></thead>

                <tbody id="thiqaBody"></tbody>

            </table>

        </div>

    </div>


    <!-- =====================================================
         HAAD TAB
    ====================================================== -->

    <div id="haad" class="tab-content">

        <div class="search-area">

            <div class="search-box">

                <input
                    type="text"
                    id="haadSearch"
                    placeholder="Search HAAD List..."
                    oninput="searchHaad()">

                <span class="search-icon">🔎</span>

            </div>

            <button
                class="clear-btn"
                onclick="clearHaadSearch()">
                Clear
            </button>

        </div>

        <div class="info-bar">

            <div id="haadCount" class="record-count">
                Loading...
            </div>

        </div>

        <div id="haadError"></div>

        <div class="table-wrapper">

            <table id="haadTable">

                <thead id="haadHead"></thead>

                <tbody id="haadBody"></tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* ============================================================
   FILE NAMES
   ============================================================

   CHANGE ONLY THESE TWO NAMES IF YOUR JSON FILES
   HAVE DIFFERENT FILENAMES.

   Example:
   "HAAD LIST.json"
   "Thiqa Coverage.json"

============================================================ */

const HAAD_FILE = "HAAD LIST.json";

/*
   IMPORTANT:
   Replace this with the EXACT filename of your Thiqa JSON.
*/
const THIQA_FILE = "Thiqa Coverage.json";


/* ============================================================
   DATA
============================================================ */

let thiqaData = [];
let haadData = [];


/* ============================================================
   HAAD COLUMNS
   ============================================================

   These are kept completely independent from Thiqa.
============================================================ */

const HAAD_COLUMNS = [
    "Drug Code",
    "Insurance Plan",
    "Package Name",
    "Generic Code",
    "Generic Name",
    "Strength",
    "Dosage Form",
    "Package Size",
    "Dispense Mode",
    "Package Price to Public",
    "Package Price to Pharmacy",
    "Unit Price to Public",
    "Unit Price to Pharmacy",
    "Status",
    "Delete Effective Date",
    "Last Change Date",
    "Agent Name",
    "Manufacturer Name",
    "Insurance Coverage For Government Funded Program",
    "UPP Scope",
    "Included in Thiqa/ABM - other than 1&7 - Drug Formulary",
    "Included In Basic Drug Formulary",
    "Included In ABM 1 Drug Formulary",
    "Included In ABM 7 Drug Formulary",
    "Unit Markup",
    "Package Markup",
    "Thiqa Max. Reimbursement Price (Package)",
    "Thiqa co-pay amount (package)",
    "Basic co-pay amount (package)",
    "UPP Effective Date",
    "UPP Updated Date",
    "UPP Expiry Date"
];


/* ============================================================
   LOAD JSON
============================================================ */

async function loadJsonFile(fileName) {

    const response = await fetch(
        encodeURI(fileName),
        {
            cache: "no-store"
        }
    );

    if (!response.ok) {
        throw new Error(
            "Could not load " + fileName +
            " (" + response.status + ")"
        );
    }

    return await response.json();
}


/* ============================================================
   NORMALIZE JSON
   ============================================================

   Handles common JSON structures:

   [
      {...},
      {...}
   ]

   OR

   {
      "data": [...]
   }

============================================================ */

function normalizeData(json) {

    if (Array.isArray(json)) {
        return json;
    }

    if (json && Array.isArray(json.data)) {
        return json.data;
    }

    if (json && Array.isArray(json.rows)) {
        return json.rows;
    }

    if (json && Array.isArray(json.records)) {
        return json.records;
    }

    if (json && typeof json === "object") {

        const arrays = Object.values(json)
            .filter(value => Array.isArray(value));

        if (arrays.length > 0) {
            return arrays[0];
        }
    }

    return [];
}


/* ============================================================
   INITIAL LOAD
============================================================ */

async function loadData() {

    loadThiqa();

    loadHaad();

}


/* ============================================================
   LOAD THIQA
============================================================ */

async function loadThiqa() {

    const count = document.getElementById("thiqaCount");

    try {

        count.textContent = "Loading Thiqa data...";

        const json = await loadJsonFile(THIQA_FILE);

        thiqaData = normalizeData(json);

        if (!thiqaData.length) {
            throw new Error(
                "No records found in the Thiqa JSON."
            );
        }

        renderThiqa(thiqaData);

    }
    catch (error) {

        document.getElementById("thiqaError").innerHTML =
            `<div class="error">
                Unable to load Thiqa Coverage List.<br>
                <strong>${escapeHtml(error.message)}</strong>
            </div>`;

        count.textContent = "0 records";

        console.error(error);

    }

}


/* ============================================================
   LOAD HAAD
============================================================ */

async function loadHaad() {

    const count = document.getElementById("haadCount");

    try {

        count.textContent = "Loading HAAD data...";

        const json = await loadJsonFile(HAAD_FILE);

        haadData = normalizeData(json);

        if (!haadData.length) {
            throw new Error(
                "No records found in the HAAD JSON."
            );
        }

        renderHaad(haadData);

    }
    catch (error) {

        document.getElementById("haadError").innerHTML =
            `<div class="error">
                Unable to load HAAD List.<br>
                <strong>${escapeHtml(error.message)}</strong>
            </div>`;

        count.textContent = "0 records";

        console.error(error);

    }

}


/* ============================================================
   GET VALUE
============================================================ */

function getValue(row, column) {

    if (!row || typeof row !== "object") {
        return "";
    }

    if (
        Object.prototype.hasOwnProperty.call(row, column)
    ) {
        return row[column];
    }

    /*
       Try case-insensitive matching.
    */

    const target = column
        .trim()
        .toLowerCase();

    const key = Object.keys(row).find(
        k => k.trim().toLowerCase() === target
    );

    if (key !== undefined) {
        return row[key];
    }

    return "";
}


/* ============================================================
   GET THIQA COLUMNS
============================================================ */

function getThiqaColumns(data) {

    if (!data.length) {
        return [];
    }

    /*
       Use the columns exactly as they exist
       in the Thiqa JSON.
    */

    const columns = [];

    data.forEach(row => {

        Object.keys(row).forEach(key => {

            if (!columns.includes(key)) {
                columns.push(key);
            }

        });

    });

    return columns;
}


/* ============================================================
   RENDER THIQA
============================================================ */

function renderThiqa(data) {

    const head = document.getElementById("thiqaHead");
    const body = document.getElementById("thiqaBody");
    const count = document.getElementById("thiqaCount");

    head.innerHTML = "";
    body.innerHTML = "";

    const columns = getThiqaColumns(data);

    /*
       Header
    */

    const headerRow = document.createElement("tr");

    columns.forEach(column => {

        const th = document.createElement("th");

        th.textContent = column;

        headerRow.appendChild(th);

    });

    head.appendChild(headerRow);


    /*
       Rows
    */

    const fragment = document.createDocumentFragment();

    data.forEach(row => {

        const tr = document.createElement("tr");

        columns.forEach(column => {

            const td = document.createElement("td");

            let value = getValue(row, column);

            if (
                value === null ||
                value === undefined
            ) {
                value = "";
            }

            if (typeof value === "object") {
                value = JSON.stringify(value);
            }

            td.textContent = value;

            tr.appendChild(td);

        });

        fragment.appendChild(tr);

    });

    body.appendChild(fragment);

    count.textContent =
        data.length.toLocaleString() +
        " records";

}


/* ============================================================
   RENDER HAAD
============================================================ */

function renderHaad(data) {

    const head = document.getElementById("haadHead");
    const body = document.getElementById("haadBody");
    const count = document.getElementById("haadCount");

    head.innerHTML = "";
    body.innerHTML = "";


    /*
       HAAD HEADER
    */

    const headerRow = document.createElement("tr");

    HAAD_COLUMNS.forEach(column => {

        const th = document.createElement("th");

        th.textContent = column;

        headerRow.appendChild(th);

    });

    head.appendChild(headerRow);


    /*
       HAAD DATA
    */

    const fragment = document.createDocumentFragment();

    data.forEach(row => {

        const tr = document.createElement("tr");

        HAAD_COLUMNS.forEach(column => {

            const td = document.createElement("td");

            let value = getValue(row, column);

            if (
                value === null ||
                value === undefined
            ) {
                value = "";
            }

            if (typeof value === "object") {
                value = JSON.stringify(value);
            }

            td.textContent = value;

            tr.appendChild(td);

        });

        fragment.appendChild(tr);

    });

    body.appendChild(fragment);

    count.textContent =
        data.length.toLocaleString() +
        " records";

}


/* ============================================================
   SEARCH THIQA
============================================================ */

function searchThiqa() {

    const searchInput =
        document.getElementById("thiqaSearch");

    const search = searchInput.value
        .trim()
        .toLowerCase();

    if (!search) {

        renderThiqa(thiqaData);

        return;
    }


    /*
       Supports:

       normal text:
       amoxicillin

       multiple terms:
       amoxicillin 500

       % syntax:
       500%10

       Meaning:
       find rows containing BOTH 500 AND 10
    */

    const terms = search
        .split("%")
        .map(x => x.trim())
        .filter(Boolean);


    const filtered = thiqaData.filter(row => {

        const rowText = Object.values(row)
            .map(value => {

                if (
                    value === null ||
                    value === undefined
                ) {
                    return "";
                }

                if (typeof value === "object") {
                    return JSON.stringify(value);
                }

                return String(value);

            })
            .join(" ")
            .toLowerCase();


        return terms.every(term =>
            rowText.includes(term)
        );

    });


    renderThiqa(filtered);

}


/* ============================================================
   SEARCH HAAD
============================================================ */

function searchHaad() {

    const searchInput =
        document.getElementById("haadSearch");

    const search = searchInput.value
        .trim()
        .toLowerCase();

    if (!search) {

        renderHaad(haadData);

        return;
    }


    /*
       % means AND.

       Example:

       500%10

       means:

       row must contain 500
       AND
       row must contain 10
    */

    const terms = search
        .split("%")
        .map(x => x.trim())
        .filter(Boolean);


    const filtered = haadData.filter(row => {

        const rowText = HAAD_COLUMNS
            .map(column => {

                let value = getValue(
                    row,
                    column
                );

                if (
                    value === null ||
                    value === undefined
                ) {
                    return "";
                }

                if (typeof value === "object") {
                    return JSON.stringify(value);
                }

                return String(value);

            })
            .join(" ")
            .toLowerCase();


        return terms.every(term =>
            rowText.includes(term)
        );

    });


    renderHaad(filtered);

}


/* ============================================================
   CLEAR SEARCH
============================================================ */

function clearThiqaSearch() {

    document.getElementById(
        "thiqaSearch"
    ).value = "";

    renderThiqa(thiqaData);

}


function clearHaadSearch() {

    document.getElementById(
        "haadSearch"
    ).value = "";

    renderHaad(haadData);

}


/* ============================================================
   TAB SWITCH
============================================================ */

function switchTab(tabName) {

    /*
       Hide all tabs
    */

    document
        .querySelectorAll(".tab-content")
        .forEach(tab => {

            tab.classList.remove("active");

        });


    /*
       Remove active button
    */

    document
        .querySelectorAll(".tab-button")
        .forEach(button => {

            button.classList.remove("active");

        });


    /*
       Show selected tab
    */

    document
        .getElementById(tabName)
        .classList.add("active");


    /*
       Activate correct button
    */

    if (tabName === "thiqa") {

        document
            .querySelectorAll(".tab-button")[0]
            .classList.add("active");

    }

    if (tabName === "haad") {

        document
            .querySelectorAll(".tab-button")[1]
            .classList.add("active");

    }

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================================
   START
============================================================ */

loadData();

</script>

</body>
</html>

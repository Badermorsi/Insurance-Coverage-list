<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Thiqa & Basic Coverage</title>

<style>

:root{
    --border:#d9dee7;
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#667085;
    --header:#17365d;
    --header2:#eef2f7;
    --yes:#087443;
    --no:#b42318;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#17365d,#245b91);
    color:white;
    padding:22px 24px;
}

.header h1{
    margin:0;
    font-size:25px;
}

/* ================= CONTAINER ================= */

.container{
    padding:18px;
    max-width:1800px;
    margin:auto;
}

/* ================= LIST TABS ================= */

.list-tabs{
    display:flex;
    gap:6px;
    margin-bottom:15px;
    background:white;
    border:1px solid var(--border);
    border-radius:10px;
    padding:6px;
    box-shadow:0 2px 8px rgba(16,24,40,.05);
}

.list-tab{
    border:0;
    background:transparent;
    color:#475467;
    font-weight:700;
    font-size:14px;
    padding:11px 20px;
    border-radius:7px;
    cursor:pointer;
}

.list-tab:hover{
    background:#eef2f7;
}

.list-tab.active{
    background:#17365d;
    color:white;
}

/* ================= TOP SEARCH ================= */

.search-panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(16,24,40,.05);
}

.search-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.search-box label{
    display:block;
    font-weight:700;
    font-size:13px;
    margin-bottom:7px;
}

.search-box input{
    width:100%;
    height:42px;
    border:1px solid #bfc7d4;
    border-radius:8px;
    padding:0 12px;
    font-size:15px;
    outline:none;
}

.search-box input:focus{
    border-color:#3276b1;
    box-shadow:0 0 0 3px rgba(50,118,177,.12);
}

/* ================= TOOLBAR ================= */

.toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px;
}

button{
    border:1px solid var(--border);
    background:white;
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
}

button:hover{
    background:#f1f5f9;
}

.stats{
    font-size:13px;
    color:var(--muted);
    margin-left:auto;
}

.small{
    font-size:12px;
    color:var(--muted);
}

/* ================= TABLE ================= */

.table-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(16,24,40,.05);
}

.table-wrap{
    overflow:auto;
    max-height:calc(100vh - 300px);
}

table{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
    min-width:1500px;
    font-size:13px;
}

th,
td{
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:9px 10px;
    text-align:left;
    vertical-align:top;
}

/* ================= TABLE HEADER ================= */

thead tr:first-child th{
    background:var(--header);
    color:white;
    position:sticky;
    top:0;
    z-index:10;
    font-weight:700;
    white-space:nowrap;
    padding:0;
}

.header-cell{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:42px;
    padding-left:10px;
}

.header-title{
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ================= FILTER BUTTON ================= */

.filter-button{
    width:34px;
    height:42px;
    border:0;
    border-left:1px solid rgba(255,255,255,.25);
    border-radius:0;
    background:transparent;
    color:white;
    font-size:15px;
    padding:0;
    flex-shrink:0;
}

.filter-button:hover{
    background:rgba(255,255,255,.15);
}

.filter-button.active{
    background:#3d78ad;
}

/* ================= ROWS ================= */

tbody tr:nth-child(even){
    background:#fafbfc;
}

tbody tr:hover{
    background:#f0f7ff;
}

/* ================= COVERAGE ================= */

.coverage{
    font-weight:800;
    text-align:center;
    border-radius:6px;
    display:inline-block;
    min-width:42px;
    padding:4px 8px;
}

.yes{
    color:var(--yes);
    background:#e7f6ee;
}

.no{
    color:var(--no);
    background:#fdecec;
}

/* ================= FILTER POPUP ================= */

.filter-popup{
    position:fixed;
    width:280px;
    max-height:430px;
    background:white;
    border:1px solid #cbd5e1;
    border-radius:9px;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
    z-index:9999;
    display:none;
    overflow:hidden;
}

.filter-popup.show{
    display:block;
}

/* ================= FILTER SEARCH ================= */

.filter-search{
    padding:10px;
    border-bottom:1px solid var(--border);
    background:#fff;
}

.filter-search input{
    width:100%;
    height:34px;
    border:1px solid #c7cfda;
    border-radius:6px;
    padding:0 9px;
    font-size:13px;
    outline:none;
}

.filter-search input:focus{
    border-color:#3276b1;
}

/* ================= SELECT ALL ================= */

.select-all{
    padding:9px 11px;
    border-bottom:1px solid var(--border);
    background:#fafafa;
}

.select-all label,
.filter-value label{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
}

.select-all input,
.filter-value input{
    width:16px;
    height:16px;
    cursor:pointer;
}

/* ================= FILTER VALUES ================= */

.filter-values{
    max-height:270px;
    overflow-y:auto;
    padding:5px 0;
}

.filter-value{
    padding:7px 11px;
    font-size:13px;
}

.filter-value:hover{
    background:#f1f5f9;
}

.filter-value.hidden{
    display:none;
}

.value-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* ================= FILTER BUTTONS ================= */

.filter-actions{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid var(--border);
    background:#fafafa;
}

.filter-actions button{
    flex:1;
    font-weight:600;
}

.apply-button{
    background:#17365d;
    color:white;
    border-color:#17365d;
}

.apply-button:hover{
    background:#245b91;
}

.clear-filter-button:hover{
    background:#feecec;
    color:#b42318;
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:35px;
    color:var(--muted);
}

.empty{
    text-align:center;
    padding:45px;
    color:var(--muted);
    font-size:15px;
}

/* ================= DATABASE LOADING MESSAGE ================= */

.database-status{
    display:none;
    margin-top:10px;
    padding:9px 12px;
    border-radius:7px;
    background:#eef4fb;
    color:#345;
    font-size:12px;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .search-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        margin-left:0;
        width:100%;
    }

}

@media(max-width:550px){

    .container{
        padding:10px;
    }

    .search-grid{
        grid-template-columns:1fr;
    }

    .header{
        padding:17px;
    }

    .header h1{
        font-size:21px;
    }

    .filter-popup{
        width:calc(100vw - 20px);
        left:10px !important;
        right:10px;
    }

    .list-tab{
        flex:1;
        padding:10px 8px;
        font-size:13px;
    }

}

</style>

</head>

<script>

/* =========================================================
   DATABASE STATE
========================================================= */

const state = {

    activeList: "thiqa",

    datasets: {

        thiqa: {
            loaded: false,
            loading: false,
            data: [],
            normalized: [],
            search: ["","","",""],
            filters:
                Array(14)
                .fill(null)
                .map(() => new Set())
        },

        haad: {
            loaded: false,
            loading: false,
            data: [],
            normalized: [],
            search: ["","","",""],
            filters:
                Array(14)
                .fill(null)
                .map(() => new Set())
        }

    },

    filterColumn: null,

    filterTemp: new Set(),

    filterButton: null,

    renderQueued: false

};


/* =========================================================
   TABLE COLUMNS
========================================================= */

const keys = [

    "Proactive ID",
    "HAAD CODE",
    "proactive name",
    "Generic Code",
    "Haad Price",
    "Generic Name",
    "Strength",
    "Dosage Form",
    "Package Size",
    "Is UPP Scope",
    "THIQA",
    "BASIC",
    "Markup",
    "Daman Coverage"

];


/* =========================================================
   HAAD JSON KEYS
========================================================= */

const haadKeys = {

    code:
        "Drug Code",

    brand:
        "Package Name",

    genericCode:
        "Generic Code",

    ingredient:
        "Generic Name",

    strength:
        "Strength",

    dosage:
        "Dosage Form",

    packageSize:
        "Package Size",

    price:
        "Package Price to Public",

    upp:
        "UPP Scope",

    thiqa:
        "Included in Thiqa/ ABM - other than 1&7- Drug Formulary",

    basic:
        "Included In Basic Drug Formulary",

    markup:
        "Package Markup"

};


/* =========================================================
   NORMALIZE
========================================================= */

function norm(value){

    return String(value ?? "")
        .toLowerCase()
        .trim();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "").replace(
        /[&<>"']/g,
        function(c){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[c];

        }
    );

}


/* =========================================================
   CURRENT DATASET
========================================================= */

function currentDataset(){

    return state.datasets[state.activeList];

}


/* =========================================================
   CELL DISPLAY
========================================================= */

function cell(value,col){

    const text = value ?? "";


    /*
       THIQA / BASIC
    */

    if(
        (col === 10 || col === 11) &&
        (text === "Yes" || text === "No")
    ){

        return `

            <span
                class="coverage ${
                    text === "Yes"
                        ? "yes"
                        : "no"
                }"
            >
                ${text}
            </span>

        `;

    }


    return escapeHtml(text);

}


/* =========================================================
   SPLIT SEARCH TERMS
========================================================= */

function searchTerms(search){

    return search
        .split("%")
        .map(term => term.trim())
        .filter(term => term !== "");

}


/* =========================================================
   TEXT SEARCH
   % = AND
========================================================= */

function allTermsMatch(text,search){

    if(!search){

        return true;

    }


    const terms =
        searchTerms(search);


    return terms.every(
        term =>
            text.includes(term)
    );

}


/* =========================================================
   EXACT NUMBER SEARCH
========================================================= */

function allExactNumbersMatch(text,search){

    if(!search){

        return true;

    }


    const terms =
        searchTerms(search);


    return terms.every(term => {

        const escaped =
            term.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
            );


        const regex =
            new RegExp(
                "(?<![0-9.])" +
                escaped +
                "(?![0-9.])"
            );


        return regex.test(text);

    });

}


/* =========================================================
   PREPARE SEARCH
========================================================= */

function prepareSearch(dataset){

    dataset.searchTerms = {

        brand:
            searchTerms(
                dataset.search[0]
            ),

        ingredient:
            searchTerms(
                dataset.search[1]
            ),

        strength:
            searchTerms(
                dataset.search[2]
            ),

        dosage:
            searchTerms(
                dataset.search[3]
            )

    };


    dataset.strengthRegex =
        dataset.searchTerms.strength.map(
            term => {

                const escaped =
                    term.replace(
                        /[.*+?^${}()|[\]\\]/g,
                        "\\$&"
                    );

                return new RegExp(
                    "(?<![0-9.])" +
                    escaped +
                    "(?![0-9.])"
                );

            }
        );

}


/* =========================================================
   CHECK WHETHER ROW MATCHES
========================================================= */

function matches(index){

    const dataset =
        currentDataset();

    const row =
        dataset.normalized[index];


    const terms =
        dataset.searchTerms || {

            brand:[],
            ingredient:[],
            strength:[],
            dosage:[]

        };


    /* BRAND */

    if(
        terms.brand.length &&
        !terms.brand.every(
            term =>
                row[2].includes(term)
        )
    ){

        return false;

    }


    /* ACTIVE INGREDIENT */

    if(
        terms.ingredient.length &&
        !terms.ingredient.every(
            term =>
                row[5].includes(term)
        )
    ){

        return false;

    }


    /* STRENGTH */

    if(
        terms.strength.length &&
        !dataset.strengthRegex.every(
            regex =>
                regex.test(row[6])
        )
    ){

        return false;

    }


    /* DOSAGE */

    if(
        terms.dosage.length &&
        !terms.dosage.every(
            term =>
                row[7].includes(term)
        )
    ){

        return false;

    }


    /* EXCEL FILTERS */

    for(
        let col = 0;
        col < 14;
        col++
    ){

        const selected =
            dataset.filters[col];


        if(selected.size > 0){

            if(
                !selected.has(
                    row[col]
                )
            ){

                return false;

            }

        }

    }


    return true;

}


/* =========================================================
   RENDER TABLE
========================================================= */

function render(){

    const dataset =
        currentDataset();


    const tbody =
        document.getElementById(
            "tbody"
        );


    const output = [];

    let count = 0;


    /*
       Make sure search preparation
       exists.
    */

    prepareSearch(dataset);


    for(
        let i = 0;
        i < dataset.data.length;
        i++
    ){

        if(matches(i)){

            const row =
                dataset.data[i];


            output.push(

                "<tr>" +

                row.map(
                    (value,col) =>

                        "<td>" +

                        cell(
                            value,
                            col
                        ) +

                        "</td>"

                ).join("") +

                "</tr>"

            );


            count++;

        }

    }


    if(output.length){

        tbody.innerHTML =
            output.join("");

    }

    else{

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="14"
                    class="empty"
                >
                    No matching records found.
                </td>

            </tr>

        `;

    }


    document
        .getElementById("stats")
        .textContent =

        `${count.toLocaleString()} matching record${
            count === 1
                ? ""
                : "s"
        } / ${
            dataset.data.length.toLocaleString()
        } total`;

}


/* =========================================================
   SCHEDULE RENDER
   No debounce.
   Search remains immediate.
========================================================= */

function scheduleRender(){

    if(state.renderQueued){

        return;

    }


    state.renderQueued = true;


    requestAnimationFrame(() => {

/* =========================================================
   LOAD DATABASE
========================================================= */

async function loadDatabase(list){

    const dataset =
        state.datasets[list];


    if(dataset.loading){

        return;

    }


    dataset.loading = true;


    const status =
        document.getElementById(
            "databaseStatus"
        );


    const tbody =
        document.getElementById(
            "tbody"
        );


    if(list === "thiqa"){

        status.style.display =
            "block";

        status.textContent =
            "Loading Thiqa Coverage List...";

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="14"
                    class="loading"
                >
                    Loading Thiqa Coverage List...
                </td>

            </tr>

        `;

    }

    else{

        status.style.display =
            "block";

        status.textContent =
            "Loading HAAD List...";

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="14"
                    class="loading"
                >
                    Loading HAAD List...
                </td>

            </tr>

        `;

    }


    try{

        let filename;


        if(list === "thiqa"){

            filename =
                "data.json";

        }

        else{

            filename =
                "HAAD LIST.json";

        }


        const response =
            await fetch(
                filename,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Could not load " +
                filename
            );

        }


        const rawData =
            await response.json();


        /*
           Convert database
        */

        if(list === "thiqa"){

            dataset.data =
                rawData.map(
                    row =>

                        keys.map(
                            key =>
                                row[key]
                        )

                );

        }

        else{

            /*
               HAAD database mapping

               HAAD does not have:
               - Proactive ID
               - Daman Coverage

               These remain blank.

               Markup uses:
               Package Markup.
            */

            dataset.data =
                rawData.map(
                    row => [

                        "",

                        row[
                            haadKeys.code
                        ],

                        row[
                            haadKeys.brand
                        ],

                        row[
                            haadKeys.genericCode
                        ],

                        row[
                            haadKeys.price
                        ],

                        row[
                            haadKeys.ingredient
                        ],

                        row[
                            haadKeys.strength
                        ],

                        row[
                            haadKeys.dosage
                        ],

                        row[
                            haadKeys.packageSize
                        ],

                        row[
                            haadKeys.upp
                        ],

                        convertCoverage(
                            row[
                                haadKeys.thiqa
                            ]
                        ),

                        convertCoverage(
                            row[
                                haadKeys.basic
                            ]
                        ),

                        row[
                            haadKeys.markup
                        ],

                        ""

                    ]

                );

        }


        /*
           Normalize once.
        */

        dataset.normalized =
            dataset.data.map(
                row =>
                    row.map(norm)
            );


        dataset.loaded =
            true;

        dataset.loading =
            false;


        status.style.display =
            "none";


        render();


    }

    catch(error){

        console.error(error);


        dataset.loading =
            false;


        status.style.display =
            "none";


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="14"
                    class="empty"
                >

                    Could not load the database.

                    <br><br>

                    Make sure

                    <b>
                        ${
                            list === "thiqa"
                                ? "data.json"
                                : "HAAD LIST.json"
                        }
                    </b>

                    is in the same GitHub folder
                    as <b>index.html</b>.

                </td>

            </tr>

        `;


        document
            .getElementById("stats")
            .textContent =
                "Data loading error";

    }

}


/* =========================================================
   CONVERT COVERAGE
========================================================= */

function convertCoverage(value){

    const text =
        String(
            value ?? ""
        ).trim();


    if(
        text.toLowerCase() ===
        "yes"
    ){

        return "Yes";

    }


    if(
        text.toLowerCase() ===
        "no"
    ){

        return "No";

    }


    return text;

}

function openFilter(
    col,
    button
){

    const dataset =
        currentDataset();


    state.filterColumn =
        col;


    state.filterButton =
        button;


    state.filterTemp =
        new Set(
            dataset.filters[col]
        );


    filterSearch.value =
        "";


    buildFilterValues();


    const rect =
        button.getBoundingClientRect();


    const popupWidth =
        280;


    let left =
        rect.left;


    let top =
        rect.bottom + 4;


    if(
        left + popupWidth >
        window.innerWidth - 10
    ){

        left =
            window.innerWidth -
            popupWidth -
            10;

    }


    if(left < 10){

        left = 10;

    }


    if(
        top + 430 >
        window.innerHeight
    ){

        top =
            rect.top -
            434;

    }


    filterPopup.style.left =
        left + "px";


    filterPopup.style.top =
        top + "px";


    filterPopup.classList.add(
        "show"
    );


    document
        .querySelectorAll(
            ".filter-button"
        )
        .forEach(
            b =>
                b.classList.remove(
                    "active"
                )
        );


    if(
        dataset.filters[col]
            .size > 0
    ){

        button.classList.add(
            "active"
        );

    }


    setTimeout(
        () =>
            filterSearch.focus(),
        20
    );

}


/* =========================================================
   BUILD FILTER VALUES
========================================================= */

function buildFilterValues(){

    const dataset =
        currentDataset();


    const col =
        state.filterColumn;


    if(col === null){

        return;

    }


    const values =
        new Map();


    for(
        let i = 0;
        i < dataset.normalized.length;
        i++
    ){

        const original =
            String(
                dataset.data[i][col] ??
                ""
            );


        const normalized =
            dataset.normalized[i][col];


        if(
            !values.has(
                normalized
            )
        ){

            values.set(
                normalized,
                original
            );

        }

    }


    const sorted =
        [...values.entries()]
        .sort(
            (a,b) =>
                a[1].localeCompare(
                    b[1],
                    undefined,
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                )
        );


    filterValues.innerHTML =
        "";


    sorted.forEach(
        ([normalized,display]) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "filter-value";


            const label =
                document.createElement(
                    "label"
                );


            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.dataset.value =
                normalized;


            checkbox.checked =
                state.filterTemp.has(
                    normalized
                );


            const span =
                document.createElement(
                    "span"
                );


            span.className =
                "value-text";


            span.textContent =
                display === ""
                    ? "(Blank)"
                    : display;


            label.appendChild(
                checkbox
            );


            label.appendChild(
                span
            );


            div.appendChild(
                label
            );


            filterValues.appendChild(
                div
            );

        }
    );


    updateSelectAll();

}

/* =========================================================
   UPDATE SELECT ALL
========================================================= */

function updateSelectAll(){

    const visible =
        [
            ...document.querySelectorAll(
                "#filterValues .filter-value:not(.hidden) input"
            )
        ];


    if(!visible.length){

        selectAll.checked =
            false;

        selectAll.indeterminate =
            false;

        return;

    }


    const checked =
        visible.filter(
            cb =>
                cb.checked
        ).length;


    selectAll.checked =
        checked ===
        visible.length;


    selectAll.indeterminate =
        checked > 0 &&
        checked < visible.length;

}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Insurance Coverage List</title>

<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #222;
}

body {
    overflow: hidden;
}


/* =====================================================
   MAIN
===================================================== */

.container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}


/* =====================================================
   TITLE
===================================================== */

.title {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    padding: 12px 10px 8px;
    background: white;
    border-bottom: 1px solid #ddd;
}


/* =====================================================
   TABS
===================================================== */

.tabs {
    display: flex;
    gap: 5px;
    padding: 8px 10px 0;
    background: white;
}

.tab {
    border: 1px solid #ccc;
    border-bottom: none;
    background: #e9ecef;
    padding: 10px 25px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    border-radius: 7px 7px 0 0;
}

.tab.active {
    background: #ffffff;
    color: #007bff;
    border-top: 3px solid #007bff;
}


/* =====================================================
   SEARCH
===================================================== */

.search-panel {
    background: white;
    padding: 10px;
    border-bottom: 1px solid #ccc;
}

.search-grid {
    display: grid;

    grid-template-columns:
        minmax(180px, 1fr)
        minmax(180px, 1fr)
        minmax(180px, 1fr)
        minmax(180px, 1fr)
        auto;

    gap: 8px;

    align-items: center;
}

.search-box input {

    width: 100%;

    height: 40px;

    padding: 0 12px;

    border: 1px solid #bbb;

    border-radius: 6px;

    font-size: 14px;

    outline: none;
}

.search-box input:focus {

    border-color: #007bff;

    box-shadow:
        0 0 0 2px
        rgba(0,123,255,.12);
}

.clear-btn {

    height: 40px;

    padding: 0 16px;

    border: none;

    border-radius: 6px;

    background: #dc3545;

    color: white;

    font-weight: bold;

    cursor: pointer;

    white-space: nowrap;
}

.clear-btn:hover {
    background: #c82333;
}


/* =====================================================
   SHEETS
===================================================== */

.sheet {

    display: none;

    flex: 1;

    min-height: 0;

    flex-direction: column;
}

.sheet.active {
    display: flex;
}


/* =====================================================
   COUNT
===================================================== */

.count-bar {

    background: #f8f9fa;

    padding: 6px 10px;

    border-bottom: 1px solid #ddd;

    font-size: 13px;

    color: #555;
}


/* =====================================================
   TABLE AREA
===================================================== */

.excel-area {

    position: relative;

    flex: 1;

    min-height: 0;

    overflow: auto;

    background: white;
}


/* =====================================================
   GRID
===================================================== */

.excel-header,
.data-row {

    display: grid;

    width: max-content;

    min-width: 100%;

    position: relative;
}


/* =====================================================
   HEADER
===================================================== */

.excel-header {

    position: sticky;

    top: 0;

    z-index: 20;

    background: #f1f3f5;

    border-bottom: 2px solid #999;
}

.header-cell {

    position: relative;

    min-height: 52px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 6px 7px;

    border-right: 1px solid #ccc;

    border-bottom: 1px solid #ccc;

    background: #f1f3f5;

    font-size: 12px;

    font-weight: bold;

    white-space: normal;

    overflow-wrap: anywhere;

    text-align: left;
}

.header-title {

    flex: 1;

    line-height: 15px;

    overflow-wrap: anywhere;
}


/* =====================================================
   FILTER BUTTON
===================================================== */

.filter-btn {

    flex-shrink: 0;

    width: 26px;

    height: 26px;

    margin-left: 5px;

    border: 1px solid #aaa;

    border-radius: 4px;

    background: white;

    cursor: pointer;

    font-size: 12px;

    display: flex;

    align-items: center;

    justify-content: center;
}

.filter-btn:hover {
    background: #e2e6ea;
}

.filter-btn.active {

    background: #007bff;

    color: white;

    border-color: #007bff;
}


/* =====================================================
   DATA ROW
===================================================== */

.data-row {

    position: absolute;

    left: 0;

    border-bottom: 1px solid #dcdcdc;

    background: white;

    align-items: stretch;
}

.data-row:hover {
    background: #f5f9ff;
}


/* =====================================================
   DATA CELL
===================================================== */

.data-cell {

    min-height: 42px;

    padding: 7px 8px;

    border-right: 1px solid #e5e5e5;

    display: flex;

    align-items: center;

    white-space: normal;

    overflow-wrap: anywhere;

    word-break: break-word;

    line-height: 17px;

    font-size: 12px;

    background: white;
}


/* =====================================================
   IMPORTANT CELLS
   THIQA / BASIC
===================================================== */

.important-yes {

    background: #16a34a !important;

    color: white !important;

    font-weight: 900 !important;

    font-size: 13px !important;

    text-align: center;

    justify-content: center;

    border: 1px solid #0d7a35 !important;
}

.important-no {

    background: #dc2626 !important;

    color: white !important;

    font-weight: 900 !important;

    font-size: 13px !important;

    text-align: center;

    justify-content: center;

    border: 1px solid #a91d1d !important;
}


/* =====================================================
   OTHER YES / NO
===================================================== */

.yes-value {

    color: #008000;

    font-weight: bold;
}

.no-value {

    color: #d00000;

    font-weight: bold;
}


/* =====================================================
   VIRTUAL CONTENT
===================================================== */

.virtual-content {

    position: relative;

    width: max-content;

    min-width: 100%;
}


/* =====================================================
   FILTER POPUP
===================================================== */

.filter-popup {

    position: fixed;

    z-index: 9999;

    width: 320px;

    max-height: 500px;

    background: white;

    border: 1px solid #999;

    border-radius: 7px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.25);

    display: none;

    overflow: hidden;
}

.filter-popup-header {

    padding: 10px;

    background: #f1f3f5;

    border-bottom: 1px solid #ddd;

    font-weight: bold;

    font-size: 13px;
}

.filter-search {

    padding: 8px;

    border-bottom: 1px solid #ddd;
}

.filter-search input {

    width: 100%;

    height: 35px;

    padding: 5px 9px;

    border: 1px solid #bbb;

    border-radius: 5px;

    outline: none;
}

.filter-search input:focus {

    border-color: #007bff;

    box-shadow:
        0 0 0 2px
        rgba(0,123,255,.1);
}


/* =====================================================
   FILTER ACTIONS
===================================================== */

.filter-actions {

    display: flex;

    gap: 5px;

    padding: 7px 8px;

    border-bottom: 1px solid #ddd;
}

.filter-actions button {

    flex: 1;

    height: 31px;

    border: 1px solid #aaa;

    background: #f8f9fa;

    border-radius: 4px;

    cursor: pointer;

    font-size: 12px;
}

.filter-actions button:hover {
    background: #e9ecef;
}


/* =====================================================
   FILTER VALUES
===================================================== */

.filter-values {

    max-height: 300px;

    overflow-y: auto;

    padding: 5px 8px;
}

.filter-value {

    display: flex;

    align-items: flex-start;

    gap: 7px;

    padding: 6px 3px;

    font-size: 13px;

    cursor: pointer;

    line-height: 17px;
}

.filter-value:hover {
    background: #f5f5f5;
}

.filter-value input {

    margin-top: 2px;

    flex-shrink: 0;

    cursor: pointer;
}

.filter-value span {

    overflow-wrap: anywhere;

    word-break: break-word;
}


/* =====================================================
   FILTER FOOTER
===================================================== */

.filter-footer {

    display: flex;

    gap: 7px;

    padding: 8px;

    border-top: 1px solid #ddd;

    background: #f8f9fa;
}

.filter-footer button {

    flex: 1;

    height: 35px;

    border-radius: 5px;

    cursor: pointer;

    font-weight: bold;
}

.apply-filter {

    background: #007bff;

    color: white;

    border: none;
}

.apply-filter:hover {
    background: #0069d9;
}

.cancel-filter {

    background: white;

    border: 1px solid #aaa;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 900px) {

    .search-grid {

        grid-template-columns:
            1fr 1fr;
    }

    .clear-btn {
        width: 100%;
    }
}

@media (max-width: 600px) {

    .search-grid {

        grid-template-columns: 1fr;
    }

    .title {
        font-size: 20px;
    }

    .tab {

        padding: 8px 12px;

        font-size: 13px;
    }
}

</style>

</head>


<body>

<div class="container">


    <!-- =================================================
         TITLE
    ================================================== -->

    <div class="title">
        Insurance Coverage List
    </div>


    <!-- =================================================
         TABS
    ================================================== -->

    <div class="tabs">

        <button
            id="thiqaTab"
            class="tab active"
            onclick="switchSheet('thiqa')">

            Thiqa Coverage List

        </button>


        <button
            id="haadTab"
            class="tab"
            onclick="switchSheet('haad')">

            HAAD List

        </button>

    </div>


    <!-- =================================================
         SEARCH
    ================================================== -->

    <div class="search-panel">

        <div class="search-grid">

            <div class="search-box">

                <input
                    id="brandSearch"
                    type="text"
                    placeholder="Search by Brand Name">

            </div>


            <div class="search-box">

                <input
                    id="genericSearch"
                    type="text"
                    placeholder="Search by Generic Name">

            </div>


            <div class="search-box">

                <input
                    id="strengthSearch"
                    type="text"
                    placeholder="Search by Strength">

            </div>


            <div class="search-box">

                <input
                    id="dosageSearch"
                    type="text"
                    placeholder="Search by Dosage Form">

            </div>


            <button
                class="clear-btn"
                onclick="clearAllSearchesAndFilters()">

                Clear Search & Filters

            </button>

        </div>

    </div>


    <!-- =================================================
         THIQA
    ================================================== -->

    <div
        id="thiqaSheet"
        class="sheet active">

        <div
            id="thiqaCount"
            class="count-bar">

            Loading...

        </div>


        <div
            id="thiqaArea"
            class="excel-area">

            <div
                id="thiqaHeader"
                class="excel-header">
            </div>


            <div
                id="thiqaVirtual"
                class="virtual-content">
            </div>

        </div>

    </div>


    <!-- =================================================
         HAAD
    ================================================== -->

    <div
        id="haadSheet"
        class="sheet">

        <div
            id="haadCount"
            class="count-bar">

            Loading...

        </div>


        <div
            id="haadArea"
            class="excel-area">

            <div
                id="haadHeader"
                class="excel-header">
            </div>


            <div
                id="haadVirtual"
                class="virtual-content">
            </div>

        </div>

    </div>


</div>


<!-- =====================================================
     FILTER POPUP
====================================================== -->

<div
    id="filterPopup"
    class="filter-popup">


    <div
        id="filterPopupHeader"
        class="filter-popup-header">

        Filter

    </div>


    <div class="filter-search">

        <input
            id="filterValueSearch"
            type="text"
            placeholder="Search values..."
            oninput="renderFilterValues()">

    </div>


    <div class="filter-actions">

        <button
            onclick="selectAllFilterValues()">

            Select All

        </button>


        <button
            onclick="clearAllFilterValues()">

            Clear All

        </button>

    </div>


    <div
        id="filterValues"
        class="filter-values">
    </div>


    <div class="filter-footer">

        <button
            class="cancel-filter"
            onclick="cancelColumnFilter()">

            Cancel

        </button>


        <button
            class="apply-filter"
            onclick="applyColumnFilter()">

            Apply

        </button>

    </div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

/*
   Row height is calculated automatically
   according to the amount of text.
*/

const MIN_ROW_HEIGHT = 42;

const LINE_HEIGHT = 17;

const ROW_VERTICAL_PADDING = 14;

const BUFFER_ROWS = 30;


/* =====================================================
   DATA
===================================================== */

let thiqaData = [];

let haadData = [];

let thiqaResults = [];

let haadResults = [];


/* =====================================================
   COLUMNS
===================================================== */

let thiqaColumns = [];

let haadColumns = [];


/* =====================================================
   FILTERS
===================================================== */

let thiqaFilters = {};

let haadFilters = {};


/* =====================================================
   CURRENT FILTER
===================================================== */

let currentFilterType = null;

let currentFilterColumn = null;


/* =====================================================
   VIRTUAL ROW INFORMATION
===================================================== */

let thiqaRowOffsets = [];

let haadRowOffsets = [];


/* =====================================================
   HAAD COLUMNS
===================================================== */

const HAAD_COLUMNS = [

    "Drug Code",

    "Insurance Plan",

    "Package Name",

    "Generic Code",

    "Generic Name",

    "Strength",

    "Dosage Form",

    "Package Size",

    "Dispense Mode",

    "Package Price to Public",

    "Package Price to Pharmacy",

    "Unit Price to Public",

    "Unit Price to Pharmacy",

    "Status",

    "Delete Effective Date",

    "Last Change Date",

    "Agent Name",

    "Manufacturer Name",

    "Insurance Coverage For Government Funded Program",

    "UPP Scope",

    "Included in Thiqa/ABM - other than 1&7 - Drug Formulary",

    "Included In Basic Drug Formulary",

    "Included In ABM 1 Drug Formulary",

    "Included In ABM 7 Drug Formulary",

    "Unit Markup",

    "Package Markup",

    "Thiqa Max. Reimbursement Price (Package)",

    "Thiqa co-pay amount (package)",

    "Basic co-pay amount (package)",

    "UPP Effective Date",

    "UPP Updated Date",

    "UPP Expiry Date"

];


/* =====================================================
   COLUMN WIDTH
===================================================== */

function getColumnWidth(column) {

    const lower =
        column.toLowerCase();


    if (
        lower.includes("generic name") ||
        lower.includes("package name") ||
        lower.includes("manufacturer") ||
        lower.includes("agent name") ||
        lower.includes("insurance coverage") ||
        lower.includes("formulary")
    ) {

        return 280;

    }


    if (
        lower.includes("dosage") ||
        lower.includes("strength")
    ) {

        return 160;

    }


    if (
        lower.includes("price") ||
        lower.includes("markup") ||
        lower.includes("reimbursement") ||
        lower.includes("copay")
    ) {

        return 155;

    }


    if (
        lower.includes("date")
    ) {

        return 140;

    }


    return 150;

}


/* =====================================================
   GET VALUE
===================================================== */

function getValue(
    row,
    column
) {

    if (!row) {
        return "";
    }


    if (
        Object.prototype.hasOwnProperty.call(
            row,
            column
        )
    ) {

        return row[column];

    }


    const target =
        column
            .trim()
            .toLowerCase();


    for (
        const key of Object.keys(row)
    ) {

        if (
            key
                .trim()
                .toLowerCase() ===
            target
        ) {

            return row[key];

        }

    }


    return "";

}


/* =====================================================
   VALUE TO TEXT
===================================================== */

function valueToText(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    if (
        typeof value === "object"
    ) {

        try {

            return JSON.stringify(
                value
            );

        }
        catch {

            return String(
                value
            );

        }

    }


    return String(
        value
    );

}


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(
    columns,
    names
) {

    for (
        const wanted of names
    ) {

        const found =
            columns.find(
                col =>
                    col
                        .trim()
                        .toLowerCase() ===
                    wanted
                        .trim()
                        .toLowerCase()
            );


        if (found) {

            return found;

        }

    }


    return null;

}


/* =====================================================
   SEARCH COLUMNS
===================================================== */

function getSearchColumns(
    type
) {

    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    return {

        brand:
            findColumn(
                columns,
                [
                    "Brand Name",
                    "Brand",
                    "Product Name",
                    "proactive name",
                    "Package Name"
                ]
            ),


        generic:
            findColumn(
                columns,
                [
                    "Generic Name"
                ]
            ),


        strength:
            findColumn(
                columns,
                [
                    "Strength"
                ]
            ),


        dosage:
            findColumn(
                columns,
                [
                    "Dosage Form",
                    "Dosage form"
                ]
            )

    };

}


/* =====================================================
   SEARCH MATCH
===================================================== */

function matchesAndSearch(
    value,
    search
) {

    if (
        !search ||
        !search.trim()
    ) {

        return true;

    }


    const text =
        valueToText(
            value
        )
        .toLowerCase();


    const terms =
        search
            .toLowerCase()
            .split("%")
            .map(
                term =>
                    term.trim()
            )
            .filter(
                term =>
                    term.length > 0
            );


    return terms.every(
        term =>
            text.includes(
                term
            )
    );

}


/* =====================================================
   SEARCH VALUES
===================================================== */

function getSearchValues() {

    return {

        brand:
            document
                .getElementById(
                    "brandSearch"
                )
                .value,


        generic:
            document
                .getElementById(
                    "genericSearch"
                )
                .value,


        strength:
            document
                .getElementById(
                    "strengthSearch"
                )
                .value,


        dosage:
            document
                .getElementById(
                    "dosageSearch"
                )
                .value

    };

}


/* =====================================================
   ROW FILTER
===================================================== */

function rowPassesFilters(
    row,
    filters
) {

    for (
        const column of Object.keys(
            filters
        )
    ) {

        const selected =
            filters[column];


        /*
           No selected values =
           show no rows.
        */

        if (
            selected.size === 0
        ) {

            return false;

        }


        const value =
            valueToText(
                getValue(
                    row,
                    column
                )
            );


        /*
           Selected values within
           one column = OR.
        */

        if (
            !selected.has(
                value
            )
        ) {

            return false;

        }

    }


    return true;

}


/* =====================================================
   FILTER DATA
===================================================== */

function filterData(
    data,
    type
) {

    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    const searches =
        getSearchValues();


    const searchColumns =
        getSearchColumns(
            type
        );


    return data.filter(
        row => {


            /* =========================================
               BRAND
            ========================================= */

            if (
                searchColumns.brand &&
                !matchesAndSearch(
                    getValue(
                        row,
                        searchColumns.brand
                    ),
                    searches.brand
                )
            ) {

                return false;

            }


            /* =========================================
               GENERIC
            ========================================= */

            if (
                searchColumns.generic &&
                !matchesAndSearch(
                    getValue(
                        row,
                        searchColumns.generic
                    ),
                    searches.generic
                )
            ) {

                return false;

            }


            /* =========================================
               STRENGTH
            ========================================= */

            if (
                searchColumns.strength &&
                !matchesAndSearch(
                    getValue(
                        row,
                        searchColumns.strength
                    ),
                    searches.strength
                )
            ) {

                return false;

            }


            /* =========================================
               DOSAGE
            ========================================= */

            if (
                searchColumns.dosage &&
                !matchesAndSearch(
                    getValue(
                        row,
                        searchColumns.dosage
                    ),
                    searches.dosage
                )
            ) {

                return false;

            }


            /* =========================================
               EXCEL FILTERS
            ========================================= */

            if (
                !rowPassesFilters(
                    row,
                    filters
                )
            ) {

                return false;

            }


            return true;

        }
    );

}


/* =====================================================
   CALCULATE ROW HEIGHT
===================================================== */

function calculateRowHeight(
    row,
    columns
) {

    let maxLines = 1;


    columns.forEach(
        column => {

            const value =
                valueToText(
                    getValue(
                        row,
                        column
                    )
                );


            if (
                !value
            ) {

                return;

            }


            const width =
                getColumnWidth(
                    column
                );


            /*
               Approximate characters
               per line.

               This gives long text
               additional vertical space.
            */

            const charsPerLine =
                Math.max(
                    12,
                    Math.floor(
                        width / 6.5
                    )
                );


            /*
               Account for explicit
               new lines.
            */

            const parts =
                value.split(
                    /\r?\n/
                );


            let lines = 0;


            parts.forEach(
                part => {

                    lines += Math.max(
                        1,
                        Math.ceil(
                            part.length /
                            charsPerLine
                        )
                    );

                }
            );


            maxLines =
                Math.max(
                    maxLines,
                    lines
                );

        }
    );


    /*
       Limit extremely long rows
       to keep the table usable.

       Long content is still wrapped.
    */

    maxLines =
        Math.min(
            maxLines,
            10
        );


    return Math.max(
        MIN_ROW_HEIGHT,
        (
            maxLines *
            LINE_HEIGHT
        ) +
        ROW_VERTICAL_PADDING
    );

}


/* =====================================================
   BUILD ROW OFFSETS
===================================================== */

function buildRowOffsets(
    type
) {

    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    const offsets = [];

    let currentTop = 0;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        offsets[i] =
            currentTop;


        currentTop +=
            calculateRowHeight(
                data[i],
                columns
            );

    }


    offsets[data.length] =
        currentTop;


    if (
        type === "thiqa"
    ) {

        thiqaRowOffsets =
            offsets;

    }
    else {

        haadRowOffsets =
            offsets;

    }


    return offsets;

}


/* =====================================================
   FIND FIRST ROW
===================================================== */

function findRowAtPosition(
    offsets,
    position
) {

    let low = 0;

    let high =
        offsets.length - 1;


    while (
        low < high
    ) {

        const mid =
            Math.floor(
                (
                    low +
                    high
                ) / 2
            );


        if (
            offsets[mid] < position
        ) {

            low =
                mid + 1;

        }
        else {

            high =
                mid;

        }

    }


    return Math.max(
        0,
        low - 1
    );

}


/* =====================================================
   RENDER VIRTUAL TABLE
===================================================== */

function renderVirtualTable(
    type
) {

    const area =
        document.getElementById(
            type === "thiqa"
                ? "thiqaArea"
                : "haadArea"
        );


    const virtual =
        document.getElementById(
            type === "thiqa"
                ? "thiqaVirtual"
                : "haadVirtual"
        );


    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    /*
       Calculate individual row
       positions.
    */

    const offsets =
        buildRowOffsets(
            type
        );


    virtual.innerHTML =
        "";


    /*
       Total virtual height.
    */

    virtual.style.height =
        (
            offsets[
                data.length
            ] || 0
        ) + "px";


    virtual.style.width =
        "max-content";


    virtual.style.minWidth =
        "100%";


    function drawRows() {

        virtual.innerHTML =
            "";


        if (
            data.length === 0
        ) {

            return;

        }


        const scrollTop =
            area.scrollTop;


        const viewportHeight =
            area.clientHeight;


        let start =
            findRowAtPosition(
                offsets,
                scrollTop
            );


        let end =
            findRowAtPosition(
                offsets,
                scrollTop +
                viewportHeight
            );


        start =
            Math.max(
                0,
                start - BUFFER_ROWS
            );


        end =
            Math.min(
                data.length - 1,
                end + BUFFER_ROWS
            );


        for (
            let i = start;
            i <= end;
            i++
        ) {

            const row =
                data[i];


            const top =
                offsets[i];


            const bottom =
                offsets[i + 1];


            const rowHeight =
                bottom - top;


            const rowElement =
                document.createElement(
                    "div"
                );


            rowElement.className =
                "data-row";


            rowElement.style.top =
                top + "px";


            rowElement.style.height =
                rowHeight + "px";


            rowElement.style.gridTemplateColumns =
                columns
                    .map(
                        column =>
                            `${getColumnWidth(column)}px`
                    )
                    .join(" ");


            columns.forEach(
                column => {

                    const cell =
                        document.createElement(
                            "div"
                        );


                    cell.className =
                        "data-cell";


                    const value =
                        valueToText(
                            getValue(
                                row,
                                column
                            )
                        );


                    cell.textContent =
                        value;


                    /*
                       Full text available
                       through browser tooltip.
                    */

                    if (
                        value.length > 25
                    ) {

                        cell.title =
                            value;

                    }


                    const lowerColumn =
                        column
                            .trim()
                            .toLowerCase();


                    const lowerValue =
                        value
                            .trim()
                            .toLowerCase();


                    /*
                       ==================================
                       THIQA / BASIC SPECIAL COLOURS
                       ==================================
                    */

                    const isThiqaColumn =
                        lowerColumn ===
                        "thiqa";


                    const isBasicColumn =
                        lowerColumn ===
                        "basic";


                    if (
                        isThiqaColumn ||
                        isBasicColumn
                    ) {

                        if (
                            lowerValue === "yes"
                        ) {

                            cell.classList.add(
                                "important-yes"
                            );

                        }
                        else if (
                            lowerValue === "no"
                        ) {

                            cell.classList.add(
                                "important-no"
                            );

                        }

                    }


                    /*
                       Other YES / NO values.
                    */

                    else {

                        if (
                            lowerValue ===
                            "yes"
                        ) {

                            cell.classList.add(
                                "yes-value"
                            );

                        }


                        if (
                            lowerValue ===
                            "no"
                        ) {

                            cell.classList.add(
                                "no-value"
                            );

                        }

                    }


                    rowElement.appendChild(
                        cell
                    );

                }
            );


            virtual.appendChild(
                rowElement
            );

        }

    }


    drawRows();


    /*
       Remove previous scroll
       handler.
    */

    if (
        area._virtualHandler
    ) {

        area.removeEventListener(
            "scroll",
            area._virtualHandler
        );

    }


    area._virtualHandler =
        () => {

            requestAnimationFrame(
                drawRows
            );

        };


    area.addEventListener(
        "scroll",
        area._virtualHandler,
        {
            passive: true
        }
    );


    /*
       Always start at top after
       filtering/searching.
    */

    area.scrollTop =
        0;

}

===================================================== */

function switchSheet(
    type
) {

    const thiqaSheet =
        document.getElementById(
            "thiqaSheet"
        );


    const haadSheet =
        document.getElementById(
            "haadSheet"
        );

    ) {

        );

            "active"
        );

            "active"
        );

    }
    else {

        );

        thiqaSheet.classList.remove(
            "active"
        );

        haadTab.classList.add(
            "active"
        );

        thiqaTab.classList.remove(
            "active"
        );

    }


    closeFilterPopup();

}


/* =====================================================
   OPEN FILTER
===================================================== */

function openFilter(
    type,
    column,
    button
) {

    currentFilterType =
        type;


    currentFilterColumn =
        column;


    const popup =
        document.getElementById(
            "filterPopup"
        );


    const popupHeader =
        document.getElementById(
            "filterPopupHeader"
        );


    popupHeader.textContent =
        "Filter: " +
        column;


    document.getElementById(
        "filterValueSearch"
    ).value =
        "";


    const data =
        type === "thiqa"
            ? thiqaData
            : haadData;


    /*
       Get unique values from
       ORIGINAL DATASET.

       This is important because
       Excel's filter list is based
       on the column's available
       values, not just the currently
       rendered rows.
    */

    const valueSet =
        new Set();


    data.forEach(
        row => {

            const value =
                valueToText(
                    getValue(
                        row,
                        column
                    )
                );


            valueSet.add(
                value
            );

        }
    );


    const allValues =
        Array.from(
            valueSet
        ).sort(
            (a, b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
        );


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    let selected;


    if (
        Object.prototype.hasOwnProperty.call(
            filters,
            column
        )
    ) {

        selected =
            new Set(
                filters[column]
            );

    }
    else {

        selected =
            new Set(
                allValues
            );

    }


    popup._allValues =
        allValues;


    popup._selected =
        selected;


    renderFilterValues();


    popup.style.display =
        "block";


    /*
       Position popup.
    */

    const rect =
        button.getBoundingClientRect();


    const popupWidth =
        popup.offsetWidth;


    const popupHeight =
        popup.offsetHeight;


    let left =
        rect.left;


    let top =
        rect.bottom + 4;


    if (
        left +
        popupWidth >
        window.innerWidth
    ) {

        left =
            window.innerWidth -
            popupWidth -
            10;

    }


    if (
        left < 5
    ) {

        left = 5;

    }


    if (
        top +
        popupHeight >
        window.innerHeight
    ) {

        top =
            rect.top -
            popupHeight -
            4;

    }


    if (
        top < 5
    ) {

        top = 5;

    }


    popup.style.left =
        left + "px";


    popup.style.top =
        top + "px";

}


/* =====================================================
   RENDER FILTER VALUES
===================================================== */

function renderFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    const container =
        document.getElementById(
            "filterValues"
        );


    const search =
        document
            .getElementById(
                "filterValueSearch"
            )
            .value
            .trim()
            .toLowerCase();


    const allValues =
        popup._allValues ||
        [];


    const selected =
        popup._selected ||
        new Set();


    container.innerHTML =
        "";


    /*
       Only values matching the
       filter-search text are shown.
    */

    const visibleValues =
        allValues.filter(
            value =>
                value
                    .toLowerCase()
                    .includes(
                        search
                    )
        );


    if (
        visibleValues.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.style.padding =
            "15px";


        empty.style.color =
            "#777";


        empty.textContent =
            "No values found";


        container.appendChild(
            empty
        );


        return;

    }


    visibleValues.forEach(
        value => {

            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "filter-value";


            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.checked =
                selected.has(
                    value
                );


            checkbox.addEventListener(
                "change",
                () => {

                    if (
                        checkbox.checked
                    ) {

                        selected.add(
                            value
                        );

                    }
                    else {

                        selected.delete(
                            value
                        );

                    }

                }
            );


            const text =
                document.createElement(
                    "span"
                );


            text.textContent =
                value === ""
                    ? "(Blank)"
                    : value;


            label.appendChild(
                checkbox
            );


            label.appendChild(
                text
            );


            container.appendChild(
                label
            );

        }
    );

}


/* =====================================================
   EXCEL SELECT ALL
===================================================== */

function selectAllFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    const search =
        document
            .getElementById(
                "filterValueSearch"
            )
            .value
            .trim()
            .toLowerCase();


    const allValues =
        popup._allValues ||
        [];


    /*
       THIS IS THE IMPORTANT CHANGE.

       If the user searched inside
       the filter popup, "Select All"
       selects ONLY the values that
       match that search.

       Example:

       Search:
       paracetamol

       Select All

       => selects all values
       containing paracetamol

       NOT all values in the column.

       This matches Excel behavior.
    */

    const visibleValues =
        allValues.filter(
            value =>
                value
                    .toLowerCase()
                    .includes(
                        search
                    )
        );


    popup._selected =
        new Set(
            visibleValues
        );


    renderFilterValues();

}


/* =====================================================
   CLEAR ALL FILTER VALUES
===================================================== */

function clearAllFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    /*
       Excel-style:

       Clear All = remove all
       selected checkboxes.

       The search text remains,
       allowing the user to then
       select specific matches.
    */

    popup._selected =
        new Set();


    renderFilterValues();

}


/* =====================================================
   APPLY COLUMN FILTER
===================================================== */

function applyColumnFilter() {

    if (
        !currentFilterType ||
        !currentFilterColumn
    ) {

        return;

    }


    const type =
        currentFilterType;


    const column =
        currentFilterColumn;


    const popup =
        document.getElementById(
            "filterPopup"
        );


    const allValues =
        popup._allValues ||
        [];


    const selected =
        popup._selected ||
        new Set();


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    /*
       If ALL values are selected,
       there is no actual restriction.

       Therefore remove the filter.
    */

    if (
        selected.size ===
        allValues.length
    ) {

        delete filters[column];

    }

    /*
       If NOTHING is selected,
       the column should show no rows.
    */

    else if (
        selected.size === 0
    ) {

        filters[column] =
            new Set();

    }

    /*
       Otherwise store exactly
       what the user selected.
    */

    else {

        filters[column] =
            new Set(
                selected
            );

    }


    closeFilterPopup();


    renderHeader(
        type
    );


    /*
       Apply search + filters
       together.
    */

    applySearches();

}


/* =====================================================
   CANCEL
===================================================== */

function cancelColumnFilter() {

    closeFilterPopup();

}


/* =====================================================
   CLOSE POPUP
===================================================== */

function closeFilterPopup() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    popup.style.display =
        "none";


    currentFilterType =
        null;


    currentFilterColumn =
        null;

}


/* =====================================================
   CLEAR SEARCH + FILTERS
===================================================== */

function clearAllSearchesAndFilters() {

    closeFilterPopup();


    /*
       Clear all search boxes.
    */

    document.getElementById(
        "brandSearch"
    ).value = "";


    document.getElementById(
        "genericSearch"
    ).value = "";


    document.getElementById(
        "strengthSearch"
    ).value = "";


    document.getElementById(
        "dosageSearch"
    ).value = "";


    /*
       Remove ALL column filters.
    */

    thiqaFilters = {};

    haadFilters = {};


    /*
       Restore original data.
    */

    thiqaResults =
        thiqaData.slice();


    haadResults =
        haadData.slice();


    /*
       Rebuild headers.
    */

    renderHeader(
        "thiqa"
    );


    renderHeader(
        "haad"
    );


    /*
       Rebuild tables.
    */

    renderVirtualTable(
        "thiqa"
    );


    renderVirtualTable(
        "haad"
    );


    /*
       Reset scroll.
    */

    document.getElementById(
        "thiqaArea"
    ).scrollTop = 0;


    document.getElementById(
        "thiqaArea"
    ).scrollLeft = 0;


    document.getElementById(
        "haadArea"
    ).scrollTop = 0;


    document.getElementById(
        "haadArea"
    ).scrollLeft = 0;


    updateCount(
        "thiqa"
    );


    updateCount(
        "haad"
    );

}


/* =====================================================
   OUTSIDE CLICK
===================================================== */

document.addEventListener(
    "click",
    event => {

        const popup =
            document.getElementById(
                "filterPopup"
            );


        if (
            popup.style.display ===
            "block" &&

            !popup.contains(
                event.target
            ) &&

            !event.target.closest(
                ".filter-btn"
            )
        ) {

            closeFilterPopup();

        }

    }
);


/* =====================================================
   SEARCH EVENTS
===================================================== */

let searchTimer = null;


function delayedSearch() {

    clearTimeout(
        searchTimer
    );


    searchTimer =
        setTimeout(
            () => {

                applySearches();

            },
            120
        );

}


document.getElementById(
    "brandSearch"
).addEventListener(

    delayedSearch
);


document.getElementById(
    "genericSearch"
).addEventListener(
    "input",
    delayedSearch
);


document.getElementById(
    "strengthSearch"
).addEventListener(
    "input",
    delayedSearch
);


document.getElementById(
    "dosageSearch"
).addEventListener(
    "input",
    delayedSearch
);


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData() {

    try {

        /*
           Load both JSON files
           simultaneously.
        */

        const [
            thiqaResponse,
            haadResponse
        ] =
            await Promise.all([

                fetch(
                    "data.json?v=" +
                    Date.now(),
                    {
                        cache:
                            "no-store"
                    }
                ),


                fetch(
                    "HAAD_LIST.json?v=" +
                    Date.now(),
                    {
                        cache:
                            "no-store"
                    }
                )

            ]);


        if (
            !thiqaResponse.ok
        ) {

            throw new Error(
                "Could not load data.json"
            );

        }


        if (
            !haadResponse.ok
        ) {

            throw new Error(
                "Could not load HAAD_LIST.json"
            );

        }


        thiqaData =
            await thiqaResponse.json();


        haadData =
            await haadResponse.json();


        if (
            !Array.isArray(
                thiqaData
            )
        ) {

            throw new Error(
                "data.json must contain an array."
            );

        }


        if (
            !Array.isArray(
                haadData
            )
        ) {

            throw new Error(
                "HAAD_LIST.json must contain an array."
            );

        }


        /*
           THIQA columns:
           use the keys from JSON.
        */

        if (
            thiqaData.length > 0
        ) {

            thiqaColumns =
                Object.keys(
                    thiqaData[0]
                );

        }


        /*
           HAAD columns:
           preserve the requested order.
        */

        if (
            haadData.length > 0
        ) {

            const actualKeys =
                Object.keys(
                    haadData[0]
                );


            haadColumns =
                HAAD_COLUMNS
                    .map(
                        wanted => {

                            const exact =
                                actualKeys.find(
                                    key =>
                                        key ===
                                        wanted
                                );


                            if (
                                exact
                            ) {

                                return exact;

                            }


                            const insensitive =
                                actualKeys.find(
                                    key =>
                                        key
                                            .trim()
                                            .toLowerCase() ===
                                        wanted
                                            .trim()
                                            .toLowerCase()
                                );


                            return (
                                insensitive ||
                                null
                            );

                        }
                    )
                    .filter(
                        Boolean
                    );

        }


        /*
           Initial results.
        */

        thiqaResults =
            thiqaData.slice();


        haadResults =
            haadData.slice();


        /*
           Draw everything.
        */

        renderHeader(
            "thiqa"
        );


        renderHeader(
            "haad"
        );


        renderVirtualTable(
            "thiqa"
        );


        renderVirtualTable(
            "haad"
        );


        updateCount(
            "thiqa"
        );


        updateCount(
            "haad"
        );

    }

    catch (error) {

        console.error(
            error
        );


        const message =
            document.createElement(
                "div"
            );


        message.style.padding =
            "20px";


        message.style.color =
            "#b00020";


        message.style.fontWeight =
            "bold";


        message.innerHTML =
            `
            Error loading the insurance lists.
            <br><br>

            ${error.message}

            <br><br>

            Make sure these files are in
            the same GitHub Pages folder:

            <br>

            <b>index.html</b>

            <br>

            <b>data.json</b>

            <br>

            <b>HAAD_LIST.json</b>
            `;


        document.body.appendChild(
            message
        );

    }

}


/* =====================================================
   START
===================================================== */

loadData();

</script>

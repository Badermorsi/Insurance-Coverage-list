<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance Coverage List</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

/* =========================
   MAIN CONTAINER
========================= */

.page {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.title {
    height: 62px;
    min-height: 62px;
    background: white;
    border-bottom: 1px solid #dbe3ec;

    display: flex;
    align-items: center;
    padding: 0 20px;

    color: #0757a0;
    font-size: 23px;
    font-weight: 700;
}

/* =========================
   TABS
========================= */

.tabs {
    height: 50px;
    min-height: 50px;

    background: white;
    border-bottom: 1px solid #cbd5e1;

    display: flex;
    align-items: stretch;
}

.tab {
    min-width: 190px;

    padding: 0 24px;

    border: none;
    border-right: 1px solid #dbe3ec;

    background: #f8fafc;

    color: #475569;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}

.tab:hover {
    background: #eef5ff;
}

.tab.active {
    background: #0757a0;
    color: white;
}

/* =========================
   SEARCH AREA
========================= */

.search-area {
    min-height: 76px;
    height: auto;

    background: white;
    border-bottom: 1px solid #dbe3ec;

    padding: 10px 14px;

    display: grid;
    grid-template-columns:
        minmax(180px, 1fr)
        minmax(180px, 1fr)
        minmax(180px, 1fr)
        minmax(180px, 1fr);

    gap: 10px;
}

.search-box {
    position: relative;
}

.search-box label {
    display: block;

    margin-bottom: 4px;

    color: #475569;

    font-size: 11px;
    font-weight: 700;
}

.search-box input {
    width: 100%;
    height: 36px;

    padding: 0 12px;

    border: 1px solid #cbd5e1;
    border-radius: 5px;

    outline: none;

    font-size: 13px;

    background: white;
}

.search-box input:focus {
    border-color: #1976d2;
    box-shadow: 0 0 0 2px rgba(25,118,210,0.10);
}

.search-box input::placeholder {
    color: #94a3b8;
}

/* =========================
   SHEET AREA
========================= */

.sheet {
    display: none;

    flex: 1;
    min-height: 0;

    flex-direction: column;
}

.sheet.active {
    display: flex;
}

/* =========================
   INFO BAR
========================= */

.info-bar {
    height: 34px;
    min-height: 34px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    background: #f8fafc;

    border-bottom: 1px solid #dbe3ec;

    font-size: 11px;
    color: #64748b;
}

.loading {
    color: #0757a0;
    font-weight: 700;
}

.error {
    color: #dc2626;
    font-weight: 700;
}

/* =========================
   EXCEL AREA
========================= */

.excel-area {
    flex: 1;
    min-height: 0;

    position: relative;

    overflow: auto;

    background: white;
}

/*
   IMPORTANT:
   Both horizontal and vertical
   scrolling are provided by this
   single container.
*/

.excel-content {
    position: relative;

    min-width: max-content;
}

/* =========================
   HEADER
========================= */

.excel-header {
    position: sticky;
    top: 0;
    z-index: 50;

    display: grid;

    width: max-content;
    min-width: 100%;

    height: 48px;

    background: #0757a0;

    color: white;

    border-bottom: 2px solid #063f75;
}

.header-cell {
    min-width: 0;

    height: 48px;

    padding: 5px 6px;

    display: flex;
    align-items: center;

    border-right: 1px solid rgba(255,255,255,0.25);

    position: relative;
}

.header-title {
    flex: 1;

    min-width: 0;

    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 11px;
    font-weight: 700;
}

/* =========================
   FILTER BUTTON
========================= */

.filter-button {
    width: 24px;
    height: 28px;

    flex-shrink: 0;

    margin-left: 3px;

    border: none;
    border-radius: 3px;

    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 13px;
}

.filter-button:hover {
    background: rgba(255,255,255,0.18);
}

.filter-button.filtered {
    background: white;
    color: #0757a0;
}

/* =========================
   VIRTUAL CONTENT
========================= */

.virtual-content {
    position: relative;

    width: max-content;
    min-width: 100%;
}

.data-row {
    position: absolute;

    left: 0;

    display: grid;

    width: max-content;
    min-width: 100%;

    height: 32px;

    background: white;

    border-bottom: 1px solid #e2e8f0;
}

.data-cell {
    height: 32px;

    min-width: 0;

    padding: 7px 6px;

    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    border-right: 1px solid #e2e8f0;

    font-size: 11px;

    background: white;
}

.data-row:hover .data-cell {
    background: #f0f7ff;
}

/* =========================
   YES / NO
========================= */

.yes-cell {
    background: #dcfce7 !important;
    color: #15803d !important;
    font-weight: 700;
}

.no-cell {
    background: #fee2e2 !important;
    color: #dc2626 !important;
    font-weight: 700;
}

/* =========================
   FILTER POPUP
========================= */

.filter-popup {
    position: fixed;

    z-index: 9999;

    width: 300px;
    max-width: calc(100vw - 20px);

    background: white;

    border: 1px solid #cbd5e1;
    border-radius: 6px;

    box-shadow:
        0 8px 25px rgba(15,23,42,0.18);

    padding: 10px;

    display: none;
}

.filter-popup.show {
    display: block;
}

.filter-search {
    width: 100%;
    height: 34px;

    border: 1px solid #cbd5e1;
    border-radius: 4px;

    padding: 0 9px;

    outline: none;

    font-size: 12px;
}

.filter-search:focus {
    border-color: #1976d2;
}

.filter-actions {
    display: flex;

    gap: 6px;

    margin: 8px 0;
}

.filter-actions button {
    flex: 1;

    height: 30px;

    border: 1px solid #cbd5e1;
    border-radius: 4px;

    background: #f8fafc;

    color: #334155;

    cursor: pointer;

    font-size: 11px;
    font-weight: 600;
}

.filter-actions button:hover {
    background: #e2e8f0;
}

.filter-values {
    max-height: 270px;

    overflow-y: auto;

    border-top: 1px solid #e2e8f0;
    border-bottom: 1px solid #e2e8f0;

    padding: 5px 0;
}

.filter-option {
    min-height: 28px;

    display: flex;
    align-items: center;

    gap: 7px;

    padding: 3px 5px;

    cursor: pointer;

    font-size: 11px;
}

.filter-option:hover {
    background: #f1f5f9;
}

.filter-option input {
    margin: 0;
}

.filter-value-text {
    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;
}

.filter-footer {
    display: flex;

    gap: 6px;

    margin-top: 8px;
}

.filter-footer button {
    flex: 1;

    height: 32px;

    border-radius: 4px;

    cursor: pointer;

    font-size: 11px;
    font-weight: 700;
}

.apply-filter {
    border: none;

    background: #0757a0;

    color: white;
}

.cancel-filter {
    border: 1px solid #cbd5e1;

    background: white;

    color: #475569;
}

/* =========================
   NO DATA
========================= */

.no-data {
    width: 100%;

    padding: 50px;

    text-align: center;

    color: #64748b;

    font-size: 13px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .title {
        height: 55px;
        min-height: 55px;

        font-size: 19px;
    }

    .tabs {
        height: 45px;
        min-height: 45px;
    }

    .tab {
        min-width: 140px;

        padding: 0 12px;

        font-size: 12px;
    }

    .search-area {
        grid-template-columns: 1fr 1fr;

        padding: 8px;

        gap: 7px;
    }

    .search-box input {
        height: 34px;
    }

    .info-bar {
        font-size: 10px;
    }
}

@media (max-width: 500px) {

    .search-area {
        grid-template-columns: 1fr;
    }

    .tab {
        flex: 1;
        min-width: 0;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="title">
        Insurance Coverage List
    </div>

    <!-- =========================
         TABS
    ========================== -->

    <div class="tabs">

        <button
            class="tab active"
            id="thiqaTab"
            onclick="switchSheet('thiqa')">
            Thiqa Coverage List
        </button>

        <button
            class="tab"
            id="haadTab"
            onclick="switchSheet('haad')">
            HAAD List
        </button>

    </div>

    <!-- =========================
         SEARCHES
    ========================== -->

    <div class="search-area">

        <div class="search-box">

            <label>
                Brand Name
            </label>

            <input
                id="brandSearch"
                type="text"
                placeholder="Search brand...">
        </div>

        <div class="search-box">

            <label>
                Generic Name
            </label>

            <input
                id="genericSearch"
                type="text"
                placeholder="Search generic...">
        </div>

        <div class="search-box">

            <label>
                Strength
            </label>

            <input
                id="strengthSearch"
                type="text"
                placeholder="Search strength...">
        </div>

        <div class="search-box">

            <label>
                Dosage Form
            </label>

            <input
                id="dosageSearch"
                type="text"
                placeholder="Search dosage form...">
        </div>

    </div>

    <!-- =========================
         THIQA SHEET
    ========================== -->

    <div
        class="sheet active"
        id="thiqaSheet">

        <div class="info-bar">

            <span id="thiqaStatus">
                Loading Thiqa Coverage List...
            </span>

            <span id="thiqaCount">
                0 records
            </span>

        </div>

        <div
            class="excel-area"
            id="thiqaArea">

            <div
                class="excel-content"
                id="thiqaContent">

                <div
                    class="excel-header"
                    id="thiqaHeader">
                </div>

                <div
                    class="virtual-content"
                    id="thiqaVirtualContent">
                </div>

            </div>

        </div>

    </div>

    <!-- =========================
         HAAD SHEET
    ========================== -->

    <div
        class="sheet"
        id="haadSheet">

        <div class="info-bar">

            <span id="haadStatus">
                Loading HAAD List...
            </span>

            <span id="haadCount">
                0 records
            </span>

        </div>

        <div
            class="excel-area"
            id="haadArea">

            <div
                class="excel-content"
                id="haadContent">

                <div
                    class="excel-header"
                    id="haadHeader">
                </div>

                <div
                    class="virtual-content"
                    id="haadVirtualContent">
                </div>

            </div>

        </div>

    </div>

</div>

<!-- FILTER POPUP -->

<div
    class="filter-popup"
    id="filterPopup">

    <input
        class="filter-search"
        id="filterSearch"
        type="text"
        placeholder="Search values...">

    <div class="filter-actions">

        <button
            onclick="selectAllFilterValues()">
            Select All
        </button>

        <button
            onclick="clearAllFilterValues()">
            Clear All
        </button>

    </div>

    <div
        class="filter-values"
        id="filterValues">
    </div>

    <div class="filter-footer">

        <button
            class="cancel-filter"
            onclick="cancelColumnFilter()">
            Cancel
        </button>

        <button
            class="apply-filter"
            onclick="applyColumnFilter()">
            Apply
        </button>

    </div>

</div>

<script>

/* =========================================================
   SETTINGS
========================================================= */

const ROW_HEIGHT = 32;

/*
   Around 100 rows are rendered around
   the visible area.

   This keeps the browser fast even if
   the JSON contains thousands of rows.
*/
const BUFFER_ROWS = 50;


/* =========================================================
   DATA
========================================================= */

let thiqaData = [];
let haadData = [];

let thiqaResults = [];
let haadResults = [];

let thiqaColumns = [];
let haadColumns = [];

let thiqaFilters = {};
let haadFilters = {};

let currentSheet = "thiqa";

let currentFilterType = null;
let currentFilterColumn = null;

let searchTimer = null;


/* =========================================================
   HAAD COLUMNS
========================================================= */

haadColumns = [

    "Drug Code",
    "Insurance Plan",
    "Package Name",
    "Generic Code",
    "Generic Name",
    "Strength",
    "Dosage Form",
    "Package Size",
    "Dispense Mode",
    "Package Price to Public",
    "Package Price to Pharmacy",
    "Unit Price to Public",
    "Unit Price to Pharmacy",
    "Status",
    "Delete Effective Date",
    "Last Change Date",
    "Agent Name",
    "Manufacturer Name",
    "Insurance Coverage For Government Funded Program",
    "UPP Scope",
    "Included in Thiqa/ABM - other than 1&7 - Drug Formulary",
    "Included In Basic Drug Formulary",
    "Included In ABM 1 Drug Formulary",
    "Included In ABM 7 Drug Formulary",
    "Unit Markup",
    "Package Markup",
    "Thiqa Max. Reimbursement Price (Package)",
    "Thiqa co-pay amount (package)",
    "Basic co-pay amount (package)",
    "UPP Effective Date",
    "UPP Updated Date",
    "UPP Expiry Date"

];


/* =========================================================
   LOAD JSON
========================================================= */

async function loadData() {

    setStatus(
        "thiqa",
        "Loading Thiqa Coverage List..."
    );

    setStatus(
        "haad",
        "Loading HAAD List..."
    );

    try {

        /*
           Load BOTH files at the same time.
        */

        const [thiqaResponse, haadResponse] =
            await Promise.all([

                fetch(
                    "data.json?v=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                ),

                fetch(
                    "HAAD_LIST.json?v=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                )

            ]);


        if (!thiqaResponse.ok) {

            throw new Error(
                "Could not load data.json"
            );

        }

        if (!haadResponse.ok) {

            throw new Error(
                "Could not load HAAD_LIST.json"
            );

        }


        const thiqaJson =
            await thiqaResponse.json();

        const haadJson =
            await haadResponse.json();


        /*
           Make sure arrays are used.
        */

        thiqaData =
            Array.isArray(thiqaJson)
                ? thiqaJson
                : [];

        haadData =
            Array.isArray(haadJson)
                ? haadJson
                : [];


        /*
           Thiqa columns come directly
           from the JSON keys.
        */

        if (thiqaData.length > 0) {

            thiqaColumns =
                Object.keys(
                    thiqaData[0]
                );

        }


        /*
           Initialize filters.
        */

        thiqaFilters = {};
        haadFilters = {};


        /*
           Initial results = ALL data.
        */

        thiqaResults =
            thiqaData.slice();

        haadResults =
            haadData.slice();


        /*
           Render headers.
        */

        renderHeader("thiqa");
        renderHeader("haad");


        /*
           Render data.
        */

        renderVirtualTable("thiqa");
        renderVirtualTable("haad");


        setStatus(
            "thiqa",
            "Loaded successfully"
        );

        setStatus(
            "haad",
            "Loaded successfully"
        );


        updateCount("thiqa");
        updateCount("haad");


    } catch (error) {

        console.error(error);

        setStatus(
            "thiqa",
            "Error: " + error.message,
            true
        );

        setStatus(
            "haad",
            "Error: " + error.message,
            true
        );

    }

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    type,
    text,
    isError = false
) {

    const element =
        document.getElementById(
            type + "Status"
        );

    element.textContent = text;

    element.className =
        isError
            ? "error"
            : "";

}


/* =========================================================
   GET COLUMN WIDTH
========================================================= */

function getColumnWidth(
    type,
    column
) {

    /*
       Special widths for important fields.
    */

    const name =
        column.toLowerCase();


    if (
        name.includes("brand") ||
        name.includes("proactive name") ||
        name.includes("package name")
    ) {
        return "300px";
    }


    if (
        name.includes("generic name")
    ) {
        return "260px";
    }


    if (
        name.includes("manufacturer")
    ) {
        return "220px";
    }


    if (
        name.includes("insurance coverage")
    ) {
        return "300px";
    }


    if (
        name.includes("formulary")
    ) {
        return "300px";
    }


    if (
        name.includes("strength")
    ) {
        return "130px";
    }


    if (
        name.includes("dosage")
    ) {
        return "150px";
    }


    if (
        name.includes("date")
    ) {
        return "140px";
    }


    if (
        name.includes("price") ||
        name.includes("markup") ||
        name.includes("co-pay")
    ) {
        return "150px";
    }


    return "150px";

}


/* =========================================================
   GET VALUE
========================================================= */

function getValue(
    row,
    column
) {

    if (
        row === null ||
        row === undefined
    ) {
        return "";
    }


    if (
        Object.prototype.hasOwnProperty.call(
            row,
            column
        )
    ) {

        return row[column];

    }


    /*
       Case-insensitive fallback.

       Useful if JSON uses slightly
       different capitalization.
    */

    const wanted =
        String(column)
            .trim()
            .toLowerCase();


    const key =
        Object.keys(row).find(
            k =>
                String(k)
                    .trim()
                    .toLowerCase()
                === wanted
        );


    if (key !== undefined) {

        return row[key];

    }


    return "";

}


/* =========================================================
   VALUE TO TEXT
========================================================= */

function valueToText(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }


    if (
        typeof value === "object"
    ) {

        try {

            return JSON.stringify(value);

        } catch {

            return String(value);

        }

    }


    return String(value);

}


/* =========================================================
   FIND COLUMN
========================================================= */

function findColumn(
    columns,
    possibleNames
) {

    for (
        const possible
        of possibleNames
    ) {

        const exact =
            columns.find(
                column =>
                    String(column)
                        .trim()
                        .toLowerCase()
                    ===
                    possible
                        .trim()
                        .toLowerCase()
            );

        if (exact) {

            return exact;

        }

    }


    /*
       Fallback: partial match.
    */

    for (
        const possible
        of possibleNames
    ) {

        const partial =
            columns.find(
                column =>
                    String(column)
                        .toLowerCase()
                        .includes(
                            possible
                                .toLowerCase()
                        )
            );

        if (partial) {

            return partial;

        }

    }


    return null;

}


/* =========================================================
   SEARCH COLUMN
========================================================= */

function getSearchColumns(
    type
) {

    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    let brandColumn =
        findColumn(
            columns,
            [
                "Brand Name",
                "Brand",
                "proactive name",
                "Product Name",
                "Package Name"
            ]
        );


    let genericColumn =
        findColumn(
            columns,
            [
                "Generic Name"
            ]
        );


    let strengthColumn =
        findColumn(
            columns,
            [
                "Strength"
            ]
        );


    let dosageColumn =
        findColumn(
            columns,
            [
                "Dosage Form",
                "Dosage form"
            ]
        );


    return {
        brand: brandColumn,
        generic: genericColumn,
        strength: strengthColumn,
        dosage: dosageColumn
    };

}


/* =========================================================
   AND SEARCH
========================================================= */

function matchesAndSearch(
    value,
    search
) {

    if (
        !search ||
        !search.trim()
    ) {
        return true;
    }


    const text =
        valueToText(value)
            .toLowerCase();


    /*
       % means AND.

       Example:

       pana%adol

       becomes:

       ["pana", "adol"]
    */

    const terms =
        search
            .toLowerCase()
            .split("%")
            .map(
                term =>
                    term.trim()
            )
            .filter(
                term =>
                    term.length > 0
            );


    return terms.every(
        term =>
            text.includes(term)
    );

}


/* =========================================================
   APPLY ALL SEARCHES
========================================================= */

function applySearches() {

    const searches = {

        brand:
            document
                .getElementById(
                    "brandSearch"
                )
                .value
                .trim(),

        generic:
            document
                .getElementById(
                    "genericSearch"
                )
                .value
                .trim(),

        strength:
            document
                .getElementById(
                    "strengthSearch"
                )
                .value
                .trim(),

        dosage:
            document
                .getElementById(
                    "dosageSearch"
                )
                .value
                .trim()

    };


    filterData(
        "thiqa",
        searches
    );

    filterData(
        "haad",
        searches
    );

}


/* =========================================================
   FILTER DATA
========================================================= */

function filterData(
    type,
    searches
) {

    const source =
        type === "thiqa"
            ? thiqaData
            : haadData;


    const columns =
        getSearchColumns(type);


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    const results =
        source.filter(
            row => {

                /*
                   Brand
                */

                if (
                    searches.brand &&
                    columns.brand &&
                    !matchesAndSearch(
                        getValue(
                            row,
                            columns.brand
                        ),
                        searches.brand
                    )
                ) {
                    return false;
                }


                /*
                   Generic
                */

                if (
                    searches.generic &&
                    columns.generic &&
                    !matchesAndSearch(
                        getValue(
                            row,
                            columns.generic
                        ),
                        searches.generic
                    )
                ) {
                    return false;
                }


                /*
                   Strength
                */

                if (
                    searches.strength &&
                    columns.strength &&
                    !matchesAndSearch(
                        getValue(
                            row,
                            columns.strength
                        ),
                        searches.strength
                    )
                ) {
                    return false;
                }


                /*
                   Dosage
                */

                if (
                    searches.dosage &&
                    columns.dosage &&
                    !matchesAndSearch(
                        getValue(
                            row,
                            columns.dosage
                        ),
                        searches.dosage
                    )
                ) {
                    return false;
                }


                /*
                   Column filters
                */

                for (
                    const column
                    of Object.keys(filters)
                ) {

                    const selected =
                        filters[column];


                    if (
                        !selected ||
                        selected.size === 0
                    ) {
                        continue;
                    }


                    const value =
                        valueToText(
                            getValue(
                                row,
                                column
                            )
                        );


                    if (
                        !selected.has(
                            value
                        )
                    ) {
                        return false;
                    }

                }


                return true;

            }
        );


    if (type === "thiqa") {

        thiqaResults =
            results;

    } else {

        haadResults =
            results;

    }


    renderVirtualTable(type);

    updateCount(type);

}


/* =========================================================
   DEBOUNCED SEARCH
========================================================= */

function delayedSearch() {

    clearTimeout(
        searchTimer
    );


    searchTimer =
        setTimeout(
            () => {

                applySearches();

            },
            120
        );

}


/* =========================================================
   RENDER HEADER
========================================================= */

function renderHeader(type) {

    const header =
        document.getElementById(
            type + "Header"
        );


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    header.innerHTML = "";


    if (!columns.length) {
        return;
    }


    const gridColumns =
        columns
            .map(
                column =>
                    getColumnWidth(
                        type,
                        column
                    )
            )
            .join(" ");


    header.style.gridTemplateColumns =
        gridColumns;


    columns.forEach(
        column => {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "header-cell";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "header-title";

            title.textContent =
                column;


            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "filter-button";


            /*
               Filter icon
            */

            button.innerHTML =
                "▼";


            button.title =
                "Filter " + column;


            if (
                hasActiveFilter(
                    type,
                    column
                )
            ) {

                button.classList.add(
                    "filtered"
                );

            }


            button.onclick =
                event => {

                    event.stopPropagation();

                    openFilter(
                        type,
                        column,
                        button
                    );

                };


            cell.appendChild(
                title
            );

            cell.appendChild(
                button
            );


            header.appendChild(
                cell
            );

        }
    );

}


/* =========================================================
   ACTIVE FILTER
========================================================= */

function hasActiveFilter(
    type,
    column
) {

    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    return (
        filters[column] &&
        filters[column].size > 0
    );

}


/* =========================================================
   RENDER VIRTUAL TABLE
========================================================= */

function renderVirtualTable(
    type
) {

    const container =
        document.getElementById(
            type +
            "VirtualContent"
        );


    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    container.innerHTML = "";


    /*
       Nothing found
    */

    if (!data.length) {

        container.style.height =
            "60px";


        const message =
            document.createElement(
                "div"
            );

        message.className =
            "no-data";

        message.textContent =
            "No matching records";


        container.appendChild(
            message
        );

        return;

    }


    /*
       Total virtual height.

       The browser thinks all rows exist,
       but we only create the visible rows.
    */

    container.style.height =
        (
            data.length *
            ROW_HEIGHT
        ) + "px";


    /*
       Grid column sizes
    */

    const gridColumns =
        columns
            .map(
                column =>
                    getColumnWidth(
                        type,
                        column
                    )
            )
            .join(" ");


    /*
       Get scroll position
    */

    const area =
        document.getElementById(
            type + "Area"
        );


    const scrollTop =
        area.scrollTop;


    const visibleHeight =
        area.clientHeight;


    let start =
        Math.floor(
            scrollTop /
            ROW_HEIGHT
        ) -
        BUFFER_ROWS;


    if (start < 0) {
        start = 0;
    }


    let end =
        Math.ceil(
            (
                scrollTop +
                visibleHeight
            ) /
            ROW_HEIGHT
        ) +
        BUFFER_ROWS;


    if (
        end >
        data.length
    ) {

        end =
            data.length;

    }


    /*
       Create only approximately
       100-150 rows around viewport.
    */

    const fragment =
        document.createDocumentFragment();


    for (
        let i = start;
        i < end;
        i++
    ) {

        const row =
            data[i];


        const rowElement =
            document.createElement(
                "div"
            );


        rowElement.className =
            "data-row";


        rowElement.style.top =
            (
                i *
                ROW_HEIGHT
            ) + "px";


        rowElement.style.gridTemplateColumns =
            gridColumns;


        columns.forEach(
            column => {

                const cell =
                    document.createElement(
                        "div"
                    );


                cell.className =
                    "data-cell";


                const value =
                    valueToText(
                        getValue(
                            row,
                            column
                        )
                    );


                cell.textContent =
                    value;


                /*
                   YES / NO colors
                */

                const normalized =
                    value
                        .trim()
                        .toLowerCase();


                if (
                    normalized === "yes" &&
                    isYesNoColumn(
                        column
                    )
                ) {

                    cell.classList.add(
                        "yes-cell"
                    );

                }


                if (
                    normalized === "no" &&
                    isYesNoColumn(
                        column
                    )
                ) {

                    cell.classList.add(
                        "no-cell"
                    );

                }


                rowElement.appendChild(
                    cell
                );

            }
        );


        fragment.appendChild(
            rowElement
        );

    }


    container.appendChild(
        fragment
    );

}


/* =========================================================
   YES / NO COLUMNS
========================================================= */

function isYesNoColumn(
    column
) {

    const name =
        String(column)
            .toLowerCase();


    return (

        name === "thiqa" ||

        name === "basic" ||

        name.includes(
            "included"
        ) ||

        name.includes(
            "coverage"
        ) ||

        name.includes(
            "government funded"
        ) ||

        name.includes(
            "formulary"
        )

    );

}


/* =========================================================
   VIRTUAL SCROLL
========================================================= */

function setupVirtualScroll(
    type
) {

    const area =
        document.getElementById(
            type + "Area"
        );


    let ticking = false;


    area.addEventListener(
        "scroll",
        () => {

            if (ticking) {
                return;
            }


            ticking = true;


            requestAnimationFrame(
                () => {

                    renderVirtualTable(
                        type
                    );

                    ticking = false;

                }
            );

        },
        {
            passive: true
        }
    );

}


/* =========================================================
   COUNT
========================================================= */

function updateCount(
    type
) {

    const count =
        type === "thiqa"
            ? thiqaResults.length
            : haadResults.length;


    const total =
        type === "thiqa"
            ? thiqaData.length
            : haadData.length;


    const element =
        document.getElementById(
            type + "Count"
        );


    element.textContent =
        count.toLocaleString() +
        " / " +
        total.toLocaleString() +
        " records";

}


/* =========================================================
   SWITCH SHEET
========================================================= */

function switchSheet(
    type
) {

    currentSheet =
        type;


    document
        .getElementById(
            "thiqaTab"
        )
        .classList.toggle(
            "active",
            type === "thiqa"
        );


    document
        .getElementById(
            "haadTab"
        )
        .classList.toggle(
            "active",
            type === "haad"
        );


    document
        .getElementById(
            "thiqaSheet"
        )
        .classList.toggle(
            "active",
            type === "thiqa"
        );


    document
        .getElementById(
            "haadSheet"
        )
        .classList.toggle(
            "active",
            type === "haad"
        );


    /*
       Re-render the active table
       after changing its visibility.
    */

    requestAnimationFrame(
        () => {

            renderVirtualTable(
                type
            );

        }
    );

}


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilter(
    type,
    column,
    button
) {

    currentFilterType =
        type;

    currentFilterColumn =
        column;


    const popup =
        document.getElementById(
            "filterPopup"
        );


    const search =
        document.getElementById(
            "filterSearch"
        );


    const values =
        document.getElementById(
            "filterValues"
        );


    const data =
        type === "thiqa"
            ? thiqaData
            : haadData;


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    /*
       Unique values
    */

    const uniqueValues =
        new Set();


    data.forEach(
        row => {

            uniqueValues.add(
                valueToText(
                    getValue(
                        row,
                        column
                    )
                )
            );

        }
    );


    let allValues =
        Array.from(
            uniqueValues
        );


    /*
       Sort alphabetically.
    */

    allValues.sort(
        (a, b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
    );


    /*
       Store values temporarily.
    */

    popup._allValues =
        allValues;


    /*
       Current selection.

       If there is no filter,
       everything is selected.
    */

    const current =
        filters[column];


    popup._selected =
        current
            ? new Set(current)
            : new Set(allValues);


    search.value =
        "";


    renderFilterValues();


    /*
       Position popup
       below filter button.
    */

    popup.classList.add(
        "show"
    );


    const rect =
        button.getBoundingClientRect();


    let left =
        rect.left;


    let top =
        rect.bottom + 5;


    const width =
        300;


    const height =
        390;


    if (
        left + width >
        window.innerWidth
    ) {

        left =
            window.innerWidth -
            width -
            10;

    }


    if (
        left < 10
    ) {

        left = 10;

    }


    if (
        top + height >
        window.innerHeight
    ) {

        top =
            rect.top -
            height -
            5;

    }


    if (
        top < 10
    ) {

        top = 10;

    }


    popup.style.left =
        left + "px";


    popup.style.top =
        top + "px";


    setTimeout(
        () => {

            search.focus();

        },
        0
    );

}


/* =========================================================
   RENDER FILTER VALUES
========================================================= */

function renderFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    const search =
        document.getElementById(
            "filterSearch"
        );


    const container =
        document.getElementById(
            "filterValues"
        );


    const query =
        search.value
            .trim()
            .toLowerCase();


    const values =
        popup._allValues
            .filter(
                value =>
                    value
                        .toLowerCase()
                        .includes(
                            query
                        )
            );


    container.innerHTML = "";


    /*
       Limit displayed values to
       keep filter popup fast.
    */

    const visibleValues =
        values.slice(
            0,
            500
        );


    visibleValues.forEach(
        value => {

            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "filter-option";


            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.checked =
                popup._selected.has(
                    value
                );


            checkbox.addEventListener(
                "change",
                () => {

                    if (
                        checkbox.checked
                    ) {

                        popup._selected.add(
                            value
                        );

                    } else {

                        popup._selected.delete(
                            value
                        );

                    }

                }
            );


            const text =
                document.createElement(
                    "span"
                );


            text.className =
                "filter-value-text";


            text.textContent =
                value === ""
                    ? "(Blank)"
                    : value;


            label.appendChild(
                checkbox
            );


            label.appendChild(
                text
            );


            container.appendChild(
                label
            );

        }
    );


    if (
        values.length > 500
    ) {

        const more =
            document.createElement(
                "div"
            );


        more.style.padding =
            "8px";


        more.style.color =
            "#64748b";


        more.style.fontSize =
            "10px";


        more.textContent =
            "Showing first 500 values. Use the search above to find more.";


        container.appendChild(
            more
        );

    }


    if (
        values.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.style.padding =
            "15px";


        empty.style.textAlign =
            "center";


        empty.style.color =
            "#64748b";


        empty.textContent =
            "No values found";


        container.appendChild(
            empty
        );

    }

}


/* =========================================================
   SELECT ALL FILTER VALUES
========================================================= */

function selectAllFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    const search =
        document.getElementById(
            "filterSearch"
        );


    const query =
        search.value
            .trim()
            .toLowerCase();


    popup._allValues
        .filter(
            value =>
                value
                    .toLowerCase()
                    .includes(
                        query
                    )
        )
        .forEach(
            value => {

                popup._selected.add(
                    value
                );

            }
        );


    renderFilterValues();

}


/* =========================================================
   CLEAR ALL FILTER VALUES
========================================================= */

function clearAllFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    const search =
        document.getElementById(
            "filterSearch"
        );


    const query =
        search.value
            .trim()
            .toLowerCase();


    popup._allValues
        .filter(
            value =>
                value
                    .toLowerCase()
                    .includes(
                        query
                    )
        )
        .forEach(
            value => {

                popup._selected.delete(
                    value
                );

            }
        );


    renderFilterValues();

}


/* =========================================================
   APPLY COLUMN FILTER
========================================================= */

function applyColumnFilter() {

    if (
        !currentFilterType ||
        !currentFilterColumn
    ) {
        return;
    }


    const type =
        currentFilterType;

    const column =
        currentFilterColumn;


    const popup =
        document.getElementById(
            "filterPopup"
        );


    const allValues =
        popup._allValues;


    const selected =
        popup._selected;


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    /*
       If everything is selected,
       remove the filter.
    */

    if (
        selected.size ===
        allValues.length
    ) {

        delete filters[column];

    } else {

        filters[column] =
            new Set(
                selected
            );

    }


    closeFilterPopup();


    renderHeader(type);


    /*
       Re-apply all searches
       and column filters.
    */

    applySearches();

}


/* =========================================================
   CANCEL FILTER
========================================================= */

function cancelColumnFilter() {

    closeFilterPopup();

}


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilterPopup() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    popup.classList.remove(
        "show"
    );


    currentFilterType =
        null;

    currentFilterColumn =
        null;

}


/* =========================================================
   FILTER SEARCH
========================================================= */

document
    .getElementById(
        "filterSearch"
    )
    .addEventListener(
        "input",
        renderFilterValues
    );


/* =========================================================
   SEARCH EVENTS
========================================================= */

[
    "brandSearch",
    "genericSearch",
    "strengthSearch",
    "dosageSearch"
].forEach(
    id => {

        document
            .getElementById(id)
            .addEventListener(
                "input",
                delayedSearch
            );

    }
);


/* =========================================================
   CLOSE FILTER WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    event => {

        const popup =
            document.getElementById(
                "filterPopup"
            );


        if (
            !popup.classList.contains(
                "show"
            )
        ) {
            return;
        }


        if (
            popup.contains(
                event.target
            )
        ) {
            return;
        }


        if (
            event.target.closest(
                ".filter-button"
            )
        ) {
            return;
        }


        closeFilterPopup();

    }
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        renderVirtualTable(
            "thiqa"
        );

        renderVirtualTable(
            "haad"
        );

    }
);


/* =========================================================
   START
========================================================= */

setupVirtualScroll(
    "thiqa"
);

setupVirtualScroll(
    "haad"
);


loadData();

</script>

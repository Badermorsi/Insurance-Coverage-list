<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Insurance Coverage List</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f4f7fb;
    color: #1f2937;

    overflow: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    height: 70px;

    background: white;

    border-bottom:
        1px solid #d7e0ea;

    display: flex;

    align-items: center;

    gap: 18px;

    padding:
        8px 22px;

    position: relative;

    z-index: 1000;
}

.logo {

    height: 52px;

    width: auto;

    object-fit: contain;
}

.header-title {

    font-size: 24px;

    font-weight: 700;

    color: #123c69;
}


/* =========================================================
   TABS
========================================================= */

.tabs {

    height: 52px;

    background: #f4f7fb;

    display: flex;

    align-items: end;

    justify-content: center;

    gap: 6px;

    padding:
        0 15px;
}

.tab-button {

    border: none;

    background: #dfe7f1;

    color: #24415d;

    height: 44px;

    padding:
        0 30px;

    font-size: 15px;

    font-weight: 700;

    border-radius:
        9px 9px 0 0;

    cursor: pointer;

    transition:
        background .15s,
        color .15s;
}

.tab-button:hover {

    background: #ccd9e8;
}

.tab-button.active {

    background: #123c69;

    color: white;
}


/* =========================================================
   MAIN
========================================================= */

.container {

    height:
        calc(100vh - 122px);

    margin:
        0 10px 10px;

    background: white;

    border:
        1px solid #d7e0ea;

    border-radius:
        0 0 9px 9px;

    box-shadow:
        0 2px 10px
        rgba(0,0,0,.06);

    overflow: hidden;

    position: relative;
}

.tab-content {

    display: none;

    width: 100%;

    height: 100%;
}

.tab-content.active {

    display: flex;

    flex-direction: column;
}


/* =========================================================
   SEARCH BAR
========================================================= */

.search-area {

    height: 58px;

    min-height: 58px;

    display: flex;

    align-items: center;

    gap: 9px;

    padding:
        9px 12px;

    background: white;

    border-bottom:
        1px solid #dce4ec;
}

.search-box {

    position: relative;

    flex: 1;

    min-width: 200px;
}

.search-box input {

    width: 100%;

    height: 39px;

    border:
        1px solid #c7d2df;

    border-radius: 6px;

    padding:
        0 40px 0 13px;

    font-size: 14px;

    outline: none;
}

.search-box input:focus {

    border-color: #123c69;

    box-shadow:
        0 0 0 2px
        rgba(18,60,105,.10);
}

.search-icon {

    position: absolute;

    right: 13px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #64748b;
}

.clear-main {

    height: 39px;

    padding:
        0 17px;

    border: none;

    border-radius: 6px;

    background: #e8edf3;

    color: #334155;

    font-weight: 600;

    cursor: pointer;
}

.clear-main:hover {

    background: #d8e1eb;
}

.record-count {

    white-space: nowrap;

    color: #64748b;

    font-size: 13px;

    min-width: 130px;

    text-align: right;
}


/* =========================================================
   EXCEL TABLE AREA
========================================================= */

.excel-area {

    flex: 1;

    min-height: 0;

    overflow: auto;

    position: relative;

    background: white;
}


/*
   This is the virtual table.

   The browser does NOT create thousands
   of <tr> elements.

   It creates only the rows visible
   on screen.
*/

.excel-table {

    border-collapse: separate;

    border-spacing: 0;

    table-layout: fixed;

    min-width: max-content;

    width: max-content;
}


/* =========================================================
   HEADER
========================================================= */

.excel-table thead {

    position: sticky;

    top: 0;

    z-index: 50;
}

.excel-table th {

    background: #123c69;

    color: white;

    border-right:
        1px solid #426489;

    border-bottom:
        1px solid #0c2d50;

    padding: 0;

    min-width: 150px;

    max-width: 400px;

    height: 74px;

    vertical-align: top;

    position: relative;
}

.header-title-cell {

    height: 37px;

    display: flex;

    align-items: center;

    padding:
        0 8px;

    font-size: 12px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   FILTER BUTTON
========================================================= */

.filter-button {

    position: absolute;

    right: 4px;

    top: 7px;

    width: 23px;

    height: 23px;

    border: none;

    border-radius: 4px;

    background:
        rgba(255,255,255,.14);

    color: white;

    cursor: pointer;

    font-size: 12px;

    display: flex;

    align-items: center;

    justify-content: center;
}

.filter-button:hover {

    background:
        rgba(255,255,255,.28);
}

.filter-button.filtered {

    background: #f59e0b;

    color: #111827;
}


/* =========================================================
   FILTER POPUP
========================================================= */

.filter-popup {

    position: fixed;

    z-index: 99999;

    width: 280px;

    max-height: 450px;

    background: white;

    color: #1f2937;

    border:
        1px solid #bfcbd8;

    border-radius: 7px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.20);

    display: none;

    overflow: hidden;
}

.filter-popup.open {

    display: block;
}

.filter-popup-header {

    padding: 9px;

    border-bottom:
        1px solid #e1e7ee;

    background: #f8fafc;
}

.filter-search {

    width: 100%;

    height: 34px;

    border:
        1px solid #cbd5e1;

    border-radius: 5px;

    padding:
        0 9px;

    outline: none;

    font-size: 13px;
}

.filter-search:focus {

    border-color: #123c69;
}


/* =========================================================
   FILTER ACTIONS
========================================================= */

.filter-actions {

    display: flex;

    align-items: center;

    gap: 6px;

    padding: 8px;

    border-bottom:
        1px solid #e1e7ee;
}

.filter-action {

    flex: 1;

    height: 30px;

    border: 1px solid #cbd5e1;

    background: white;

    border-radius: 4px;

    cursor: pointer;

    font-size: 12px;

    font-weight: 600;
}

.filter-action:hover {

    background: #f1f5f9;
}


/* =========================================================
   FILTER VALUES
========================================================= */

.filter-values {

    max-height: 285px;

    overflow-y: auto;

    padding: 5px 0;
}

.filter-value {

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        6px 9px;

    font-size: 12px;

    cursor: pointer;
}

.filter-value:hover {

    background: #edf5ff;
}

.filter-value input {

    width: 15px;

    height: 15px;

    cursor: pointer;
}

.filter-value span {

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================================================
   FILTER FOOTER
========================================================= */

.filter-footer {

    display: flex;

    gap: 7px;

    padding: 8px;

    border-top:
        1px solid #e1e7ee;

    background: #f8fafc;
}

.apply-filter {

    flex: 1;

    height: 33px;

    border: none;

    border-radius: 5px;

    background: #123c69;

    color: white;

    font-weight: 700;

    cursor: pointer;
}

.apply-filter:hover {

    background: #0e3156;
}

.cancel-filter {

    width: 80px;

    height: 33px;

    border:
        1px solid #cbd5e1;

    border-radius: 5px;

    background: white;

    cursor: pointer;
}


/* =========================================================
   TABLE BODY
========================================================= */

.excel-table td {

    height: 32px;

    padding:
        5px 8px;

    border-right:
        1px solid #e2e8f0;

    border-bottom:
        1px solid #e2e8f0;

    background: white;

    font-size: 12px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.excel-table tbody tr:nth-child(even) td {

    background: #fafbfd;
}

.excel-table tbody tr:hover td {

    background: #edf5ff;
}


/* =========================================================
   YES / NO
========================================================= */

.yes-cell {

    background: #dcfce7 !important;

    color: #166534 !important;

    font-weight: 700;

    text-align: center;
}

.no-cell {

    background: #fee2e2 !important;

    color: #991b1b !important;

    font-weight: 700;

    text-align: center;
}


/* =========================================================
   VIRTUAL SPACE
========================================================= */

.virtual-spacer {

    position: relative;

    width: 1px;

    pointer-events: none;
}

.virtual-row-container {

    position: absolute;

    left: 0;

    right: 0;

    top: 0;

    pointer-events: none;
}

.virtual-row {

    position: absolute;

    left: 0;

    display: table-row;

    width: 100%;
}


/* =========================================================
   LOADING
========================================================= */

.loading-screen {

    position: absolute;

    inset: 0;

    background:
        rgba(255,255,255,.92);

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 10px;

    color: #475569;

    font-size: 14px;
}

.spinner {

    width: 28px;

    height: 28px;

    border:
        3px solid #dbe5ef;

    border-top-color:
        #123c69;

    border-radius: 50%;

    animation:
        spin .7s linear infinite;
}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {

    .header {

        height: 58px;

        padding:
            7px 10px;

        gap: 10px;
    }

    .logo {

        height: 40px;
    }

    .header-title {

        font-size: 17px;
    }

    .tabs {

        height: 45px;

        padding: 0 5px;
    }

    .tab-button {

        height: 39px;

        padding:
            0 13px;

        font-size: 12px;
    }

    .container {

        height:
            calc(100vh - 103px);

        margin:
            0 3px 3px;
    }

    .search-area {

        height: 54px;

        min-height: 54px;

        padding: 7px;
    }

    .record-count {

        display: none;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<div class="header">

    <img
        src="logo.png"
        class="logo"
        alt="Al Ain Pharmacy">

    <div class="header-title">
        Insurance Coverage List
    </div>

</div>


<!-- =========================================================
     TABS
========================================================= -->

<div class="tabs">

    <button
        class="tab-button active"
        id="thiqaTabButton"
        onclick="switchTab('thiqa')">

        Thiqa Coverage List

    </button>

    <button
        class="tab-button"
        id="haadTabButton"
        onclick="switchTab('haad')">

        HAAD List

    </button>

</div>


<!-- =========================================================
     MAIN
========================================================= -->

<div class="container">


<!-- =========================================================
     THIQA
========================================================= -->

<div
    id="thiqa"
    class="tab-content active">

    <div class="search-area">

        <div class="search-box">

            <input
                id="thiqaSearch"
                type="text"
                placeholder="Search all Thiqa columns..."
                autocomplete="off">

            <span class="search-icon">
                🔎
            </span>

        </div>

        <button
            class="clear-main"
            onclick="clearMainSearch('thiqa')">

            Clear

        </button>

        <div
            id="thiqaCount"
            class="record-count">

            Loading...

        </div>

    </div>


    <div
        class="excel-area"
        id="thiqaArea">

        <div
            class="loading-screen"
            id="thiqaLoading">

            <div class="spinner"></div>

            Loading Thiqa data...

        </div>

        <table
            class="excel-table"
            id="thiqaTable">

            <thead
                id="thiqaHead">
            </thead>

            <tbody
                id="thiqaBody">
            </tbody>

        </table>

    </div>

</div>


<!-- =========================================================
     HAAD
========================================================= -->

<div
    id="haad"
    class="tab-content">

    <div class="search-area">

        <div class="search-box">

            <input
                id="haadSearch"
                type="text"
                placeholder="Search all HAAD columns..."
                autocomplete="off">

            <span class="search-icon">
                🔎
            </span>

        </div>

        <button
            class="clear-main"
            onclick="clearMainSearch('haad')">

            Clear

        </button>

        <div
            id="haadCount"
            class="record-count">

            Loading...

        </div>

    </div>


    <div
        class="excel-area"
        id="haadArea">

        <div
            class="loading-screen"
            id="haadLoading">

            <div class="spinner"></div>

            Loading HAAD data...

        </div>

        <table
            class="excel-table"
            id="haadTable">

            <thead
                id="haadHead">
            </thead>

            <tbody
                id="haadBody">
            </tbody>

        </table>

    </div>

</div>


</div>


<!-- =========================================================
     FILTER POPUP
========================================================= -->

<div
    id="filterPopup"
    class="filter-popup">

    <div
        class="filter-popup-header">

        <input
            id="filterSearch"
            class="filter-search"
            type="text"
            placeholder="Search values..."
            autocomplete="off">

    </div>


    <div
        class="filter-actions">

        <button
            class="filter-action"
            onclick="selectAllFilterValues()">

            Select All

        </button>

        <button
            class="filter-action"
            onclick="clearAllFilterValues()">

            Clear All

        </button>

    </div>


    <div
        id="filterValues"
        class="filter-values">
    </div>


    <div
        class="filter-footer">

        <button
            class="cancel-filter"
            onclick="closeFilter()">

            Cancel

        </button>

        <button
            class="apply-filter"
            onclick="applyFilter()">

            Apply

        </button>

    </div>

</div>


<script>

/* =========================================================
   FILES
========================================================= */

const THIQA_FILE = "data.json";

const HAAD_FILE = "HAAD LIST.json";


/* =========================================================
   PERFORMANCE SETTINGS
========================================================= */

/*
   Approximate height of one Excel row.

   The browser only creates enough rows
   to fill the visible area.
*/

const ROW_HEIGHT = 32;


/*
   Extra rows above/below the screen.

   This prevents visible blank space while scrolling.
*/

const BUFFER_ROWS = 15;


/* =========================================================
   DATA
========================================================= */

let thiqaData = [];

let haadData = [];


/*
   Current filtered results.
*/

let thiqaResults = [];

let haadResults = [];


/*
   Column names.
*/

let thiqaColumns = [];

let haadColumns = [];


/*
   Active column filters.

   Example:

   filters[0] = Set(["YES"])

*/

let thiqaFilters = new Map();

let haadFilters = new Map();


/*
   Main search.
*/

let thiqaMainSearch = "";

let haadMainSearch = "";


/* =========================================================
   FILTER POPUP STATE
========================================================= */

let activeFilterType = null;

let activeFilterColumn = null;

let activeFilterValues = new Set();

let allFilterValues = [];


/* =========================================================
   HAAD COLUMNS
========================================================= */

const HAAD_COLUMNS = [

    "Drug Code",

    "Insurance Plan",

    "Package Name",

    "Generic Code",

    "Generic Name",

    "Strength",

    "Dosage Form",

    "Package Size",

    "Dispense Mode",

    "Package Price to Public",

    "Package Price to Pharmacy",

    "Unit Price to Public",

    "Unit Price to Pharmacy",

    "Status",

    "Delete Effective Date",

    "Last Change Date",

    "Agent Name",

    "Manufacturer Name",

    "Insurance Coverage For Government Funded Program",

    "UPP Scope",

    "Included in Thiqa/ABM - other than 1&7 - Drug Formulary",

    "Included In Basic Drug Formulary",

    "Included In ABM 1 Drug Formulary",

    "Included In ABM 7 Drug Formulary",

    "Unit Markup",

    "Package Markup",

    "Thiqa Max. Reimbursement Price (Package)",

    "Thiqa co-pay amount (package)",

    "Basic co-pay amount (package)",

    "UPP Effective Date",

    "UPP Updated Date",

    "UPP Expiry Date"

];


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        setupSearch();

        loadData();

    }
);


/* =========================================================
   SEARCH SETUP
========================================================= */

function setupSearch() {

    document
        .getElementById("thiqaSearch")
        .addEventListener(
            "input",
            debounce(
                () => {

                    thiqaMainSearch =
                        document
                            .getElementById(
                                "thiqaSearch"
                            )
                            .value
                            .trim()
                            .toLowerCase();

                    applyAllFilters(
                        "thiqa"
                    );

                },
                150
            )
        );


    document
        .getElementById("haadSearch")
        .addEventListener(
            "input",
            debounce(
                () => {

                    haadMainSearch =
                        document
                            .getElementById(
                                "haadSearch"
                            )
                            .value
                            .trim()
                            .toLowerCase();

                    applyAllFilters(
                        "haad"
                    );

                },
                150
            )
        );


    document
        .getElementById("filterSearch")
        .addEventListener(
            "input",
            renderFilterValues
        );


    /*
       Close popup when clicking outside.
    */

    document.addEventListener(
        "mousedown",
        event => {

            const popup =
                document.getElementById(
                    "filterPopup"
                );


            if (
                !popup.contains(event.target) &&
                !event.target.closest(
                    ".filter-button"
                )
            ) {

                closeFilter();

            }

        }
    );

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {

    /*
       Load both JSON files simultaneously.
    */

    const results =
        await Promise.allSettled([

            fetchJson(
                THIQA_FILE
            ),

            fetchJson(
                HAAD_FILE
            )

        ]);


    /*
       THIQA
    */

    if (
        results[0].status ===
        "fulfilled"
    ) {

        thiqaData =
            normalizeData(
                results[0].value
            );

        thiqaResults =
            thiqaData;

        thiqaColumns =
            getColumns(
                thiqaData
            );

        renderHeader(
            "thiqa"
        );

        renderVirtualTable(
            "thiqa"
        );

        hideLoading(
            "thiqa"
        );

    }
    else {

        showLoadingError(
            "thiqa",
            results[0].reason
        );

    }


    /*
       HAAD
    */

    if (
        results[1].status ===
        "fulfilled"
    ) {

        haadData =
            normalizeData(
                results[1].value
            );

        haadResults =
            haadData;

        haadColumns =
            HAAD_COLUMNS;

        renderHeader(
            "haad"
        );

        renderVirtualTable(
            "haad"
        );

        hideLoading(
            "haad"
        );

    }
    else {

        showLoadingError(
            "haad",
            results[1].reason
        );

    }

}


/* =========================================================
   FETCH
========================================================= */

async function fetchJson(
    file
) {

    const response =
        await fetch(
            encodeURI(file),
            {
                cache: "default"
            }
        );


    if (!response.ok) {

        throw new Error(
            file +
            " could not be loaded."
        );

    }


    return response.json();

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeData(
    json
) {

    if (
        Array.isArray(json)
    ) {

        return json;

    }


    if (
        json &&
        Array.isArray(
            json.data
        )
    ) {

        return json.data;

    }


    if (
        json &&
        Array.isArray(
            json.rows
        )
    ) {

        return json.rows;

    }


    if (
        json &&
        Array.isArray(
            json.records
        )
    ) {

        return json.records;

    }


    return [];

}


/* =========================================================
   GET COLUMNS
========================================================= */

function getColumns(
    data
) {

    if (
        !data.length
    ) {

        return [];

    }


    /*
       Use first record.

       This avoids scanning the entire dataset.
    */

    return Object.keys(
        data[0]
    );

}


/* =========================================================
   GET VALUE
========================================================= */

function getValue(
    row,
    column
) {

    if (
        !row ||
        typeof row !==
        "object"
    ) {

        return "";

    }


    if (
        Object.prototype.hasOwnProperty.call(
            row,
            column
        )
    ) {

        return row[column];

    }


    /*
       Fallback for slightly different
       capitalization / spaces.
    */

    const target =
        column
            .trim()
            .toLowerCase();


    const key =
        Object.keys(row)
            .find(
                key =>
                    key
                        .trim()
                        .toLowerCase() ===
                    target
            );


    if (
        key !== undefined
    ) {

        return row[key];

    }


    return "";

}


/* =========================================================
   TEXT VALUE
========================================================= */

function valueToText(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    if (
        typeof value ===
        "object"
    ) {

        return JSON.stringify(
            value
        );

    }


    return String(value);

}


/* =========================================================
   RENDER HEADER
========================================================= */

function renderHeader(
    type
) {

    const head =
        document.getElementById(
            type + "Head"
        );


    head.innerHTML = "";


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    const row =
        document.createElement(
            "tr"
        );


    columns.forEach(
        (
            column,
            index
        ) => {

            const th =
                document.createElement(
                    "th"
                );


            th.style.width =
                getColumnWidth(
                    column
                );


            /*
               Column title.
            */

            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "header-title-cell";

            title.textContent =
                column;


            th.appendChild(
                title
            );


            /*
               Filter button.
            */

            const filterButton =
                document.createElement(
                    "button"
                );

            filterButton.className =
                "filter-button";


            /*
               Show funnel.
            */

            filterButton.textContent =
                "▼";


            /*
               Active filter.
            */

            const filterMap =
                type === "thiqa"
                    ? thiqaFilters
                    : haadFilters;


            if (
                filterMap.has(
                    index
                )
            ) {

                filterButton.classList.add(
                    "filtered"
                );

            }


            filterButton.onclick =
                event => {

                    event.stopPropagation();

                    openFilter(
                        type,
                        index,
                        th,
                        column
                    );

                };


            th.appendChild(
                filterButton
            );


            row.appendChild(
                th
            );

        }
    );


    head.appendChild(
        row
    );

}


/* =========================================================
   COLUMN WIDTH
========================================================= */

function getColumnWidth(
    column
) {

    const length =
        column.length;


    if (
        length > 55
    ) {

        return "330px";

    }


    if (
        length > 30
    ) {

        return "260px";

    }


    if (
        length > 18
    ) {

        return "210px";

    }


    return "160px";

}


/* =========================================================
   VIRTUAL TABLE
========================================================= */

function renderVirtualTable(
    type
) {

    const area =
        document.getElementById(
            type + "Area"
        );


    const body =
        document.getElementById(
            type + "Body"
        );


    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    /*
       Remove old rows.
    */

    body.innerHTML = "";


    /*
       Create enough virtual height.

       The browser thinks all rows exist,
       but only visible rows are actually
       created.
    */

    const spacer =
        document.createElement(
            "tr"
        );

    spacer.style.height =
        (
            data.length *
            ROW_HEIGHT
        ) + "px";


    const spacerCell =
        document.createElement(
            "td"
        );

    spacerCell.colSpan =
        type === "thiqa"
            ? thiqaColumns.length
            : haadColumns.length;


    spacerCell.style.height =
        (
            data.length *
            ROW_HEIGHT
        ) + "px";


    spacerCell.style.padding =
        "0";


    spacerCell.style.border =
        "none";


    spacer.appendChild(
        spacerCell
    );


    body.appendChild(
        spacer
    );


    /*
       Render visible rows.
    */

    updateVisibleRows(
        type
    );


    /*
       Remove old scroll handler.
    */

    area._virtualHandler &&
        area.removeEventListener(
            "scroll",
            area._virtualHandler
        );


    const handler =
        () => {

            requestAnimationFrame(
                () =>
                    updateVisibleRows(
                        type
                    )
            );

        };


    area._virtualHandler =
        handler;


    area.addEventListener(
        "scroll",
        handler,
        {
            passive: true
        }
    );

}


/* =========================================================
   UPDATE VISIBLE ROWS
========================================================= */

function updateVisibleRows(
    type
) {

    const area =
        document.getElementById(
            type + "Area"
        );


    const body =
        document.getElementById(
            type + "Body"
        );


    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    if (
        !data.length
    ) {

        body.innerHTML =
            "<tr><td colspan='" +
            columns.length +
            "' style='padding:30px;text-align:center;'>No matching records</td></tr>";

        updateCount(
            type
        );

        return;

    }


    /*
       Remove old visible rows,
       keeping the spacer.
    */

    while (
        body.children.length >
        1
    ) {

        body.removeChild(
            body.lastChild
        );

    }


    const scrollTop =
        area.scrollTop;


    const visibleHeight =
        area.clientHeight;


    let start =
        Math.floor(
            scrollTop /
            ROW_HEIGHT
        ) -
        BUFFER_ROWS;


    if (
        start < 0
    ) {

        start = 0;

    }


    let end =
        Math.ceil(
            (
                scrollTop +
                visibleHeight
            ) /
            ROW_HEIGHT
        ) +
        BUFFER_ROWS;


    if (
        end >
        data.length
    ) {

        end =
            data.length;

    }


    const fragment =
        document.createDocumentFragment();


    /*
       Create only visible rows.
    */

    for (
        let i = start;
        i < end;
        i++
    ) {

        const rowData =
            data[i];


        const tr =
            document.createElement(
                "tr"
            );


        tr.style.height =
            ROW_HEIGHT + "px";


        /*
           Push row down according
           to its virtual position.
        */

        tr.style.transform =
            "translateY(" +
            (
                i *
                ROW_HEIGHT
            ) +
            "px)";


        columns.forEach(
            column => {

                const td =
                    document.createElement(
                        "td"
                    );


                let value =
                    getValue(
                        rowData,
                        column
                    );


                value =
                    valueToText(
                        value
                    );


                td.textContent =
                    value;


                /*
                   YES / NO coloring.

                   Only for Thiqa / Basic
                   related columns.
                */

                if (
                    type === "thiqa" &&
                    isYesNoColumn(
                        column
                    )
                ) {

                    const normalized =
                        value
                            .trim()
                            .toUpperCase();


                    if (
                        normalized ===
                        "YES"
                    ) {

                        td.classList.add(
                            "yes-cell"
                        );

                    }
                    else if (
                        normalized ===
                        "NO"
                    ) {

                        td.classList.add(
                            "no-cell"
                        );

                    }

                }


                tr.appendChild(
                    td
                );

            }
        );


        fragment.appendChild(
            tr
        );

    }


    body.appendChild(
        fragment
    );


    updateCount(
        type
    );

}


/* =========================================================
   YES / NO COLUMN DETECTION
========================================================= */

function isYesNoColumn(
    column
) {

    const text =
        column
            .toLowerCase();


    return (

        text.includes(
            "thiqa"
        )

        ||

        text.includes(
            "basic"
        )

    );

}


/* =========================================================
   COUNT
========================================================= */

function updateCount(
    type
) {

    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    document
        .getElementById(
            type + "Count"
        )
        .textContent =
            data.length.toLocaleString() +
            " records";

}


/* =========================================================
   APPLY ALL FILTERS
========================================================= */

function applyAllFilters(
    type
) {

    const source =
        type === "thiqa"
            ? thiqaData
            : haadData;


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    const mainSearch =
        type === "thiqa"
            ? thiqaMainSearch
            : haadMainSearch;


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    /*
       Split main search by %

       Example:

       500%10

       means BOTH terms.
    */

    const searchTerms =
        mainSearch
            ? mainSearch
                .split("%")
                .map(
                    x =>
                        x.trim()
                )
                .filter(Boolean)
            : [];


    /*
       Filter.
    */

    const result =
        source.filter(
            row => {

                /*
                   Column filters.
                */

                for (
                    const [
                        columnIndex,
                        selectedValues
                    ]
                    of filters
                ) {

                    const column =
                        columns[
                            columnIndex
                        ];


                    const value =
                        valueToText(
                            getValue(
                                row,
                                column
                            )
                        );


                    if (
                        !selectedValues.has(
                            value
                        )
                    ) {

                        return false;

                    }

                }


                /*
                   Main search.
                */

                if (
                    searchTerms.length
                ) {

                    const rowText =
                        columns
                            .map(
                                column =>
                                    valueToText(
                                        getValue(
                                            row,
                                            column
                                        )
                                    )
                            )
                            .join(" ")
                            .toLowerCase();


                    for (
                        const term
                        of searchTerms
                    ) {

                        if (
                            !rowText.includes(
                                term
                            )
                        ) {

                            return false;

                        }

                    }

                }


                return true;

            }
        );


    if (
        type === "thiqa"
    ) {

        thiqaResults =
            result;

    }
    else {

        haadResults =
            result;

    }


    renderHeader(
        type
    );


    renderVirtualTable(
        type
    );

}


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilter(
    type,
    columnIndex,
    headerElement,
    column
) {

    activeFilterType =
        type;

    activeFilterColumn =
        columnIndex;


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    /*
       Get values from ORIGINAL
       dataset, not filtered results.

       This is how Excel behaves:
       the filter list shows available
       values for that column.
    */

    const source =
        type === "thiqa"
            ? thiqaData
            : haadData;


    const unique =
        new Set();


    source.forEach(
        row => {

            unique.add(
                valueToText(
                    getValue(
                        row,
                        column
                    )
                )
            );

        }
    );


    allFilterValues =
        Array.from(
            unique
        ).sort(
            (a,b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric: true,
                        sensitivity:
                            "base"
                    }
                )
        );


    /*
       Existing selection.
    */

    if (
        filters.has(
            columnIndex
        )
    ) {

        activeFilterValues =
            new Set(
                filters.get(
                    columnIndex
                )
            );

    }
    else {

        /*
           No filter means ALL selected.
        */

        activeFilterValues =
            new Set(
                allFilterValues
            );

    }


    document
        .getElementById(
            "filterSearch"
        )
        .value = "";


    renderFilterValues();


    /*
       Position popup.
    */

    const popup =
        document.getElementById(
            "filterPopup"
        );


    popup.classList.add(
        "open"
    );


    const rect =
        headerElement.getBoundingClientRect();


    let left =
        rect.left;


    let top =
        rect.bottom + 4;


    /*
       Keep popup inside screen.
    */

    const popupWidth =
        280;


    if (
        left +
        popupWidth >
        window.innerWidth -
        8
    ) {

        left =
            window.innerWidth -
            popupWidth -
            8;

    }


    if (
        left < 8
    ) {

        left = 8;

    }


    popup.style.left =
        left + "px";


    popup.style.top =
        top + "px";

}


/* =========================================================
   RENDER FILTER VALUES
========================================================= */

function renderFilterValues() {

    const container =
        document.getElementById(
            "filterValues"
        );


    container.innerHTML = "";


    const search =
        document
            .getElementById(
                "filterSearch"
            )
            .value
            .trim()
            .toLowerCase();


    const values =
        allFilterValues.filter(
            value =>
                !search ||
                value
                    .toLowerCase()
                    .includes(
                        search
                    )
        );


    const fragment =
        document.createDocumentFragment();


    values.forEach(
        value => {

            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "filter-value";


            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.checked =
                activeFilterValues.has(
                    value
                );


            checkbox.dataset.value =
                value;


            checkbox.addEventListener(
                "change",
                () => {

                    if (
                        checkbox.checked
                    ) {

                        activeFilterValues.add(
                            value
                        );

                    }
                    else {

                        activeFilterValues.delete(
                            value
                        );

                    }

                }
            );


            const text =
                document.createElement(
                    "span"
                );


            text.textContent =
                value === ""
                    ? "(Blank)"
                    : value;


            label.appendChild(
                checkbox
            );

            label.appendChild(
                text
            );


            fragment.appendChild(
                label
            );

        }
    );


    container.appendChild(
        fragment
    );

}


/* =========================================================
   SELECT ALL
========================================================= */

function selectAllFilterValues() {

    /*
       Select ALL values, not only
       currently searched values.
    */

    activeFilterValues =
        new Set(
            allFilterValues
        );


    renderFilterValues();

}


/* =========================================================
   CLEAR ALL
========================================================= */

function clearAllFilterValues() {

    activeFilterValues =
        new Set();


    renderFilterValues();

}


/* =========================================================
   APPLY COLUMN FILTER
========================================================= */

function applyFilter() {

    const filters =
        activeFilterType === "thiqa"
            ? thiqaFilters
            : haadFilters;


    /*
       If everything is selected,
       remove the filter.

       This is equivalent to Excel's
       "Select All".
    */

    if (
        activeFilterValues.size ===
        allFilterValues.length
    ) {

        filters.delete(
            activeFilterColumn
        );

    }
    else {

        filters.set(
            activeFilterColumn,
            new Set(
                activeFilterValues
            )
        );

    }


    const type =
        activeFilterType;


    closeFilter();


    applyAllFilters(
        type
    );

}


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilter() {

    document
        .getElementById(
            "filterPopup"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   MAIN SEARCH CLEAR
========================================================= */

function clearMainSearch(
    type
) {

    document
        .getElementById(
            type + "Search"
        )
        .value = "";


    if (
        type === "thiqa"
    ) {

        thiqaMainSearch =
            "";

    }
    else {

        haadMainSearch =
            "";

    }


    applyAllFilters(
        type
    );

}


/* =========================================================
   TAB SWITCH
========================================================= */

function switchTab(
    type
) {

    document
        .querySelectorAll(
            ".tab-content"
        )
        .forEach(
            tab =>
                tab.classList.remove(
                    "active"
                )
        );


    document
        .querySelectorAll(
            ".tab-button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "active"
                )
        );


    document
        .getElementById(
            type
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            type +
            "TabButton"
        )
        .classList.add(
            "active"
        );


    /*
       Close filter popup
       when switching tabs.
    */

    closeFilter();

}


/* =========================================================
   LOADING
========================================================= */

function hideLoading(
    type
) {

    const loading =
        document.getElementById(
            type + "Loading"
        );


    if (
        loading
    ) {

        loading.style.display =
            "none";

    }

}


function showLoadingError(
    type,
    error
) {

    const loading =
        document.getElementById(
            type + "Loading"
        );


    if (
        loading
    ) {

        loading.innerHTML =
            `<div style="
                color:#b91c1c;
                text-align:center;
                padding:20px;
            ">
                Unable to load data.<br>
                ${escapeHtml(
                    error?.message ||
                    "Unknown error"
                )}
            </div>`;

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   DEBOUNCE
========================================================= */

function debounce(
    fn,
    delay
) {

    let timer;


    return function () {

        clearTimeout(
            timer
        );


        timer =
            setTimeout(
                fn,
                delay
            );

    };

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        closeFilter();

    }
);

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance Coverage List</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;

    font-family: Arial, Helvetica, sans-serif;

    background: #f1f5f9;
    color: #1e293b;
}

.page {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}


/* =========================================================
   TITLE
========================================================= */

.title {
    height: 62px;
    min-height: 62px;

    background: white;

    border-bottom: 1px solid #dbe3ec;

    display: flex;
    align-items: center;

    padding: 0 20px;

    color: #0757a0;

    font-size: 23px;
    font-weight: 700;
}


/* =========================================================
   TABS
========================================================= */

.tabs {
    height: 50px;
    min-height: 50px;

    background: white;

    border-bottom: 1px solid #cbd5e1;

    display: flex;
}

.tab {
    min-width: 190px;

    padding: 0 24px;

    border: none;
    border-right: 1px solid #dbe3ec;

    background: #f8fafc;

    color: #475569;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}

.tab:hover {
    background: #eef5ff;
}

.tab.active {
    background: #0757a0;
    color: white;
}


/* =========================================================
   SEARCH AREA
========================================================= */

.search-area {
    min-height: 116px;

    background: white;

    border-bottom: 1px solid #dbe3ec;

    padding: 10px 14px 9px;

    display: grid;

    grid-template-columns:
        minmax(180px, 1fr)
        minmax(180px, 1fr)
        minmax(180px, 1fr)
        minmax(180px, 1fr);

    grid-template-rows: 1fr 34px;

    gap: 8px 10px;
}

.search-box {
    position: relative;
}

.search-box label {
    display: block;

    margin-bottom: 4px;

    color: #475569;

    font-size: 11px;
    font-weight: 700;
}

.search-box input {
    width: 100%;
    height: 36px;

    padding: 0 12px;

    border: 1px solid #cbd5e1;

    border-radius: 5px;

    outline: none;

    font-size: 13px;

    background: white;
}

.search-box input:focus {
    border-color: #1976d2;

    box-shadow:
        0 0 0 2px rgba(25,118,210,0.10);
}

.search-box input::placeholder {
    color: #94a3b8;
}


/* =========================================================
   CLEAR BUTTON
========================================================= */

.clear-search-container {
    grid-column: 1 / -1;

    display: flex;
    justify-content: center;
    align-items: center;
}

.clear-search-button {
    height: 32px;

    padding: 0 25px;

    border: 1px solid #cbd5e1;

    border-radius: 5px;

    background: #f8fafc;

    color: #334155;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
}

.clear-search-button:hover {
    background: #e2e8f0;
}


/* =========================================================
   SHEETS
========================================================= */

.sheet {
    display: none;

    flex: 1;

    min-height: 0;

    flex-direction: column;
}

.sheet.active {
    display: flex;
}


/* =========================================================
   INFO BAR
========================================================= */

.info-bar {
    height: 34px;
    min-height: 34px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    background: #f8fafc;

    border-bottom: 1px solid #dbe3ec;

    font-size: 11px;

    color: #64748b;
}

.loading {
    color: #0757a0;
    font-weight: 700;
}

.error {
    color: #dc2626;
    font-weight: 700;
}


/* =========================================================
   EXCEL SCROLL AREA
========================================================= */

.excel-area {
    flex: 1;

    min-height: 0;

    position: relative;

    overflow: auto;

    background: white;
}

.excel-content {
    position: relative;

    min-width: max-content;
}


/* =========================================================
   HEADER
========================================================= */

.excel-header {
    position: sticky;

    top: 0;

    z-index: 50;

    display: grid;

    width: max-content;

    min-width: 100%;

    height: 48px;

    background: #0757a0;

    color: white;

    border-bottom: 2px solid #063f75;
}

.header-cell {
    min-width: 0;

    height: 48px;

    padding: 5px 6px;

    display: flex;
    align-items: center;

    border-right: 1px solid rgba(255,255,255,0.25);

    position: relative;
}

.header-title {
    flex: 1;

    min-width: 0;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 11px;

    font-weight: 700;
}


/* =========================================================
   FILTER BUTTON
========================================================= */

.filter-button {
    width: 24px;
    height: 28px;

    flex-shrink: 0;

    margin-left: 3px;

    border: none;

    border-radius: 3px;

    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 12px;
}

.filter-button:hover {
    background: rgba(255,255,255,0.18);
}

.filter-button.filtered {
    background: white;

    color: #0757a0;
}


/* =========================================================
   VIRTUAL TABLE
========================================================= */

.virtual-content {
    position: relative;

    width: max-content;

    min-width: 100%;
}

.data-row {
    position: absolute;

    left: 0;

    display: grid;

    width: max-content;

    min-width: 100%;

    height: 32px;

    background: white;

    border-bottom: 1px solid #e2e8f0;
}

.data-cell {
    height: 32px;

    min-width: 0;

    padding: 7px 6px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    border-right: 1px solid #e2e8f0;

    font-size: 11px;

    background: white;
}

.data-row:hover .data-cell {
    background: #f0f7ff;
}


/* =========================================================
   YES / NO
========================================================= */

.yes-cell {
    background: #dcfce7 !important;

    color: #15803d !important;

    font-weight: 700;
}

.no-cell {
    background: #fee2e2 !important;

    color: #dc2626 !important;

    font-weight: 700;
}


/* =========================================================
   NO DATA
========================================================= */

.no-data {
    width: 100%;

    padding: 50px;

    text-align: center;

    color: #64748b;

    font-size: 13px;
}


/* =========================================================
   FILTER POPUP
========================================================= */

.filter-popup {
    position: fixed;

    z-index: 9999;

    width: 300px;

    max-width: calc(100vw - 20px);

    background: white;

    border: 1px solid #cbd5e1;

    border-radius: 6px;

    box-shadow:
        0 8px 25px rgba(15,23,42,0.18);

    padding: 10px;

    display: none;
}

.filter-popup.show {
    display: block;
}

.filter-search {
    width: 100%;

    height: 34px;

    border: 1px solid #cbd5e1;

    border-radius: 4px;

    padding: 0 9px;

    outline: none;

    font-size: 12px;
}

.filter-search:focus {
    border-color: #1976d2;
}

.filter-actions {
    display: flex;

    gap: 6px;

    margin: 8px 0;
}

.filter-actions button {
    flex: 1;

    height: 30px;

    border: 1px solid #cbd5e1;

    border-radius: 4px;

    background: #f8fafc;

    color: #334155;

    cursor: pointer;

    font-size: 11px;

    font-weight: 600;
}

.filter-actions button:hover {
    background: #e2e8f0;
}

.filter-values {
    max-height: 270px;

    overflow-y: auto;

    border-top: 1px solid #e2e8f0;

    border-bottom: 1px solid #e2e8f0;

    padding: 5px 0;
}

.filter-option {
    min-height: 28px;

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 3px 5px;

    cursor: pointer;

    font-size: 11px;
}

.filter-option:hover {
    background: #f1f5f9;
}

.filter-option input {
    margin: 0;
}

.filter-value-text {
    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.filter-footer {
    display: flex;

    gap: 6px;

    margin-top: 8px;
}

.filter-footer button {
    flex: 1;

    height: 32px;

    border-radius: 4px;

    cursor: pointer;

    font-size: 11px;

    font-weight: 700;
}

.apply-filter {
    border: none;

    background: #0757a0;

    color: white;
}

.cancel-filter {
    border: 1px solid #cbd5e1;

    background: white;

    color: #475569;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    .title {
        height: 55px;
        min-height: 55px;

        font-size: 19px;
    }

    .tabs {
        height: 45px;
        min-height: 45px;
    }

    .tab {
        min-width: 140px;

        padding: 0 12px;

        font-size: 12px;
    }

    .search-area {
        grid-template-columns: 1fr 1fr;
    }

}

@media (max-width: 500px) {

    .search-area {
        grid-template-columns: 1fr;
    }

    .tab {
        flex: 1;

        min-width: 0;
    }

}

</style>
</head>

<body>

<div class="page">


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <div class="title">
        Insurance Coverage List
    </div>


    <!-- =====================================================
         TABS
    ====================================================== -->

    <div class="tabs">

        <button
            class="tab active"
            id="thiqaTab"
            onclick="switchSheet('thiqa')">

            Thiqa Coverage List

        </button>

        <button
            class="tab"
            id="haadTab"
            onclick="switchSheet('haad')">

            HAAD List

        </button>

    </div>


    <!-- =====================================================
         SEARCH AREA
    ====================================================== -->

    <div class="search-area">


        <div class="search-box">

            <label>
                Brand Name
            </label>

            <input
                id="brandSearch"
                type="text"
                placeholder="Example: pana%adol">

        </div>


        <div class="search-box">

            <label>
                Generic Name
            </label>

            <input
                id="genericSearch"
                type="text"
                placeholder="Example: para%acetamol">

        </div>


        <div class="search-box">

            <label>
                Strength
            </label>

            <input
                id="strengthSearch"
                type="text"
                placeholder="Example: 160%5%12.5">

        </div>


        <div class="search-box">

            <label>
                Dosage Form
            </label>

            <input
                id="dosageSearch"
                type="text"
                placeholder="Example: tablet%film">

        </div>


        <!-- CLEAR BUTTON -->

        <div class="clear-search-container">

            <button
                class="clear-search-button"
                onclick="clearAllSearchesAndFilters()">

                Clear Search & Filters

            </button>

        </div>

    </div>


    <!-- =====================================================
         THIQA
    ====================================================== -->

    <div
        class="sheet active"
        id="thiqaSheet">


        <div class="info-bar">

            <span id="thiqaStatus">
                Loading Thiqa Coverage List...
            </span>

            <span id="thiqaCount">
                0 records
            </span>

        </div>


        <div
            class="excel-area"
            id="thiqaArea">


            <div
                class="excel-content"
                id="thiqaContent">


                <div
                    class="excel-header"
                    id="thiqaHeader">
                </div>


                <div
                    class="virtual-content"
                    id="thiqaVirtualContent">
                </div>


            </div>

        </div>

    </div>


    <!-- =====================================================
         HAAD
    ====================================================== -->

    <div
        class="sheet"
        id="haadSheet">


        <div class="info-bar">

            <span id="haadStatus">
                Loading HAAD List...
            </span>

            <span id="haadCount">
                0 records
            </span>

        </div>


        <div
            class="excel-area"
            id="haadArea">


            <div
                class="excel-content"
                id="haadContent">


                <div
                    class="excel-header"
                    id="haadHeader">
                </div>


                <div
                    class="virtual-content"
                    id="haadVirtualContent">
                </div>


            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     FILTER POPUP
========================================================== -->

<div
    class="filter-popup"
    id="filterPopup">


    <input
        class="filter-search"
        id="filterSearch"
        type="text"
        placeholder="Search values...">


    <div class="filter-actions">

        <button
            onclick="selectAllFilterValues()">

            Select All

        </button>


        <button
            onclick="clearAllFilterValues()">

            Clear All

        </button>

    </div>


    <div
        class="filter-values"
        id="filterValues">
    </div>


    <div class="filter-footer">

        <button
            class="cancel-filter"
            onclick="cancelColumnFilter()">

            Cancel

        </button>


        <button
            class="apply-filter"
            onclick="applyColumnFilter()">

            Apply

        </button>

    </div>

</div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const ROW_HEIGHT = 32;

/*
   Approximately 50 rows above/below
   the visible area.
*/

const BUFFER_ROWS = 50;


/* =========================================================
   DATA VARIABLES
========================================================= */

let thiqaData = [];
let haadData = [];

let thiqaResults = [];
let haadResults = [];

let thiqaColumns = [];
let haadColumns = [];

let thiqaFilters = {};
let haadFilters = {};

let currentSheet = "thiqa";

let currentFilterType = null;
let currentFilterColumn = null;

let searchTimer = null;


/* =========================================================
   HAAD COLUMNS
========================================================= */

haadColumns = [

    "Drug Code",
    "Insurance Plan",
    "Package Name",
    "Generic Code",
    "Generic Name",
    "Strength",
    "Dosage Form",
    "Package Size",
    "Dispense Mode",
    "Package Price to Public",
    "Package Price to Pharmacy",
    "Unit Price to Public",
    "Unit Price to Pharmacy",
    "Status",
    "Delete Effective Date",
    "Last Change Date",
    "Agent Name",
    "Manufacturer Name",
    "Insurance Coverage For Government Funded Program",
    "UPP Scope",
    "Included in Thiqa/ABM - other than 1&7 - Drug Formulary",
    "Included In Basic Drug Formulary",
    "Included In ABM 1 Drug Formulary",
    "Included In ABM 7 Drug Formulary",
    "Unit Markup",
    "Package Markup",
    "Thiqa Max. Reimbursement Price (Package)",
    "Thiqa co-pay amount (package)",
    "Basic co-pay amount (package)",
    "UPP Effective Date",
    "UPP Updated Date",
    "UPP Expiry Date"

];


/* =========================================================
   LOAD JSON
========================================================= */

async function loadData() {

    setStatus(
        "thiqa",
        "Loading Thiqa Coverage List..."
    );

    setStatus(
        "haad",
        "Loading HAAD List..."
    );


    try {

        const [
            thiqaResponse,
            haadResponse
        ] = await Promise.all([

            fetch(
                "data.json?v=" + Date.now(),
                {
                    cache: "no-store"
                }
            ),

            fetch(
                "HAAD_LIST.json?v=" + Date.now(),
                {
                    cache: "no-store"
                }
            )

        ]);


        if (!thiqaResponse.ok) {

            throw new Error(
                "Could not load data.json"
            );

        }


        if (!haadResponse.ok) {

            throw new Error(
                "Could not load HAAD_LIST.json"
            );

        }


        const thiqaJson =
            await thiqaResponse.json();

        const haadJson =
            await haadResponse.json();


        thiqaData =
            Array.isArray(thiqaJson)
                ? thiqaJson
                : [];


        haadData =
            Array.isArray(haadJson)
                ? haadJson
                : [];


        /*
           Thiqa columns are taken
           directly from JSON.
        */

        if (thiqaData.length > 0) {

            thiqaColumns =
                Object.keys(
                    thiqaData[0]
                );

        }


        /*
           Reset filters.
        */

        thiqaFilters = {};
        haadFilters = {};


        /*
           Initial results.
        */

        thiqaResults =
            thiqaData.slice();

        haadResults =
            haadData.slice();


        renderHeader("thiqa");
        renderHeader("haad");


        renderVirtualTable("thiqa");
        renderVirtualTable("haad");


        setStatus(
            "thiqa",
            "Loaded successfully"
        );

        setStatus(
            "haad",
            "Loaded successfully"
        );


        updateCount("thiqa");
        updateCount("haad");


    } catch (error) {

        console.error(error);


        setStatus(
            "thiqa",
            "Error: " + error.message,
            true
        );


        setStatus(
            "haad",
            "Error: " + error.message,
            true
        );

    }

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    type,
    text,
    isError = false
) {

    const element =
        document.getElementById(
            type + "Status"
        );


    element.textContent =
        text;


    element.className =
        isError
            ? "error"
            : "";

}


/* =========================================================
   COLUMN WIDTH
========================================================= */

function getColumnWidth(
    type,
    column
) {

    const name =
        String(column)
            .toLowerCase();


    if (
        name.includes("brand") ||
        name.includes("proactive name") ||
        name.includes("package name")
    ) {
        return "300px";
    }


    if (
        name.includes("generic name")
    ) {
        return "260px";
    }


    if (
        name.includes("manufacturer")
    ) {
        return "220px";
    }


    if (
        name.includes("insurance coverage")
    ) {
        return "300px";
    }


    if (
        name.includes("formulary")
    ) {
        return "300px";
    }


    if (
        name.includes("strength")
    ) {
        return "130px";
    }


    if (
        name.includes("dosage")
    ) {
        return "150px";
    }


    if (
        name.includes("date")
    ) {
        return "140px";
    }


    if (
        name.includes("price") ||
        name.includes("markup") ||
        name.includes("co-pay")
    ) {
        return "150px";
    }


    return "150px";

}


/* =========================================================
   GET VALUE
========================================================= */

function getValue(
    row,
    column
) {

    if (
        row === null ||
        row === undefined
    ) {
        return "";
    }


    if (
        Object.prototype.hasOwnProperty.call(
            row,
            column
        )
    ) {

        return row[column];

    }


    const wanted =
        String(column)
            .trim()
            .toLowerCase();


    const key =
        Object.keys(row).find(
            k =>
                String(k)
                    .trim()
                    .toLowerCase()
                === wanted
        );


    if (key !== undefined) {

        return row[key];

    }


    return "";

}


/* =========================================================
   VALUE TO TEXT
========================================================= */

function valueToText(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }


    if (
        typeof value === "object"
    ) {

        try {

            return JSON.stringify(value);

        } catch {

            return String(value);

        }

    }


    return String(value);

}


/* =========================================================
   FIND COLUMN
========================================================= */

function findColumn(
    columns,
    possibleNames
) {

    for (
        const possible
        of possibleNames
    ) {

        const exact =
            columns.find(
                column =>
                    String(column)
                        .trim()
                        .toLowerCase()
                    ===
                    possible
                        .trim()
                        .toLowerCase()
            );


        if (exact) {

            return exact;

        }

    }


    for (
        const possible
        of possibleNames
    ) {

        const partial =
            columns.find(
                column =>
                    String(column)
                        .toLowerCase()
                        .includes(
                            possible
                                .toLowerCase()
                        )
            );


        if (partial) {

            return partial;

        }

    }


    return null;

}


/* =========================================================
   SEARCH COLUMNS
========================================================= */

function getSearchColumns(
    type
) {

    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    return {

        brand:
            findColumn(
                columns,
                [
                    "Brand Name",
                    "Brand",
                    "proactive name",
                    "Product Name",
                    "Package Name"
                ]
            ),

        generic:
            findColumn(
                columns,
                [
                    "Generic Name"
                ]
            ),

        strength:
            findColumn(
                columns,
                [
                    "Strength"
                ]
            ),

        dosage:
            findColumn(
                columns,
                [
                    "Dosage Form"
                ]
            )

    };

}


/* =========================================================
   % = AND SEARCH
========================================================= */

/*
   Example:

   160%5%12.5

   becomes:

   160
   AND 5
   AND 12.5

   The order does NOT matter.

   All terms must exist inside
   the SAME cell/value.
*/

function matchesAndSearch(
    value,
    search
) {

    if (
        !search ||
        !search.trim()
    ) {

        return true;

    }


    const text =
        valueToText(value)
            .toLowerCase();


    const terms =
        search
            .toLowerCase()
            .split("%")
            .map(
                term =>
                    term.trim()
            )
            .filter(
                term =>
                    term.length > 0
            );


    /*
       EVERY term must exist.
    */

    return terms.every(
        term =>
            text.includes(term)
    );

}


/* =========================================================
   GET SEARCH VALUES
========================================================= */

function getSearchValues() {

    return {

        brand:
            document
                .getElementById(
                    "brandSearch"
                )
                .value
                .trim(),

        generic:
            document
                .getElementById(
                    "genericSearch"
                )
                .value
                .trim(),

        strength:
            document
                .getElementById(
                    "strengthSearch"
                )
                .value
                .trim(),

        dosage:
            document
                .getElementById(
                    "dosageSearch"
                )
                .value
                .trim()

    };

}


/* =========================================================
   APPLY SEARCHES
========================================================= */

function applySearches() {

    const searches =
        getSearchValues();


    filterData(
        "thiqa",
        searches
    );


    filterData(
        "haad",
        searches
    );

}


/* =========================================================
   FILTER DATA
========================================================= */

function filterData(
    type,
    searches
) {

    const source =
        type === "thiqa"
            ? thiqaData
            : haadData;


    const columns =
        getSearchColumns(type);


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    const results =
        source.filter(
            row => {


                /*
                   BRAND
                */

                if (
                    searches.brand &&
                    columns.brand
                ) {

                    if (
                        !matchesAndSearch(
                            getValue(
                                row,
                                columns.brand
                            ),
                            searches.brand
                        )
                    ) {

                        return false;

                    }

                }


                /*
                   GENERIC
                */

                if (
                    searches.generic &&
                    columns.generic
                ) {

                    if (
                        !matchesAndSearch(
                            getValue(
                                row,
                                columns.generic
                            ),
                            searches.generic
                        )
                    ) {

                        return false;

                    }

                }


                /*
                   STRENGTH
                */

                if (
                    searches.strength &&
                    columns.strength
                ) {

                    if (
                        !matchesAndSearch(
                            getValue(
                                row,
                                columns.strength
                            ),
                            searches.strength
                        )
                    ) {

                        return false;

                    }

                }


                /*
                   DOSAGE FORM
                */

                if (
                    searches.dosage &&
                    columns.dosage
                ) {

                    if (
                        !matchesAndSearch(
                            getValue(
                                row,
                                columns.dosage
                            ),
                            searches.dosage
                        )
                    ) {

                        return false;

                    }

                }


                /*
                   COLUMN FILTERS
                */

                for (
                    const column
                    of Object.keys(filters)
                ) {

                    const selected =
                        filters[column];


                    /*
                       IMPORTANT:

                       If a filter exists and
                       selected.size === 0,

                       that means:
                       user selected NOTHING.

                       Therefore NO rows should
                       pass this filter.
                    */

                    if (
                        selected &&
                        selected.size === 0
                    ) {

                        return false;

                    }


                    if (
                        !selected
                    ) {

                        continue;

                    }


                    const value =
                        valueToText(
                            getValue(
                                row,
                                column
                            )
                        );


                    if (
                        !selected.has(
                            value
                        )
                    ) {

                        return false;

                    }

                }


                return true;

            }
        );


    if (
        type === "thiqa"
    ) {

        thiqaResults =
            results;

    } else {

        haadResults =
            results;

    }


    renderVirtualTable(type);

    updateCount(type);

}


/* =========================================================
   DEBOUNCED SEARCH
========================================================= */

function delayedSearch() {

    clearTimeout(
        searchTimer
    );


    searchTimer =
        setTimeout(
            () => {

                applySearches();

            },
            120
        );

}


/* =========================================================
   RENDER HEADER
========================================================= */

function renderHeader(type) {

    const header =
        document.getElementById(
            type + "Header"
        );


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    header.innerHTML = "";


    if (
        !columns.length
    ) {

        return;

    }


    const gridColumns =
        columns
            .map(
                column =>
                    getColumnWidth(
                        type,
                        column
                    )
            )
            .join(" ");


    header.style.gridTemplateColumns =
        gridColumns;


    columns.forEach(
        column => {


            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "header-cell";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "header-title";


            title.textContent =
                column;


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "filter-button";


            button.innerHTML =
                "▼";


            button.title =
                "Filter " + column;


            if (
                hasActiveFilter(
                    type,
                    column
                )
            ) {

                button.classList.add(
                    "filtered"
                );

            }


            button.onclick =
                event => {

                    event.stopPropagation();


                    openFilter(
                        type,
                        column,
                        button
                    );

                };


            cell.appendChild(
                title
            );


            cell.appendChild(
                button
            );


            header.appendChild(
                cell
            );

        }
    );

}


/* =========================================================
   ACTIVE FILTER
========================================================= */

function hasActiveFilter(
    type,
    column
) {

    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    /*
       Even an empty Set is an
       active filter.

       This is important because
       Clear All + Apply means
       ZERO matching rows.
    */

    return Object.prototype
        .hasOwnProperty.call(
            filters,
            column
        );

}


/* =========================================================
   RENDER VIRTUAL TABLE
========================================================= */

function renderVirtualTable(
    type
) {

    const container =
        document.getElementById(
            type +
            "VirtualContent"
        );


    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    container.innerHTML = "";


    if (
        !data.length
    ) {

        container.style.height =
            "60px";


        const message =
            document.createElement(
                "div"
            );


        message.className =
            "no-data";


        message.textContent =
            "No matching records";


        container.appendChild(
            message
        );


        return;

    }


    /*
       Full virtual height.
    */

    container.style.height =
        (
            data.length *
            ROW_HEIGHT
        ) + "px";


    const gridColumns =
        columns
            .map(
                column =>
                    getColumnWidth(
                        type,
                        column
                    )
            )
            .join(" ");


    const area =
        document.getElementById(
            type + "Area"
        );


    const scrollTop =
        area.scrollTop;


    const visibleHeight =
        area.clientHeight;


    let start =
        Math.floor(
            scrollTop /
            ROW_HEIGHT
        ) -
        BUFFER_ROWS;


    if (
        start < 0
    ) {

        start = 0;

    }


    let end =
        Math.ceil(
            (
                scrollTop +
                visibleHeight
            ) /
            ROW_HEIGHT
        ) +
        BUFFER_ROWS;


    if (
        end >
        data.length
    ) {

        end =
            data.length;

    }


    const fragment =
        document.createDocumentFragment();


    for (
        let i = start;
        i < end;
        i++
    ) {

        const rowData =
            data[i];


        const rowElement =
            document.createElement(
                "div"
            );


        rowElement.className =
            "data-row";


        rowElement.style.top =
            (
                i *
                ROW_HEIGHT
            ) + "px";


        rowElement.style.gridTemplateColumns =
            gridColumns;


        columns.forEach(
            column => {


                const cell =
                    document.createElement(
                        "div"
                    );


                cell.className =
                    "data-cell";


                const value =
                    valueToText(
                        getValue(
                            rowData,
                            column
                        )
                    );


                cell.textContent =
                    value;


                const normalized =
                    value
                        .trim()
                        .toLowerCase();


                if (
                    normalized === "yes" &&
                    isYesNoColumn(
                        column
                    )
                ) {

                    cell.classList.add(
                        "yes-cell"
                    );

                }


                if (
                    normalized === "no" &&
                    isYesNoColumn(
                        column
                    )
                ) {

                    cell.classList.add(
                        "no-cell"
                    );

                }


                rowElement.appendChild(
                    cell
                );

            }
        );


        fragment.appendChild(
            rowElement
        );

    }


    container.appendChild(
        fragment
    );

}


/* =========================================================
   YES / NO
========================================================= */

function isYesNoColumn(
    column
) {

    const name =
        String(column)
            .toLowerCase();


    return (

        name === "thiqa" ||

        name === "basic" ||

        name.includes(
            "included"
        ) ||

        name.includes(
            "coverage"
        ) ||

        name.includes(
            "government funded"
        ) ||

        name.includes(
            "formulary"
        )

    );

}


/* =========================================================
   VIRTUAL SCROLL
========================================================= */

function setupVirtualScroll(
    type
) {

    const area =
        document.getElementById(
            type + "Area"
        );


    let ticking = false;


    area.addEventListener(
        "scroll",
        () => {


            if (
                ticking
            ) {

                return;

            }


            ticking = true;


            requestAnimationFrame(
                () => {


                    renderVirtualTable(
                        type
                    );


                    ticking = false;

                }
            );

        },
        {
            passive: true
        }
    );

}


/* =========================================================
   COUNT
========================================================= */

function updateCount(
    type
) {

    const count =
        type === "thiqa"
            ? thiqaResults.length
            : haadResults.length;


    const total =
        type === "thiqa"
            ? thiqaData.length
            : haadData.length;


    const element =
        document.getElementById(
            type + "Count"
        );


    element.textContent =
        count.toLocaleString() +
        " / " +
        total.toLocaleString() +
        " records";

}


/* =========================================================
   SWITCH SHEET
========================================================= */

function switchSheet(
    type
) {

    currentSheet =
        type;


    document
        .getElementById(
            "thiqaTab"
        )
        .classList.toggle(
            "active",
            type === "thiqa"
        );


    document
        .getElementById(
            "haadTab"
        )
        .classList.toggle(
            "active",
            type === "haad"
        );


    document
        .getElementById(
            "thiqaSheet"
        )
        .classList.toggle(
            "active",
            type === "thiqa"
        );


    document
        .getElementById(
            "haadSheet"
        )
        .classList.toggle(
            "active",
            type === "haad"
        );


    requestAnimationFrame(
        () => {

            renderVirtualTable(
                type
            );

        }
    );

}


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilter(
    type,
    column,
    button
) {

    currentFilterType =
        type;

    currentFilterColumn =
        column;


    const popup =
        document.getElementById(
            "filterPopup"
        );


    const search =
        document.getElementById(
            "filterSearch"
        );


    const data =
        type === "thiqa"
            ? thiqaData
            : haadData;


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    const uniqueValues =
        new Set();


    data.forEach(
        row => {

            uniqueValues.add(
                valueToText(
                    getValue(
                        row,
                        column
                    )
                )
            );

        }
    );


    let allValues =
        Array.from(
            uniqueValues
        );


    allValues.sort(
        (a, b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
    );


    popup._allValues =
        allValues;


    /*
       Existing filter.

       If no filter exists:
       all values selected.

       If filter exists:
       use exactly its selections.
    */

    if (
        Object.prototype
            .hasOwnProperty.call(
                filters,
                column
            )
    ) {

        popup._selected =
            new Set(
                filters[column]
            );

    } else {

        popup._selected =
            new Set(
                allValues
            );

    }


    search.value =
        "";


    renderFilterValues();


    popup.classList.add(
        "show"
    );


    const rect =
        button.getBoundingClientRect();


    let left =
        rect.left;


    let top =
        rect.bottom + 5;


    const width =
        300;


    const height =
        390;


    if (
        left + width >
        window.innerWidth
    ) {

        left =
            window.innerWidth -
            width -
            10;

    }


    if (
        left < 10
    ) {

        left = 10;

    }


    if (
        top + height >
        window.innerHeight
    ) {

        top =
            rect.top -
            height -
            5;

    }


    if (
        top < 10
    ) {

        top = 10;

    }


    popup.style.left =
        left + "px";


    popup.style.top =
        top + "px";


    setTimeout(
        () => {

            search.focus();

        },
        0
    );

}


/* =========================================================
   FILTER VALUES
========================================================= */

function renderFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    const search =
        document.getElementById(
            "filterSearch"
        );


    const container =
        document.getElementById(
            "filterValues"
        );


    const query =
        search.value
            .trim()
            .toLowerCase();


    const values =
        popup._allValues
            .filter(
                value =>
                    value
                        .toLowerCase()
                        .includes(
                            query
                        )
            );


    container.innerHTML =
        "";


    const visibleValues =
        values.slice(
            0,
            500
        );


    visibleValues.forEach(
        value => {


            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "filter-option";


            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.checked =
                popup._selected.has(
                    value
                );


            checkbox.addEventListener(
                "change",
                () => {


                    if (
                        checkbox.checked
                    ) {

                        popup._selected.add(
                            value
                        );

                    } else {

                        popup._selected.delete(
                            value
                        );

                    }

                }
            );


            const text =
                document.createElement(
                    "span"
                );


            text.className =
                "filter-value-text";


            text.textContent =
                value === ""
                    ? "(Blank)"
                    : value;


            label.appendChild(
                checkbox
            );


            label.appendChild(
                text
            );


            container.appendChild(
                label
            );

        }
    );


    if (
        values.length > 500
    ) {

        const more =
            document.createElement(
                "div"
            );


        more.style.padding =
            "8px";


        more.style.color =
            "#64748b";


        more.style.fontSize =
            "10px";


        more.textContent =
            "Showing first 500 values. Search above to find more.";


        container.appendChild(
            more
        );

    }


    if (
        values.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.style.padding =
            "15px";


        empty.style.textAlign =
            "center";


        empty.style.color =
            "#64748b";


        empty.textContent =
            "No values found";


        container.appendChild(
            empty
        );

    }

}


/* =========================================================
   SELECT ALL
========================================================= */

function selectAllFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    const search =
        document.getElementById(
            "filterSearch"
        );


    const query =
        search.value
            .trim()
            .toLowerCase();


    popup._allValues
        .filter(
            value =>
                value
                    .toLowerCase()
                    .includes(
                        query
                    )
        )
        .forEach(
            value => {

                popup._selected.add(
                    value
                );

            }
        );


    renderFilterValues();

}


/* =========================================================
   CLEAR ALL VALUES INSIDE FILTER
========================================================= */

function clearAllFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    const search =
        document.getElementById(
            "filterSearch"
        );


    const query =
        search.value
            .trim()
            .toLowerCase();


    popup._allValues
        .filter(
            value =>
                value
                    .toLowerCase()
                    .includes(
                        query
                    )
        )
        .forEach(
            value => {

                popup._selected.delete(
                    value
                );

            }
        );


    renderFilterValues();

}


/* =========================================================
   APPLY COLUMN FILTER
========================================================= */

function applyColumnFilter() {

    if (
        !currentFilterType ||
        !currentFilterColumn
    ) {

        return;

    }


    const type =
        currentFilterType;


    const column =
        currentFilterColumn;


    const popup =
        document.getElementById(
            "filterPopup"
        );


    const allValues =
        popup._allValues;


    const selected =
        popup._selected;


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    /*
       IMPORTANT:

       If selected contains ALL values,
       there is no need to store a filter.

       If selected contains LESS than ALL,
       store it.

       If selected contains ZERO values,
       store an EMPTY SET.

       EMPTY SET means:
       "show nothing".
    */

    if (
        selected.size ===
        allValues.length
    ) {

        delete filters[column];

    } else {

        filters[column] =
            new Set(selected);

    }


    closeFilterPopup();


    /*
       Update filter icon.
    */

    renderHeader(type);


    /*
       Re-run searches AND filters.
    */

    applySearches();

}


/* =========================================================
   CANCEL
========================================================= */

function cancelColumnFilter() {

    closeFilterPopup();

}


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilterPopup() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    popup.classList.remove(
        "show"
    );


    currentFilterType =
        null;


    currentFilterColumn =
        null;

}


/* =========================================================
   CLEAR EVERYTHING
========================================================= */

function clearAllSearchesAndFilters() {

    /*
       Close popup if open.
    */

    closeFilterPopup();


    /*
       Clear the 4 search boxes.
    */

    document
        .getElementById(
            "brandSearch"
        )
        .value = "";


    document
        .getElementById(
            "genericSearch"
        )
        .value = "";


    document
        .getElementById(
            "strengthSearch"
        )
        .value = "";


    document
        .getElementById(
            "dosageSearch"
        )
        .value = "";


    /*
       Remove ALL column filters.
    */

    thiqaFilters = {};

    haadFilters = {};


    /*
       Restore original data.
    */

    thiqaResults =
        thiqaData.slice();


    haadResults =
        haadData.slice();


    /*
       Reset headers so the
       filter buttons are normal.
    */

    renderHeader("thiqa");

    renderHeader("haad");


    /*
       Render all data again.
    */

    renderVirtualTable(
        "thiqa"
    );


    renderVirtualTable(
        "haad"
    );


    /*
       Reset scroll position.
    */

    document
        .getElementById(
            "thiqaArea"
        )
        .scrollTop = 0;


    document
        .getElementById(
            "thiqaArea"
        )
        .scrollLeft = 0;


    document
        .getElementById(
            "haadArea"
        )
        .scrollTop = 0;


    document
        .getElementById(
            "haadArea"
        )
        .scrollLeft = 0;


    updateCount("thiqa");

    updateCount("haad");

}


/* =========================================================
   FILTER SEARCH
========================================================= */

document
    .getElementById(
        "filterSearch"
    )
    .addEventListener(
        "input",
        renderFilterValues
    );


/* =========================================================
   MAIN SEARCH EVENTS
========================================================= */

[
    "brandSearch",
    "genericSearch",
    "strengthSearch",
    "dosageSearch"

].forEach(
    id => {

        document
            .getElementById(id)
            .addEventListener(
                "input",
                delayedSearch
            );

    }
);


/* =========================================================
   CLICK OUTSIDE FILTER
========================================================= */

document.addEventListener(
    "click",
    event => {


        const popup =
            document.getElementById(
                "filterPopup"
            );


        if (
            !popup.classList.contains(
                "show"
            )
        ) {

            return;

        }


        if (
            popup.contains(
                event.target
            )
        ) {

            return;

        }


        if (
            event.target.closest(
                ".filter-button"
            )
        ) {

            return;

        }


        closeFilterPopup();

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        renderVirtualTable(
            "thiqa"
        );


        renderVirtualTable(
            "haad"
        );

    }
);


/* =========================================================
   START
========================================================= */

setupVirtualScroll(
    "thiqa"
);


setupVirtualScroll(
    "haad"
);


loadData();

</script>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Insurance Coverage List</title>

<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #222;
}

body {
    overflow: hidden;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}


/* =====================================================
   TITLE
===================================================== */

.title {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    padding: 12px 10px 8px;
    background: white;
    border-bottom: 1px solid #ddd;
}


/* =====================================================
   TABS
===================================================== */

.tabs {
    display: flex;
    gap: 5px;
    padding: 8px 10px 0;
    background: white;
}

.tab {
    border: 1px solid #ccc;
    border-bottom: none;
    background: #e9ecef;
    padding: 10px 25px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    border-radius: 7px 7px 0 0;
}

.tab.active {
    background: #ffffff;
    color: #007bff;
    border-top: 3px solid #007bff;
}


/* =====================================================
   SEARCH AREA
===================================================== */

.search-panel {
    background: white;
    padding: 10px;
    border-bottom: 1px solid #ccc;
}

.search-grid {
    display: grid;
    grid-template-columns:
        minmax(180px, 1fr)
        minmax(180px, 1fr)
        minmax(180px, 1fr)
        minmax(180px, 1fr)
        auto;

    gap: 8px;
    align-items: center;
}

.search-box {
    position: relative;
}

.search-box input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

.search-box input:focus {
    border-color: #007bff;
    box-shadow: 0 0 0 2px rgba(0,123,255,.12);
}

.clear-btn {
    height: 40px;
    padding: 0 16px;
    border: none;
    border-radius: 6px;
    background: #dc3545;
    color: white;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
}

.clear-btn:hover {
    background: #c82333;
}


/* =====================================================
   SHEET
===================================================== */

.sheet {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
}

.sheet.active {
    display: flex;
}


/* =====================================================
   COUNT
===================================================== */

.count-bar {
    background: #f8f9fa;
    padding: 6px 10px;
    border-bottom: 1px solid #ddd;
    font-size: 13px;
    color: #555;
}


/* =====================================================
   EXCEL AREA
===================================================== */

.excel-area {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: white;
}


/* =====================================================
   GRID TABLE
===================================================== */

.excel-header,
.data-row {

    display: grid;

    width: max-content;

    min-width: 100%;

    position: relative;
}


/* =====================================================
   HEADER
===================================================== */

.excel-header {

    position: sticky;
    top: 0;

    z-index: 20;

    background: #f1f3f5;

    border-bottom: 2px solid #999;
}


/* =====================================================
   HEADER CELL
===================================================== */

.header-cell {

    position: relative;

    height: 44px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 4px 6px;

    border-right: 1px solid #ccc;

    border-bottom: 1px solid #ccc;

    background: #f1f3f5;

    font-size: 12px;

    font-weight: bold;

    white-space: normal;

    overflow: hidden;

    text-align: left;
}

.header-title {
    flex: 1;
    overflow: hidden;
}


/* =====================================================
   FILTER BUTTON
===================================================== */

.filter-btn {

    flex-shrink: 0;

    width: 25px;

    height: 25px;

    margin-left: 4px;

    border: 1px solid #aaa;

    border-radius: 4px;

    background: white;

    cursor: pointer;

    font-size: 12px;

    display: flex;

    align-items: center;

    justify-content: center;
}

.filter-btn:hover {
    background: #e2e6ea;
}

.filter-btn.active {
    background: #007bff;
    color: white;
    border-color: #007bff;
}


/* =====================================================
   DATA ROW
===================================================== */

.data-row {

    position: absolute;

    left: 0;

    height: 32px;

    min-height: 32px;

    border-bottom: 1px solid #e5e5e5;

    background: white;
}

.data-row:hover {
    background: #f5f9ff;
}


/* =====================================================
   DATA CELL
===================================================== */

.data-cell {

    height: 32px;

    padding: 6px 7px;

    border-right: 1px solid #eee;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 12px;

    display: flex;

    align-items: center;
}


/* =====================================================
   YES / NO
===================================================== */

.yes-value {
    color: #008000;
    font-weight: bold;
}

.no-value {
    color: #d00000;
    font-weight: bold;
}


/* =====================================================
   VIRTUAL CONTENT
===================================================== */

.virtual-content {
    position: relative;
    width: max-content;
    min-width: 100%;
}


/* =====================================================
   FILTER POPUP
===================================================== */

.filter-popup {

    position: fixed;

    z-index: 9999;

    width: 300px;

    max-height: 450px;

    background: white;

    border: 1px solid #aaa;

    border-radius: 7px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.25);

    display: none;

    overflow: hidden;
}

.filter-popup-header {
    padding: 9px;
    background: #f1f3f5;
    border-bottom: 1px solid #ddd;
    font-weight: bold;
    font-size: 13px;
}

.filter-search {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}

.filter-search input {
    width: 100%;
    height: 34px;
    padding: 5px 8px;
    border: 1px solid #bbb;
    border-radius: 5px;
    outline: none;
}

.filter-actions {
    display: flex;
    gap: 5px;
    padding: 7px 8px;
    border-bottom: 1px solid #ddd;
}

.filter-actions button {
    flex: 1;
    height: 30px;
    border: 1px solid #aaa;
    background: #f8f9fa;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
}

.filter-actions button:hover {
    background: #e9ecef;
}

.filter-values {

    max-height: 280px;

    overflow-y: auto;

    padding: 5px 8px;
}

.filter-value {

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 5px 2px;

    font-size: 13px;

    cursor: pointer;
}

.filter-value:hover {
    background: #f5f5f5;
}

.filter-value input {
    cursor: pointer;
}

.filter-footer {

    display: flex;

    gap: 7px;

    padding: 8px;

    border-top: 1px solid #ddd;

    background: #f8f9fa;
}

.filter-footer button {

    flex: 1;

    height: 34px;

    border-radius: 5px;

    cursor: pointer;

    font-weight: bold;
}

.apply-filter {
    background: #007bff;
    color: white;
    border: none;
}

.apply-filter:hover {
    background: #0069d9;
}

.cancel-filter {
    background: white;
    border: 1px solid #aaa;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 900px) {

    .search-grid {
        grid-template-columns: 1fr 1fr;
    }

    .clear-btn {
        width: 100%;
    }
}

@media (max-width: 600px) {

    .search-grid {
        grid-template-columns: 1fr;
    }

    .title {
        font-size: 20px;
    }

    .tab {
        padding: 8px 12px;
        font-size: 13px;
    }
}

</style>

</head>


<body>

<div class="container">


    <!-- =================================================
         TITLE
    ================================================== -->

    <div class="title">
        Insurance Coverage List
    </div>


    <!-- =================================================
         TABS
    ================================================== -->

    <div class="tabs">

        <button
            id="thiqaTab"
            class="tab active"
            onclick="switchSheet('thiqa')">

            Thiqa Coverage List

        </button>

        <button
            id="haadTab"
            class="tab"
            onclick="switchSheet('haad')">

            HAAD List

        </button>

    </div>


    <!-- =================================================
         SEARCH
    ================================================== -->

    <div class="search-panel">

        <div class="search-grid">

            <div class="search-box">

                <input
                    id="brandSearch"
                    type="text"
                    placeholder="Search by Brand Name">

            </div>


            <div class="search-box">

                <input
                    id="genericSearch"
                    type="text"
                    placeholder="Search by Generic Name">

            </div>


            <div class="search-box">

                <input
                    id="strengthSearch"
                    type="text"
                    placeholder="Search by Strength">

            </div>


            <div class="search-box">

                <input
                    id="dosageSearch"
                    type="text"
                    placeholder="Search by Dosage Form">

            </div>


            <button
                class="clear-btn"
                onclick="clearAllSearchesAndFilters()">

                Clear Search & Filters

            </button>

        </div>

    </div>


    <!-- =================================================
         THIQA SHEET
    ================================================== -->

    <div
        id="thiqaSheet"
        class="sheet active">

        <div
            id="thiqaCount"
            class="count-bar">

            Loading...

        </div>

        <div
            id="thiqaArea"
            class="excel-area">

            <div
                id="thiqaHeader"
                class="excel-header">
            </div>

            <div
                id="thiqaVirtual"
                class="virtual-content">
            </div>

        </div>

    </div>


    <!-- =================================================
         HAAD SHEET
    ================================================== -->

    <div
        id="haadSheet"
        class="sheet">

        <div
            id="haadCount"
            class="count-bar">

            Loading...

        </div>

        <div
            id="haadArea"
            class="excel-area">

            <div
                id="haadHeader"
                class="excel-header">
            </div>

            <div
                id="haadVirtual"
                class="virtual-content">
            </div>

        </div>

    </div>


</div>


<!-- =====================================================
     FILTER POPUP
====================================================== -->

<div
    id="filterPopup"
    class="filter-popup">

    <div
        id="filterPopupHeader"
        class="filter-popup-header">

        Filter

    </div>


    <div class="filter-search">

        <input
            id="filterValueSearch"
            type="text"
            placeholder="Search values..."
            oninput="renderFilterValues()">

    </div>


    <div class="filter-actions">

        <button
            onclick="selectAllFilterValues()">

            Select All

        </button>

        <button
            onclick="clearAllFilterValues()">

            Clear All

        </button>

    </div>


    <div
        id="filterValues"
        class="filter-values">
    </div>


    <div class="filter-footer">

        <button
            class="cancel-filter"
            onclick="cancelColumnFilter()">

            Cancel

        </button>

        <button
            class="apply-filter"
            onclick="applyColumnFilter()">

            Apply

        </button>

    </div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const ROW_HEIGHT = 32;

const BUFFER_ROWS = 50;


/* =====================================================
   DATA
===================================================== */

let thiqaData = [];

let haadData = [];

let thiqaResults = [];

let haadResults = [];


/* =====================================================
   COLUMNS
===================================================== */

let thiqaColumns = [];

let haadColumns = [];


/* =====================================================
   FILTERS
===================================================== */

let thiqaFilters = {};

let haadFilters = {};


/* =====================================================
   CURRENT FILTER POPUP
===================================================== */

let currentFilterType = null;

let currentFilterColumn = null;


/* =====================================================
   HAAD FIXED COLUMN ORDER
===================================================== */

const HAAD_COLUMNS = [

    "Drug Code",

    "Insurance Plan",

    "Package Name",

    "Generic Code",

    "Generic Name",

    "Strength",

    "Dosage Form",

    "Package Size",

    "Dispense Mode",

    "Package Price to Public",

    "Package Price to Pharmacy",

    "Unit Price to Public",

    "Unit Price to Pharmacy",

    "Status",

    "Delete Effective Date",

    "Last Change Date",

    "Agent Name",

    "Manufacturer Name",

    "Insurance Coverage For Government Funded Program",

    "UPP Scope",

    "Included in Thiqa/ABM - other than 1&7 - Drug Formulary",

    "Included In Basic Drug Formulary",

    "Included In ABM 1 Drug Formulary",

    "Included In ABM 7 Drug Formulary",

    "Unit Markup",

    "Package Markup",

    "Thiqa Max. Reimbursement Price (Package)",

    "Thiqa co-pay amount (package)",

    "Basic co-pay amount (package)",

    "UPP Effective Date",

    "UPP Updated Date",

    "UPP Expiry Date"

];


/* =====================================================
   COLUMN WIDTH
===================================================== */

function getColumnWidth(column) {

    const lower =
        column.toLowerCase();

    if (
        lower.includes("generic name") ||
        lower.includes("package name") ||
        lower.includes("manufacturer") ||
        lower.includes("agent name") ||
        lower.includes("insurance coverage") ||
        lower.includes("formulary")
    ) {
        return 260;
    }

    if (
        lower.includes("dosage") ||
        lower.includes("strength")
    ) {
        return 150;
    }

    if (
        lower.includes("price") ||
        lower.includes("markup") ||
        lower.includes("reimbursement") ||
        lower.includes("copay")
    ) {
        return 145;
    }

    if (
        lower.includes("date")
    ) {
        return 135;
    }

    return 145;
}


/* =====================================================
   GET VALUE
===================================================== */

function getValue(row, column) {

    if (!row) {
        return "";
    }

    if (
        Object.prototype.hasOwnProperty.call(
            row,
            column
        )
    ) {
        return row[column];
    }

    const target =
        column
            .trim()
            .toLowerCase();

    for (
        const key of Object.keys(row)
    ) {

        if (
            key
                .trim()
                .toLowerCase() === target
        ) {
            return row[key];
        }
    }

    return "";
}


/* =====================================================
   VALUE TO TEXT
===================================================== */

function valueToText(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    if (
        typeof value === "object"
    ) {
        try {
            return JSON.stringify(value);
        }
        catch {
            return String(value);
        }
    }

    return String(value);
}


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(columns, names) {

    for (
        const wanted of names
    ) {

        const found =
            columns.find(
                col =>
                    col
                        .trim()
                        .toLowerCase() ===
                    wanted
                        .trim()
                        .toLowerCase()
            );

        if (found) {
            return found;
        }
    }

    return null;
}


/* =====================================================
   SEARCH COLUMNS
===================================================== */

function getSearchColumns(type) {

    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;

    return {

        brand:
            findColumn(
                columns,
                [
                    "Brand Name",
                    "Brand",
                    "Product Name",
                    "proactive name",
                    "Package Name"
                ]
            ),

        generic:
            findColumn(
                columns,
                [
                    "Generic Name"
                ]
            ),

        strength:
            findColumn(
                columns,
                [
                    "Strength"
                ]
            ),

        dosage:
            findColumn(
                columns,
                [
                    "Dosage Form",
                    "Dosage form"
                ]
            )
    };
}


/* =====================================================
   SEARCH MATCH
=====================================================

   % means AND.

   Example:

   160%5%12.5

   means the same cell must contain:

   160
   AND
   5
   AND
   12.5

   Order does NOT matter.
===================================================== */

function matchesAndSearch(
    value,
    search
) {

    if (
        !search ||
        !search.trim()
    ) {
        return true;
    }

    const text =
        valueToText(value)
            .toLowerCase();

    const terms =
        search
            .toLowerCase()
            .split("%")
            .map(
                term =>
                    term.trim()
            )
            .filter(
                term =>
                    term.length > 0
            );

    return terms.every(
        term =>
            text.includes(term)
    );
}


/* =====================================================
   GET SEARCH VALUES
===================================================== */

function getSearchValues() {

    return {

        brand:
            document
                .getElementById(
                    "brandSearch"
                )
                .value,

        generic:
            document
                .getElementById(
                    "genericSearch"
                )
                .value,

        strength:
            document
                .getElementById(
                    "strengthSearch"
                )
                .value,

        dosage:
            document
                .getElementById(
                    "dosageSearch"
                )
                .value

    };
}


/* =====================================================
   FILTER ONE ROW
===================================================== */

function rowPassesFilters(
    row,
    filters
) {

    /*
       Every column filter must pass.

       Therefore:

       Column A filter
       AND
       Column B filter
       AND
       Column C filter
    */

    for (
        const column of Object.keys(filters)
    ) {

        const selected =
            filters[column];

        /*
           Empty selection means:
           user selected NOTHING.

           Excel equivalent:
           no rows should match.
        */

        if (
            selected.size === 0
        ) {
            return false;
        }


        const value =
            valueToText(
                getValue(
                    row,
                    column
                )
            );


        /*
           Multiple selected values
           within SAME column are OR.
        */

        if (
            !selected.has(value)
        ) {
            return false;
        }

    }

    return true;
}


/* =====================================================
   FILTER DATA
===================================================== */

function filterData(
    data,
    type
) {

    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    const searches =
        getSearchValues();


    const searchColumns =
        getSearchColumns(type);


    return data.filter(
        row => {

            /* =========================================
               SEARCH BAR FILTERS
            ========================================= */

            if (
                searchColumns.brand &&
                !matchesAndSearch(
                    getValue(
                        row,
                        searchColumns.brand
                    ),
                    searches.brand
                )
            ) {
                return false;
            }


            if (
                searchColumns.generic &&
                !matchesAndSearch(
                    getValue(
                        row,
                        searchColumns.generic
                    ),
                    searches.generic
                )
            ) {
                return false;
            }


            if (
                searchColumns.strength &&
                !matchesAndSearch(
                    getValue(
                        row,
                        searchColumns.strength
                    ),
                    searches.strength
                )
            ) {
                return false;
            }


            if (
                searchColumns.dosage &&
                !matchesAndSearch(
                    getValue(
                        row,
                        searchColumns.dosage
                    ),
                    searches.dosage
                )
            ) {
                return false;
            }


            /* =========================================
               EXCEL COLUMN FILTERS
            ========================================= */

            if (
                !rowPassesFilters(
                    row,
                    filters
                )
            ) {
                return false;
            }


            return true;

        }
    );
}


/* =====================================================
   APPLY SEARCHES + FILTERS
===================================================== */

function applySearches() {

    thiqaResults =
        filterData(
            thiqaData,
            "thiqa"
        );

    haadResults =
        filterData(
            haadData,
            "haad"
        );


    renderVirtualTable(
        "thiqa"
    );

    renderVirtualTable(
        "haad"
    );


    updateCount(
        "thiqa"
    );

    updateCount(
        "haad"
    );

}


/* =====================================================
   DELAYED SEARCH
===================================================== */

let searchTimer = null;

function delayedSearch() {

    clearTimeout(
        searchTimer
    );

    searchTimer =
        setTimeout(
            () => {

                applySearches();

            },
            120
        );

}


/* =====================================================
   RENDER HEADER
===================================================== */

function renderHeader(type) {

    const header =
        document.getElementById(
            type === "thiqa"
                ? "thiqaHeader"
                : "haadHeader"
        );

    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    header.innerHTML = "";

    header.style.gridTemplateColumns =
        columns
            .map(
                column =>
                    `${getColumnWidth(column)}px`
            )
            .join(" ");


    columns.forEach(
        column => {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "header-cell";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "header-title";

            title.textContent =
                column;


            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "filter-btn";


            if (
                hasActiveFilter(
                    type,
                    column
                )
            ) {

                button.classList.add(
                    "active"
                );

                button.textContent =
                    "✓";

            }
            else {

                button.textContent =
                    "▼";

            }


            button.title =
                "Filter";


            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    openFilter(
                        type,
                        column,
                        button
                    );

                }
            );


            cell.appendChild(
                title
            );

            cell.appendChild(
                button
            );


            header.appendChild(
                cell
            );

        }
    );

}


/* =====================================================
   ACTIVE FILTER
===================================================== */

function hasActiveFilter(
    type,
    column
) {

    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    return Object.prototype.hasOwnProperty.call(
        filters,
        column
    );

}


/* =====================================================
   RENDER VIRTUAL TABLE
===================================================== */

function renderVirtualTable(type) {

    const area =
        document.getElementById(
            type === "thiqa"
                ? "thiqaArea"
                : "haadArea"
        );

    const virtual =
        document.getElementById(
            type === "thiqa"
                ? "thiqaVirtual"
                : "haadVirtual"
        );


    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    const columns =
        type === "thiqa"
            ? thiqaColumns
            : haadColumns;


    virtual.innerHTML = "";


    /*
       Total virtual height.
    */

    virtual.style.height =
        (
            data.length *
            ROW_HEIGHT
        ) + "px";


    virtual.style.width =
        "max-content";


    virtual.style.minWidth =
        "100%";


    /*
       Create a function that draws
       only the visible rows.
    */

    function drawRows() {

        virtual.innerHTML = "";


        const scrollTop =
            area.scrollTop;


        const viewportHeight =
            area.clientHeight;


        let start =
            Math.floor(
                scrollTop /
                ROW_HEIGHT
            ) -
            BUFFER_ROWS;


        let end =
            Math.ceil(
                (
                    scrollTop +
                    viewportHeight
                ) /
                ROW_HEIGHT
            ) +
            BUFFER_ROWS;


        start =
            Math.max(
                0,
                start
            );


        end =
            Math.min(
                data.length,
                end
            );


        for (
            let i = start;
            i < end;
            i++
        ) {

            const row =
                data[i];


            const rowElement =
                document.createElement(
                    "div"
                );


            rowElement.className =
                "data-row";


            rowElement.style.top =
                (
                    i *
                    ROW_HEIGHT
                ) + "px";


            rowElement.style.gridTemplateColumns =
                columns
                    .map(
                        column =>
                            `${getColumnWidth(column)}px`
                    )
                    .join(" ");


            columns.forEach(
                column => {

                    const cell =
                        document.createElement(
                            "div"
                        );


                    cell.className =
                        "data-cell";


                    const value =
                        valueToText(
                            getValue(
                                row,
                                column
                            )
                        );


                    cell.textContent =
                        value;


                    /*
                       YES / NO colours.
                    */

                    const lower =
                        value
                            .trim()
                            .toLowerCase();


                    if (
                        lower === "yes" ||
                        lower === "thiqa"
                    ) {

                        cell.classList.add(
                            "yes-value"
                        );

                    }


                    if (
                        lower === "no"
                    ) {

                        cell.classList.add(
                            "no-value"
                        );

                    }


                    rowElement.appendChild(
                        cell
                    );

                }
            );


            virtual.appendChild(
                rowElement
            );

        }

    }


    drawRows();


    /*
       Save handler so we can remove
       the old handler before adding
       another one.
    */

    if (
        area._virtualHandler
    ) {

        area.removeEventListener(
            "scroll",
            area._virtualHandler
        );

    }


    area._virtualHandler =
        () => {

            requestAnimationFrame(
                drawRows
            );

        };


    area.addEventListener(
        "scroll",
        area._virtualHandler,
        {
            passive: true
        }
    );


    /*
       Always start filtered result
       from top.
    */

    area.scrollTop = 0;

}


/* =====================================================
   COUNT
===================================================== */

function updateCount(type) {

    const count =
        document.getElementById(
            type === "thiqa"
                ? "thiqaCount"
                : "haadCount"
        );


    const data =
        type === "thiqa"
            ? thiqaResults
            : haadResults;


    const total =
        type === "thiqa"
            ? thiqaData.length
            : haadData.length;


    count.textContent =
        `Showing ${data.length.toLocaleString()} of ${total.toLocaleString()} rows`;

}


/* =====================================================
   SWITCH SHEET
===================================================== */

function switchSheet(type) {

    const thiqaSheet =
        document.getElementById(
            "thiqaSheet"
        );

    const haadSheet =
        document.getElementById(
            "haadSheet"
        );


    const thiqaTab =
        document.getElementById(
            "thiqaTab"
        );

    const haadTab =
        document.getElementById(
            "haadTab"
        );


    if (
        type === "thiqa"
    ) {

        thiqaSheet.classList.add(
            "active"
        );

        haadSheet.classList.remove(
            "active"
        );

        thiqaTab.classList.add(
            "active"
        );

        haadTab.classList.remove(
            "active"
        );

    }
    else {

        haadSheet.classList.add(
            "active"
        );

        thiqaSheet.classList.remove(
            "active"
        );

        haadTab.classList.add(
            "active"
        );

        thiqaTab.classList.remove(
            "active"
        );

    }


    closeFilterPopup();

}


/* =====================================================
   OPEN COLUMN FILTER
===================================================== */

function openFilter(
    type,
    column,
    button
) {

    currentFilterType =
        type;

    currentFilterColumn =
        column;


    const popup =
        document.getElementById(
            "filterPopup"
        );


    const popupHeader =
        document.getElementById(
            "filterPopupHeader"
        );


    popupHeader.textContent =
        "Filter: " + column;


    document.getElementById(
        "filterValueSearch"
    ).value = "";


    const data =
        type === "thiqa"
            ? thiqaData
            : haadData;


    /*
       IMPORTANT:

       Values come from the ORIGINAL
       full dataset, not the already
       filtered result.

       This is how Excel behaves.
    */

    const valueSet =
        new Set();


    data.forEach(
        row => {

            const value =
                valueToText(
                    getValue(
                        row,
                        column
                    )
                );

            valueSet.add(
                value
            );

        }
    );


    const allValues =
        Array.from(
            valueSet
        ).sort(
            (a, b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
        );


    /*
       Existing filter:

       restore the user's previous
       selection.

       No filter:

       everything selected.
    */

    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    let selected;


    if (
        Object.prototype.hasOwnProperty.call(
            filters,
            column
        )
    ) {

        selected =
            new Set(
                filters[column]
            );

    }
    else {

        selected =
            new Set(
                allValues
            );

    }


    popup._allValues =
        allValues;

    popup._selected =
        selected;


    renderFilterValues();


    /*
       Position popup below button.
    */

    const rect =
        button.getBoundingClientRect();


    popup.style.display =
        "block";


    const popupWidth =
        popup.offsetWidth;


    const popupHeight =
        popup.offsetHeight;


    let left =
        rect.left;


    let top =
        rect.bottom + 4;


    /*
       Keep popup inside screen.
    */

    if (
        left +
        popupWidth >
        window.innerWidth
    ) {

        left =
            window.innerWidth -
            popupWidth -
            10;

    }


    if (
        left < 5
    ) {

        left = 5;

    }


    if (
        top +
        popupHeight >
        window.innerHeight
    ) {

        top =
            rect.top -
            popupHeight -
            4;

    }


    if (
        top < 5
    ) {

        top = 5;

    }


    popup.style.left =
        left + "px";


    popup.style.top =
        top + "px";

}


/* =====================================================
   RENDER FILTER VALUES
===================================================== */

function renderFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    const container =
        document.getElementById(
            "filterValues"
        );


    const search =
        document.getElementById(
            "filterValueSearch"
        )
        .value
        .trim()
        .toLowerCase();


    const allValues =
        popup._allValues || [];


    const selected =
        popup._selected ||
        new Set();


    container.innerHTML =
        "";


    const filteredValues =
        allValues.filter(
            value =>
                value
                    .toLowerCase()
                    .includes(search)
        );


    if (
        filteredValues.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.style.padding =
            "15px";

        empty.style.color =
            "#777";

        empty.textContent =
            "No values found";

        container.appendChild(
            empty
        );

        return;

    }


    filteredValues.forEach(
        value => {

            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "filter-value";


            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.checked =
                selected.has(
                    value
                );


            checkbox.addEventListener(
                "change",
                () => {

                    if (
                        checkbox.checked
                    ) {

                        selected.add(
                            value
                        );

                    }
                    else {

                        selected.delete(
                            value
                        );

                    }

                }
            );


            const text =
                document.createElement(
                    "span"
                );


            text.textContent =
                value === ""
                    ? "(Blank)"
                    : value;


            label.appendChild(
                checkbox
            );

            label.appendChild(
                text
            );


            container.appendChild(
                label
            );

        }
    );

}


/* =====================================================
   SELECT ALL
===================================================== */

function selectAllFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    popup._selected =
        new Set(
            popup._allValues
        );


    renderFilterValues();

}


/* =====================================================
   CLEAR ALL FILTER VALUES
===================================================== */

function clearAllFilterValues() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    popup._selected =
        new Set();


    renderFilterValues();

}


/* =====================================================
   APPLY COLUMN FILTER
===================================================== */

function applyColumnFilter() {

    if (
        !currentFilterType ||
        !currentFilterColumn
    ) {
        return;
    }


    const type =
        currentFilterType;


    const column =
        currentFilterColumn;


    const popup =
        document.getElementById(
            "filterPopup"
        );


    const allValues =
        popup._allValues || [];


    const selected =
        popup._selected ||
        new Set();


    const filters =
        type === "thiqa"
            ? thiqaFilters
            : haadFilters;


    /*
       USER SELECTED EVERYTHING

       This is equivalent to no filter.

       Remove the filter completely.
    */

    if (
        selected.size ===
        allValues.length
    ) {

        delete filters[column];

    }

    /*
       USER SELECTED NOTHING

       Keep an empty filter.

       Result = zero rows.

       This is important because
       Excel allows a filter with
       nothing selected.
    */

    else if (
        selected.size === 0
    ) {

        filters[column] =
            new Set();

    }

    /*
       USER SELECTED SOME VALUES

       Save exactly those values.
    */

    else {

        filters[column] =
            new Set(
                selected
            );

    }


    closeFilterPopup();


    /*
       Update header so the
       filter button becomes blue.
    */

    renderHeader(
        type
    );


    /*
       Re-run BOTH search and
       filter systems.
    */

    applySearches();

}


/* =====================================================
   CANCEL FILTER
===================================================== */

function cancelColumnFilter() {

    closeFilterPopup();

}


/* =====================================================
   CLOSE FILTER POPUP
===================================================== */

function closeFilterPopup() {

    const popup =
        document.getElementById(
            "filterPopup"
        );


    popup.style.display =
        "none";


    currentFilterType =
        null;

    currentFilterColumn =
        null;

}

   CLEAR EVERYTHING
===================================================== */

function clearAllSearchesAndFilters() {

    /*
       Close popup.
    */

    closeFilterPopup();


    /*
       Clear all four search boxes.
    */

    document.getElementById(
        "brandSearch"
    ).value = "";


    document.getElementById(
        "genericSearch"
    ).value = "";


    document.getElementById(
        "strengthSearch"
    ).value = "";


    document.getElementById(
        "dosageSearch"
    ).value = "";


    /*
       Completely remove ALL
       column filters.
    */

    thiqaFilters = {};

    haadFilters = {};


    /*
       Restore original data.
    */

    thiqaResults =
        thiqaData.slice();


    haadResults =
        haadData.slice();


    /*
       Rebuild headers.
    */

    renderHeader(
        "thiqa"
    );

    renderHeader(
        "haad"
    );


    /*
       Rebuild tables.
    */

    renderVirtualTable(
        "thiqa"
    );

    renderVirtualTable(
        "haad"
    );


    /*
       Reset scroll position.
    */

    document.getElementById(
        "thiqaArea"
    ).scrollTop = 0;


    document.getElementById(
        "thiqaArea"
    ).scrollLeft = 0;


    document.getElementById(
        "haadArea"
    ).scrollTop = 0;


    document.getElementById(
        "haadArea"
    ).scrollLeft = 0;


    /*
       Update counts.
    */

    updateCount(
        "thiqa"
    );

    updateCount(
        "haad"
    );

}

/* =====================================================
   LOAD JSON
===================================================== */

async function loadData() {

    try {

        /*
           Load BOTH JSON files
           at the same time.
        */

        const [
            thiqaResponse,
            haadResponse
        ] =
            await Promise.all([

                fetch(
                    "data.json?v=" +
                    Date.now(),
                    {
                        cache:
                            "no-store"
                    }
                ),

                fetch(
                    "HAAD_LIST.json?v=" +
                    Date.now(),
                    {
                        cache:
                            "no-store"
                    }
                )

            ]);


        if (
            !thiqaResponse.ok
        ) {

            throw new Error(
                "Could not load data.json"
            );

        }


        if (
            !haadResponse.ok
        ) {

            throw new Error(
                "Could not load HAAD_LIST.json"
            );

        }


        thiqaData =
            await thiqaResponse.json();


        haadData =
            await haadResponse.json();


        /*
           Make sure the JSON files
           contain arrays.
        */

        if (
            !Array.isArray(
                thiqaData
            )
        ) {

            throw new Error(
                "data.json must contain an array of records."
            );

        }


        if (
            !Array.isArray(
                haadData
            )
        ) {

            throw new Error(
                "HAAD_LIST.json must contain an array of records."
            );

        }


        /*
           Thiqa columns come from
           the JSON itself.
        */

        if (
            thiqaData.length > 0
        ) {

            thiqaColumns =
                Object.keys(
                    thiqaData[0]
                );

        }


        /*
           HAAD uses the exact fixed
           column order requested.
        */

        haadColumns =
            HAAD_COLUMNS.filter(
                column => {

                    if (
                        haadData.length === 0
                    ) {
                        return true;
                    }

                    return haadData.some(
                        row =>
                            Object.prototype.hasOwnProperty.call(
                                row,
                                column
                            )
                    );

                }
            );


        /*
           If some HAAD column names
           have slightly different
           capitalization, include
           matching actual columns.
        */

        if (
            haadData.length > 0
        ) {

            const actualKeys =
                Object.keys(
                    haadData[0]
                );


            haadColumns =
                HAAD_COLUMNS.map(
                    wanted => {

                        const exact =
                            actualKeys.find(
                                key =>
                                    key === wanted
                            );

                        if (
                            exact
                        ) {
                            return exact;
                        }


                        const insensitive =
                            actualKeys.find(
                                key =>
                                    key
                                        .trim()
                                        .toLowerCase() ===
                                    wanted
                                        .trim()
                                        .toLowerCase()
                            );


                        return insensitive ||
                               null;

                    }
                ).filter(
                    Boolean
                );

        }


        /*
           Initial results = complete
           original data.
        */

        thiqaResults =
            thiqaData.slice();


        haadResults =
            haadData.slice();


        /*
           Draw headers.
        */

        renderHeader(
            "thiqa"
        );

        renderHeader(
            "haad"
        );


        /*
           Draw tables.
        */

        renderVirtualTable(
            "thiqa"
        );

        renderVirtualTable(
            "haad"
        );


        /*
           Update counts.
        */

        updateCount(
            "thiqa"
        );

        updateCount(
            "haad"
        );

    }

    catch (error) {

        console.error(
            error
        );


        const message =
            document.createElement(
                "div"
            );


        message.style.padding =
            "20px";

        message.style.color =
            "#b00020";

        message.style.fontWeight =
            "bold";

        message.innerHTML =
            `
            Error loading the insurance lists.<br><br>
            ${error.message}
            <br><br>
            Make sure these files are in the same
            GitHub Pages folder as index.html:
            <br>
            <b>data.json</b>
            <br>
            <b>HAAD_LIST.json</b>
            `;


        document.body.appendChild(
            message
        );

    }

}


/* =====================================================
   START
===================================================== */

loadData();
